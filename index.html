      explain: 'What do you think? = どう思う？「どう」でも英語は What を使う（How do you think? は誤り）。"What do you think about this plan?"（この計画についてどう思う？）。' },
    { id: 'p92', q: '「お気持ちはわかります、でも〜」を英語で？', choices: ['I know you, but...', 'I understand, but...', 'I think you, but...', 'I feel you are, but...'], correct: 1,
      explain: 'I understand, but... = お気持ちはわかります、でも〜。反論する前のクッション言葉。"I understand how you feel, but maybe there\'s another way."（お気持ちはわかります、でも別の方法があるかも）。' },
    { id: 'p93', q: '「全部独り占めするのは少しわがままかな」を英語で？', choices: ['It would be selfish to keep them all for myself', 'It is selfish keeping them all', 'I am selfish to keep all', 'Keeping all is selfish for me'], correct: 0,
      explain: 'It would be selfish to ~ = 〜するのは(ちょっと)わがままかな。would で「〜したら…だろう」と控えめに。"It would be rude to leave early."（早く帰るのは失礼かな）。' },
    { id: 'p94', q: '「Wi-Fiにつないだ」を英語で？', choices: ['I connected wi-fi', 'I connected to wi-fi', 'I connected with wi-fi', 'I connected in wi-fi'], correct: 1,
      explain: 'connect to ~ = 〜につなぐ（接続先には to）。"I connected to the wi-fi at the cafe."（カフェでWi-Fiにつないだ）。' },
    { id: 'p95', q: '「うまくいかなかった」を英語で？', choices: ['I was not going well', "it didn't go well", 'I did not go well', 'it was not good well'], correct: 1,
      explain: 'it didn\'t go well = うまくいかなかった（主語は it = その試み）。go well は「物事がうまく進む」。"The interview didn\'t go well."（面接はうまくいかなかった）。' },
    { id: 'p96', q: '「リスニングが上達しない」を英語で？', choices: ['Listening is not getting better', "I'm not getting better at listening", 'Listening was not doing better', "I'm not good listening"], correct: 1,
      explain: 'get better at ~ = 〜が上達する（自分が主語）。"I want to get better at cooking."（料理が上手くなりたい）。listening は「もの」なので自分を主語にするのが自然。' },
    { id: 'p97', q: '「リスニングもスピーキングも上達しない」の正しい接続詞は？', choices: ['at listening and speaking', 'at listening or speaking', 'at listening nor speaking', 'at listening but speaking'], correct: 1,
      explain: '否定文では and ではなく or を使う。"I\'m not getting better at listening or speaking."（リスニングもスピーキングも上達しない）。"I don\'t like coffee or tea."（コーヒーも紅茶も好きじゃない）。' },
    { id: 'p98', q: '「一人部屋はAIスピーキングに向いてそう」を英語で？', choices: ['A single room may be feeling good with AI speaking', 'A single room may be better for AI speaking', 'A single room feels good to AI speaking', 'A single room is good with AI speaking'], correct: 1,
      explain: 'be better for ~ = 〜に向いている。"This chair is better for your back."（この椅子は腰にいい）。feel good with は不自然。' },
    { id: 'p99', q: '「やっとキティちゃん3種類ゲット！」の「やっと」を英語で？', choices: ['At last finally', 'Finally', 'In the end finally', 'Lastly'], correct: 1,
      explain: 'Finally = やっと・ついに（長く待った末に）。"Finally, I got three kinds of Hello Kitty!"（やっとキティちゃん3種類ゲット！）。文頭に置いて達成感を表せる。' },
    { id: 'p100', q: '「体調がまだ良くなかった」を英語で？', choices: ['I was not feeling good yet', 'I am not feeling good yet', 'I was not feel good yet', 'I did not feeling good yet'], correct: 0,
      explain: 'was not feeling good = 体調が良くなかった（過去進行形で「その時の状態」）。yet = まだ（否定文で）。"I wasn\'t feeling well yet, but I went out."（まだ体調は良くなかったけど出かけた）。' },
    { id: 'p101', q: '「金曜に一日中スピーキングを練習する」の語順で自然なのは？', choices: ['practice speaking on Friday all day', 'practice speaking all day on Friday', 'practice all day speaking on Friday', 'practice on Friday speaking all day'], correct: 1,
      explain: '時間の語順：小さいまとまり（all day 一日中）→ 大きいまとまり（on Friday 金曜に）。"I studied all day on Sunday."（日曜は一日中勉強した）。' },
    { id: 'p102', q: '「日本のと少し味が違う」を英語で？', choices: ['different a little to Japanese one', 'a little different from the Japanese one', 'a little different to Japanese one', 'different from a little Japanese one'], correct: 1,
      explain: 'a little different from ~ = 〜と少し違う。「少し」は different の前。「〜と違う」は different from（基本）。"My answer is a little different from yours."（私の答えは君のと少し違う）。' },
    { id: 'p103', q: '「久しぶりに食べたピザ」を英語で？', choices: ['the pizza which I ate long time no see', "the pizza which I hadn't eaten in a long time", 'the pizza I ate after long time', 'the pizza long time no see'], correct: 1,
      explain: "which I hadn't eaten in a long time = 久しぶりに食べた（しばらく食べていなかった）。long time no see は人への挨拶専用で、食べ物には使えない！過去完了 hadn't eaten で「それまで食べていなかった」を表す。" },
    { id: 'p104', q: '「もう行くことはなさそう」を英語で？', choices: ['I would never go there', "I don't think I'll go there again", 'I never go there again', "I can't go there"], correct: 1,
      explain: "I don't think I'll go there again. = もう行かなさそう（軽い気持ち）。would never go there は「何があっても絶対行かない」と強すぎる。やわらかい否定は I don't think I'll ~ が便利。" },
    { id: 'p105', q: 'ホテルで「ゴミを集めて、シーツを替えて、毛布を1枚もらえますか」をまとめると？', choices: ['Please do trash, sheet, blanket', 'Could you please collect the trash, change the sheets, and bring an extra blanket?', 'Can you trash and sheets and blanket?', 'I want trash, sheets, blanket please'], correct: 1,
      explain: 'Could you please A, B, and C? = AとBとCをしてもらえますか？（丁寧な複数依頼）。3つ以上は「A, B, and C」とカンマと and でつなぐ。ホテルやお店での依頼に便利。' },
    { id: 'p106', q: '「行ってみようかな」（ためらい）を英語で？', choices: ["I'll go to", "I'm thinking about going to", 'I go to', 'I want go to'], correct: 1,
      explain: 'I\'m thinking about ~ing = 〜してみようかな（まだ迷っている）。"I\'m thinking about going to the gym."（ジムに行こうかな）。I\'ll go だと決定済みで、ためらいのニュアンスが消える。' },
    { id: 'p107', q: '「電話で話した」を英語で？', choices: ['I called on the phone', 'I talked on the phone', 'I spoke the phone', 'I phoned on'], correct: 1,
      explain: 'talk on the phone = 電話で話す。"I talked with my mom on the phone."（母と電話で話した）。call は「電話をかける」行為で、「話した」中身を伝えるなら talk が自然。' },
    { id: 'p108', q: '「モール内を歩き回った」を英語で？', choices: ['walked around the mall', 'walked in the mall around', 'walked the mall around', 'around walked the mall'], correct: 0,
      explain: 'walk around ~ = 〜を歩き回る。"We walked around the park."（公園を歩き回った）。around は「あちこち」のイメージ。' },
    { id: 'p109', q: '「日本のと同じ」を「同じ商品（前に出たもの）」を指して言うと？', choices: ['same as Japan', 'the same as the Japanese one', 'same Japanese', 'as same as Japan'], correct: 1,
      explain: 'the same as the Japanese one = 日本のと同じ。one は前に出た名詞の繰り返しを避ける代名詞。same には the が必要。"This bag is the same as the one I lost."（このバッグはなくしたのと同じ）。' },
    { id: 'p110', q: '「授業がうまくいった・いい感じだった」を英語で？', choices: ['The class felt good', 'The class went well', 'The class was good in', 'The class did good'], correct: 1,
      explain: 'go well = うまくいく。"The class went well today."（今日の授業はうまくいった）。felt good in class は不自然。物事の成功は go well が定番。' },
    { id: 'p111', q: '「友達ができた」を英語で？', choices: ['I had a friend', 'I made a friend', 'I got a friend', 'I became a friend'], correct: 1,
      explain: 'make a friend = 友達を作る・友達ができる。"I made a friend named Hada."（ハダという友達ができた）。had a friend は「友達がいた（すでに）」で意味が違う。' },
    { id: 'p112', q: '「ハダという名前の友達」を英語で？', choices: ['a friend name Hada', 'a friend named Hada', 'a friend is Hada', 'a friend called name Hada'], correct: 1,
      explain: 'a friend named ~ = 〜という名前の友達。named は「名付けられた」（過去分詞）。"I have a cat named Mochi."（モチという名前の猫を飼っている）。a friend called ~ も同じ意味でOK。' },
    { id: 'p113', q: '「カーペットを敷く」を英語で？', choices: ['stand a carpet', 'lay a carpet / put down a carpet', 'hang a carpet', 'arrange a carpet'], correct: 1,
      explain: 'lay a carpet / put down a carpet = カーペットを敷く。"We put down a new carpet last week."（先週新しいカーペットを敷いた）。put down が一番やさしい言い方。' },
    { id: 'p114', q: '「元の場所に戻して」を英語で？', choices: ['Put it back', 'Return it back', 'Put back it', 'Set it back'], correct: 0,
      explain: 'put it back = 元の場所に戻す。代名詞 it は put と back の間。"Please put it back where it was."（元あった場所に戻して）。return（返す）は借りた物に使う。' },
    { id: 'p115', q: '「ゴミを捨てる」で一番よく使うのは？', choices: ['drop the trash', 'throw away the trash', 'put the trash', 'leave the trash'], correct: 1,
      explain: 'throw away ~ = 〜を捨てる（一番一般的）。"I threw away the old shoes."（古い靴を捨てた）。throw out も同じ意味。過去形は threw（不規則）。' },
    { id: 'p116', q: '「絵をまっすぐ壁にかけたい」を英語で？', choices: ['I want to hang the picture straight on the wall', 'I want to put the picture in the wall', 'I want to hang the picture on wall straight', 'I want to set the picture to the wall'], correct: 0,
      explain: 'hang ~ on the wall = 壁に〜をかける。「まっすぐに」は straight。「壁に」の前置詞は on。"Hang the clock straight on the wall."（時計をまっすぐ壁にかけて）。' },
    { id: 'p117', q: '「太ってきた」をやわらかく言うと？', choices: ["I'm getting fat", "I'm gaining weight", "I'm being fat", "I have fat"], correct: 1,
      explain: 'gain weight / put on weight = 体重が増える（やわらかい）。"I\'ve gained weight recently."（最近太ってきた）。fat は直接的でキツく聞こえることがあるので、gain weight が無難。' },
    { id: 'p118', q: '「体に悪いとわかっているもの」を英語で？', choices: ['things they know are bad for them', 'things they know bad for them', 'things they are knowing bad', 'things bad they know for them'], correct: 0,
      explain: 'things (that) they know are bad for them = 自分に悪いとわかっているもの。関係代名詞 that が省略された形。bad for ~ = 〜にとって悪い。"People eat things they know are bad for them."（人は体に悪いと知りつつ食べる）。' },
    { id: 'p119', q: '「気が散って集中できない」を英語で？', choices: ['My phone distracts me from my homework', 'My phone distracts me to my homework', 'My phone is distract my homework', 'My phone distracted from me'], correct: 0,
      explain: 'distract A from B = BからAの気をそらす。"My phone distracts me from my homework."（スマホのせいで宿題に集中できない）。前置詞は from。' },
    { id: 'p120', q: '「パーティーを開く」で自然なのは？', choices: ['do a party', 'have a party', 'make a party', 'play a party'], correct: 1,
      explain: 'have a party = パーティーを開く（throw a party もOK）。"We had a birthday party for my mom."（母の誕生日パーティーを開いた）。do a party は不自然。' },
    { id: 'p121', q: '「私には合わないかも」とやわらかく言うには？', choices: ['It is bad for me', 'It might be bad for me', 'It will bad for me', 'It is bad to me'], correct: 1,
      explain: 'might be ~ = 〜かもしれない（控えめな推量）。"Too much coffee might be bad for me."（コーヒーの飲みすぎは私に良くないかも）。断定を避けるクッション表現。' },
    { id: 'p122', q: '「日焼け（こんがり健康的）」を英語で？', choices: ['sunburn', 'suntan', 'sunlight', 'sunshine'], correct: 1,
      explain: 'suntan（tan）= こんがりした健康的な日焼け。"She got a nice tan at the beach."（ビーチでいい感じに日焼けした）。一方 sunburn は「赤くヒリヒリする（痛い）日焼け」で別物。' },
    { id: 'p123', q: '「君には関係ないよ」を英語で？', choices: ["It's not your thing", "It's none of your business", "It's nobody to you", "It's not for you"], correct: 1,
      explain: "It's none of your business. = 君には関係ない・口出しするな。\"What I do is none of your business.\"（私が何をしようと君には関係ない）。少しキツい表現なので使う相手に注意。" },
    { id: 'p124', q: '「自分のためだけに生きる」を英語で？', choices: ['live to himself', 'live for himself', 'live by himself', 'live with himself'], correct: 1,
      explain: 'live for ~ = 〜のために生きる。"He lives only for himself."（彼は自分のためだけに生きている）。live by himself（一人で暮らす）とは意味が違うので注意。' },
    { id: 'p125', q: '「友達なしでやっていく」を英語で？', choices: ['get along without friends', 'get along with friends', 'go along without friends', 'get away without friends'], correct: 0,
      explain: 'get along without ~ = 〜なしでやっていく。"I can\'t get along without my phone."（スマホなしではやっていけない）。get along with ~ なら「〜と仲良くやる」で逆の意味。' },
    { id: 'p126', q: '「人と仲良くやっていく」を英語で？', choices: ['get along without people', 'get along with people', 'get over people', 'get along to people'], correct: 1,
      explain: 'get along with ~ = 〜と仲良くやっていく。"She gets along well with her coworkers."（彼女は同僚とうまくやっている）。without（〜なしで）と with（〜と）で意味が真逆。' },
    { id: 'p127', q: '「〜の困ったところは…」を英語で？', choices: ['The trouble of ~ is...', 'The trouble with ~ is...', 'The trouble for ~ is...', 'The trouble to ~ is...'], correct: 1,
      explain: 'The trouble with ~ is... = 〜の困ったところは…。"The trouble with this plan is that it costs too much."（この計画の難点はお金がかかりすぎることだ）。前置詞は with。' },
    { id: 'p128', q: '「わがままを抑えないと、振り回されるよ」を英語で？', choices: ['Master selfishness or it will master you', 'Master selfishness and it masters you', 'Be master selfishness or master you', 'Master to selfishness or it master you'], correct: 0,
      explain: '命令文 + or + 主語 will ~ = 〜しろ、さもないと…するぞ。"Hurry up or you\'ll be late."（急がないと遅刻するよ）。master = 支配する・使いこなす。' },
    { id: 'p129', q: '「フィリピンでは（その商品を）売っていない」を英語で？', choices: ['they sold out in the Philippines', "they don't sell them in the Philippines", 'they are not sell in the Philippines', "they don't selling in the Philippines"], correct: 1,
      explain: 'they don\'t sell them = （店が）それを売っていない。sold out は「売り切れ」で、そもそも扱いがない時は don\'t sell が正しい。"They don\'t sell that brand here."（その銘柄はここでは売っていない）。' },
    { id: 'p130', q: '「お土産を買った方がいい」を英語で？', choices: ['I should buy a souvenir', 'I should buy some souvenirs', 'I should buy souvenir', 'I should buy the souvenir'], correct: 1,
      explain: 'should buy some souvenirs = お土産を（いくつか）買った方がいい。souvenir は数えられる名詞。複数買うなら some souvenirs。"I should buy some snacks."（おやつを買っておこう）。' },
    { id: 'p131', q: '「ちょっと探してみよう」を英語で？', choices: ["I'll try to find them a little", "I'll try finding them a little", "I'll try to looking for them", "I try find them"], correct: 0,
      explain: 'try to + 動詞 = 〜しようとする。look for / find = 探す。"I\'ll try to find a good restaurant."（いいレストランを探してみる）。a little で「ちょっと」を添える。' },
    { id: 'p132', q: '「体に合わない（食べ物が）」を英語で？', choices: ["the food doesn't fit my body", "the food doesn't agree with me", "the food doesn't suit to me", "the food isn't good my body"], correct: 1,
      explain: 'the food doesn\'t agree with me = その食べ物が体に合わない（食べると調子が悪くなる）。"Spicy food doesn\'t agree with me."（辛い物は体に合わない）。簡単には "makes me sick" も使える。' },
    { id: 'p133', q: '「全部がそうとは限らない」を英語で？', choices: ['All of them are not', 'Not all of them', 'Not all them', 'All not of them'], correct: 1,
      explain: 'Not all of them ~ = それら全部が〜なわけではない（一部は違う）。"Not all of them are dangerous."（全部が危険なわけではない）。部分否定の便利な表現。' },
    { id: 'p134', q: '「体に悪い」を中学レベルで簡単に言うと？', choices: ['bad against the body', 'bad for the body', 'bad to the body', 'bad with the body'], correct: 1,
      explain: 'bad for ~ = 〜に悪い。"Too much sugar is bad for your teeth."（砂糖の取りすぎは歯に悪い）。反対は good for ~（〜に良い）。前置詞は for。' },
    { id: 'p135', q: '「最新のパックを買った」を英語で？', choices: ['I bought the new packs', 'I bought the newest packs', 'I bought the most new packs', 'I bought new packs'], correct: 1,
      explain: 'the newest = 最新の（new の最上級 + the）。"I got the newest iPhone."（最新のiPhoneを買った）。new だと「新しい」止まりで「最新」のニュアンスは弱い。' },
    { id: 'p136', q: '「（店に）置いてなかった」を英語で？', choices: ['it was nothing', "they didn't have one", 'there was not', 'it did not exist'], correct: 1,
      explain: "they didn't have one = （店に）置いてなかった。one = 欲しかった商品。\"I wanted the red one, but they didn't have it.\"（赤いのが欲しかったけど、なかった）。it was nothing は「大したことない」で全く別の意味。" },
    { id: 'p137', q: '「ライチュウのぬいぐるみ」を英語で？', choices: ["a Raichu's stuffed toy", 'a Raichu stuffed toy', 'a stuffed toy of Raichu', 'a Raichu of stuffed toy'], correct: 1,
      explain: 'a Raichu stuffed toy = ライチュウのぬいぐるみ。名詞を並べて表す（アポストロフィ s は不要）。"a Pikachu keychain"（ピカチュウのキーホルダー）も同じ作り方。' },
    { id: 'p138', q: '「たくさん用事を済ませた」を自然に言うと？', choices: ['I finished a lot of plans', 'I got a lot of things done', 'I did a lot of plans', 'I ended many things'], correct: 1,
      explain: 'get things done = 用事を片付ける・物事を済ませる。"I got a lot done today."（今日はたくさん片付けた）。finish plans は不自然。get + 物 + done の形を覚えると便利。' },
    { id: 'p139', q: '「（選考のある）仕事に応募した」を英語で？', choices: ['I applied the job', 'I applied for the job', 'I applied to the job', 'I signed up the job'], correct: 1,
      explain: 'apply for ~ = 〜に応募する（選考がある）。"She applied for a scholarship."（彼女は奨学金に応募した）。誰でも登録できるものは sign up for（sign up for a class 授業に登録する）。' },
    { id: 'p140', q: '「1日で全部終わらせた」を英語で？', choices: ['on a day', 'in one day', 'at one day', 'for one day'], correct: 1,
      explain: 'in one day = 1日で（かかった時間）。"I read the whole book in one day."（1日で本を読み切った）。in は「〜という時間の中で」。on a day とは言わない。' },
    { id: 'p141', q: '「各キャラクターに愛着を持つ」を自然に言うと？', choices: ['have an attachment with each character', 'feel attached to each character', 'feel attachment with each character', 'be attach to each character'], correct: 1,
      explain: 'feel attached to ~ = 〜に愛着を持つ。"Players feel attached to each character."（プレイヤーは各キャラに愛着を持つ）。"have an attachment with" は不自然。attached は「くっついた」→気持ちがくっついている＝愛着があるイメージ。' },
    { id: 'p142', q: '「そのプロジェクトの一員になれて嬉しい」を自然に言うと？', choices: ['glad to join it', 'happy to be part of it', 'happy to join in it', 'glad to be a part'], correct: 1,
      explain: "be part of ~ = 〜の一員である。'I'm happy to be part of it.'（その一員になれて嬉しい）。join も間違いではないが、「参加している状態」を表すには be part of が自然。" },
    { id: 'p143', q: '「9時ごろ家に着く」を自然に言うと？', choices: ['the time I arrive at home is 9', 'I get home around 9 pm', 'I arrive to home about 9', 'I reach home in 9 pm'], correct: 1,
      explain: "get home = 家に着く（home は副詞なので to は不要）。around 9 pm = 9時ごろ。'I get home around 9 pm.'が自然。'the time I arrive at home is 21 o clock' のような言い方や24時間表記は日常会話では不自然。" },
    { id: 'p144', q: '「必要なものを持っていく」を自然に言うと？', choices: ['bring something to need', 'bring the things I need', 'bring the need things', 'bring things to needing'], correct: 1,
      explain: "the things I need = 私が必要なもの（関係代名詞that省略）。'I'll bring the things I need to the office.'（必要なものを会社に持っていく）。'something to need' は文法的におかしい表現なので注意。" },
    { id: 'p145', q: '「作るのが面倒だ」を自然に言うと？', choices: ["It's hassled to make", "It's a pain to make", "It's trouble to make", "It's annoyed to make"], correct: 1,
      explain: "It's a pain to ~ = 〜するのが面倒だ（口語でよく使う）。pain は「痛み」だが、a pain で「面倒なこと・厄介なこと」を表す。'It's a pain to make design documents.'（仕様書を作るのは面倒だ）。hassled や annoyed は人の気持ちを表す語なので、この形では不自然。" },
    { id: 'p146', q: '「大変な授業を乗り切った」を自然に言うと？', choices: ['I got over the class', 'I got through the class', 'I got off the class', 'I got out the class'], correct: 1,
      explain: "get through ~ = （大変な期間・仕事）を最後までやり切る。'I got through the tough group class.'（大変なグループ授業を乗り切った）。get over ~ は「（病気・失恋など）から立ち直る」で意味が違う。" },
    { id: 'p147', q: '「最近（このごろ）〜している」と今の習慣を言うときに自然なのは？', choices: ['Recently, I enjoy ~', 'These days, I enjoy ~', 'Now days, I enjoy ~', 'In recent, I enjoy ~'], correct: 1,
      explain: "These days = 最近、このごろ（今も続いている習慣に使う）。'These days, I enjoy watching streams.'（最近は配信を見るのが楽しい）。Recently は完了形（have done）と使うことが多く、今の習慣には These days が自然。" },
    { id: 'p148', q: '「（ゲームで）マスターボールのランクに到達した」を自然に言うと？', choices: ['I achieved the rank', 'I reached the rank', 'I arrived the rank', 'I got up the rank'], correct: 1,
      explain: "reach ~ = （ある段階・ランク）に到達する。'I reached the Master Ball rank.'（マスターボールのランクに到達した）。achieve は「目標を達成する」で使えるが、ランクには reach が自然。arrive は場所に着くときで、後ろに at が必要。" },
    { id: 'p149', q: '日記で「みんなに感謝している」と書くとき自然なのは？', choices: ['I appreciate it', "I'm thankful to them", 'I thank them', 'I have thanks'], correct: 1,
      explain: "be thankful to 人 = 〜に感謝している（気持ちを表す）。'I'm thankful to them.'（みんなに感謝している）。I appreciate it. は相手に直接「ありがとう」と言うときの表現なので、日記で第三者への感謝を書くには不自然。" },
    { id: 'p150', q: '「仕事で（職場で）」を表す自然な言い方は？', choices: ['on my work', 'at work', 'in my work', 'to work'], correct: 1,
      explain: "at work = 仕事中に、職場で（冠詞なしの決まった言い方）。'I finished a task at work.'（仕事で作業を終えた）。on my work とは言わない。at school（学校で）、at home（家で）と同じ形。" },
    { id: 'p151', q: '「これからは（今後は）忙しくなる」の「これからは」は？', choices: ['from now', 'from now on', 'after now', 'since now'], correct: 1,
      explain: "from now on = これから先ずっと、今後は。'I'll be busy from now on.'（これからは忙しくなる）。on を付け忘れやすいので注意。" },
    { id: 'p152', q: '「（だんだん）好きになった」を自然に言うと？', choices: ['I got loving it', 'I came to love it', 'I became loving it', 'I turned to love it'], correct: 1,
      explain: "come to + 動詞の原形 = （だんだん）〜するようになる（気持ちの変化）。'I came to love all the Pokémon.'（ポケモンが全部好きになった）。got loving や became loving は文法的に誤り。" },
    { id: 'p153', q: '「長い間それを見ていない」の「長い間」は？', choices: ['for long while', 'for a long while', 'in a long while', 'during long while'], correct: 1,
      explain: "for a long while = 長い間（while は可算名詞なので a が必要）。'I haven't watched it for a long while.'（長い間それを見ていない）。for a long time も同じ意味でよく使う。" },
    { id: 'p154', q: '「来週それを作り始める（実装を始める）」を自然に言うと？', choices: ["I'll make it next week", "I'll start building it next week", "I'll build up it next week", "I'll making it next week"], correct: 1,
      explain: "start building ~ = 〜を作り始める。'I'll start building it next week.'（来週から作り始める）。make it だけだと「資料を作る」など別の意味と混同しやすいので、実装なら start building / start implementing がはっきりする。" },
    { id: 'p155', q: '「〜できる可能性が高い」を自然に言うと？', choices: ['there are it frequently', 'there is a good chance I can ~', 'it has high possible', 'there is many chance to ~'], correct: 1,
      explain: "there is a good chance (that) ~ = 〜という可能性が高い（定番パターン）。'There is a good chance I can see them.'（彼らに会える可能性が高い）。シンプルに I often ~（よく〜する）と言い換えてもよい。" },
    { id: 'p156', q: '「友達と集まって何かする」の「集まって」を自然に言うと？', choices: ['gather with friends', 'get together with friends', 'meet up together', 'collect with friends'], correct: 1,
      explain: "get together = （人が）集まる、集まって過ごす。'It's fun to get together and do something with friends.'（友達と集まって何かするのは楽しい）。gather は「物を集める」寄りで、人が集まって遊ぶニュアンスには get together が自然。" },
    { id: 'p157', q: '「今日も（昨日に続いて）EWCを観る」の「今日も」は？', choices: ['also today', 'again today', 'too today', 'more today'], correct: 1,
      explain: "again today = 今日もまた（昨日に続いて同じことをする）。'I'll watch EWC again today.'（今日もEWCを観る）。also は「〜もまた（別のことも）」という意味なので、「昨日に続いて今日も」には again today が合う。" },
    { id: 'p158', q: '「結果的に〜になる」を表す自然な言い方は？', choices: ['turn into', 'turn out', 'turn over', 'turn up'], correct: 1,
      explain: "turn out = 結果的に〜になる、（〜だと）判明する。'It turned out well.'（うまくいった）。'It turns out that he was right.'（彼が正しかったと分かった）。意外な結果のニュアンスがある。" },
    { id: 'p159', q: '「最終的に〜することになる」を会話で自然に言うと？', choices: ['end up ~ing', 'end with ~ing', 'finish up ~ing', 'end out ~ing'], correct: 1,
      explain: "end up ~ing = （あれこれあって）最終的に〜することになる。'I ended up staying home.'（結局家にいることになった）。turn out と近いが、end up は「行き着いた結果」を表し、日常会話でとてもよく使う。" },
    { id: 'p160', q: '「注文する」を自然に言うと？', choices: ['make an order', 'place an order', 'put an order', 'do an order'], correct: 1,
      explain: "place an order = 注文する（お店・ネットで）。'I placed an order online.'（ネットで注文した）。order は動詞でも使えるが、'place an order' はていねいで自然な決まった言い方。" },
    { id: 'p161', q: '相手の言い分に「まあいいでしょう／なるほど納得」と返すときは？', choices: ['fair enough', 'enough fair', 'fairly enough', 'fair well'], correct: 0,
      explain: "fair enough = まあいいでしょう、なるほど（相手の言い分に一応納得する返事）。'Fair enough, let's do it your way.'（なるほど、君のやり方でいこう）。完全な同意ではなく「一理あるね」というニュアンス。" },
    { id: 'p162', q: '「勉強する時間を作る」を自然に言うと？', choices: ['make the time studying', 'make time to study', 'make time studying', 'take the time study'], correct: 1,
      explain: "make time to + 動詞 = 〜する時間を作る。'I want to make time to study English.'（英語を勉強する時間を作りたい）。to study（不定詞）で「勉強するために」を表す。make the time studying は誤り。" },
    { id: 'p163', q: '「（練習して）歌えるようになる」を自然に言うと？', choices: ['learn singing', 'learn to sing', 'learn how sing', 'study to sing'], correct: 1,
      explain: "learn to + 動詞 = （練習して）〜できるようになる。'I want to learn to sing this song.'（この歌を歌えるようになりたい）。learn singing より learn to sing が自然。to のあとは動詞の原形。" },
    { id: 'p164', q: '「（友達が）〜してくれて嬉しい」を自然に言うと？', choices: ['I join that he came', "I'm glad that he came", 'I glad he came', 'I happy that he come'], correct: 1,
      explain: "be glad that + 文 = 〜で嬉しい。'I'm glad that he came.'（彼が来てくれて嬉しい）。他人の行動を喜ぶときは join（参加する）ではなく glad that ~ を使う。glad の前に be動詞が必要。" },
    { id: 'p165', q: '「新幹線のチケットを予約する」を正しく言うと？', choices: ['book the Shinkansen', 'book Shinkansen tickets', 'book a Shinkansen ticket ride', 'reserve Shinkansen'], correct: 1,
      explain: "book Shinkansen tickets = 新幹線のチケットを予約する。'I need to book Shinkansen tickets.'（新幹線のチケットを取らないと）。'book the Shinkansen' だと「新幹線そのもの（車両）を予約」という不自然な意味になるので、tickets を付ける。" },
    { id: 'p166', q: '「締め切りに間に合う」を自然に言うと？', choices: ['catch the deadline', 'meet the deadline', 'reach the deadline', 'keep the deadline'], correct: 1,
      explain: "meet the deadline = 締め切りに間に合う。meet は「（条件・基準）を満たす」の意味。'I met the deadline.'（締め切りに間に合った）。meet the requirements（条件を満たす）も同じ使い方。" },
    { id: 'p167', q: '「そのゲームは（遊んで）楽しかった」を自然に言うと？', choices: ['The game was interesting', 'The game was fun', 'The game was funny', 'The game was enjoy'], correct: 1,
      explain: "fun = （体験して）楽しい。ゲーム・遊び・イベントには fun が自然。interesting は「（頭で）興味深い」で、内容や話に使う。funny は「面白い（笑える）」なので意味が違う。" },
    { id: 'p168', q: '「100点満点中70点」を英語で言うと？', choices: ['70 points in 100', '70 out of 100', '70 of 100 points', '70 per 100'], correct: 1,
      explain: "X out of Y = Y点満点中X点。'I'd give it 70 out of 100.'（100点満点で70点というところ）。out of は「〜のうち」を表す。評価を言うときの定番の形。" },
    { id: 'p169', q: '「それらを書き留めておく」を自然に言うと？', choices: ['I will note', 'I will write them down', 'I will note down it', 'I will writing them'], correct: 1,
      explain: "write ~ down = 〜を書き留める。'I'll write them down.'（それらを書き留めておく）。note も「書き留める」だが目的語が必要で、単独の 'I will note' は不自然。them は down の前に置く。" },
    { id: 'p170', q: '「もしお役に立つなら（よろしければ）」と丁寧に申し出るときは？', choices: ['if that will help', 'if that would help', 'if that helps you', 'if that is help'], correct: 1,
      explain: "if that would help = もしそれがお役に立つなら（ていねいな申し出）。would を使うと控えめでやわらかい響きになる。'I can send it to you, if that would help.'（よければ送りますよ）。" },
    { id: 'p171', q: '「元気にやっている・順調だ」を自然に言うと？', choices: ["I'm getting well", "I'm doing well", "I'm going well", "I'm being well"], correct: 1,
      explain: "be doing well = 元気にやっている、順調だ。'I'm doing well.'（元気にやってるよ）。getting well は「（病気から）回復しつつある」という意味なので、ふだんの「順調」には doing well が自然。" },
    { id: 'p172', q: '「それでうまくいく・用が足りる」を表すイディオムは？', choices: ['do the work', 'do the trick', 'do the point', 'make the trick'], correct: 1,
      explain: "do the trick = うまくいく、用が足りる、効果がある。'This tool will do the trick.'（この道具でうまくいくよ）。問題が解決したときの決まった言い方。work（うまくいく）と同じような意味。" },
    { id: 'p173', q: '「必ず〜と伝えてね」と念を押すときは？', choices: ['be sure mention it', 'be sure to mention it', 'sure to mention it', 'be sure of mention it'], correct: 1,
      explain: "be sure to + 動詞 = 必ず〜する。mention = （〜のことを）言う、伝える。'Be sure to mention it.'（必ずそれを伝えてね）。'Don't forget to mention it.' も同じ意味で使える。" },
    { id: 'p174', q: '「家に帰ったらすぐに寝る」の「帰ったらすぐに」を自然に言うと？', choices: ['when I go back home', 'as soon as I get home', 'soon I get home', 'after I go home soon'], correct: 1,
      explain: "as soon as ~ = 〜するとすぐに。'I'll go to bed as soon as I get home.'（家に帰ったらすぐ寝る）。when（〜のとき）より「すぐに」という即座さがはっきり出る。get home で「家に着く」。" },
    { id: 'p175', q: '「（同僚たちの）体調が悪かった」を自然に言うと？', choices: ["they didn't feel better", "they weren't feeling well", "they weren't feeling better", "they didn't good"], correct: 1,
      explain: "not feel well = 体調が悪い。'They weren't feeling well.'（体調が悪かった）。feel better は「（前より）良くなる」という回復の意味なので、「調子が悪い」には well を使う。well（元気で）と better（前より良く）の違いに注意。" },
    { id: 'p176', q: '「夕食にステーキを食べる」を会話で自然に言うと？', choices: ['eat a steak for dinner', 'have a steak for dinner', 'take a steak for dinner', 'do a steak for dinner'], correct: 1,
      explain: "have = 食べる・飲む（会話で自然な言い方）。'I'm gonna have a steak for dinner.'（夕食はステーキにする）。eat も間違いではないが、食事の場面では have のほうが柔らかく自然。have lunch / have coffee も同じ。" },
    { id: 'p177', q: '「スマホだけでゲームを作る」の「〜だけで」を自然に言うと？', choices: ['by only a smartphone', 'with just a smartphone', 'in only a smartphone', 'at just a smartphone'], correct: 1,
      explain: "with just ~ = 〜だけで（道具・手段）。'I made a game with just a smartphone.'（スマホだけでゲームを作った）。道具は with で表し、just（〜だけ）を添えるとカジュアルで自然。using only a smartphone とも言える。" },
    { id: 'p178', q: '「開発環境を構築する」を自然に言うと？', choices: ['build the environment set', 'set up the environment', 'make the environment up', 'construct environment'], correct: 1,
      explain: "set up the environment = 環境を構築する（開発の定番表現）。'I'll set up the development environment.'（開発環境を構築する）。set up（動詞）と setup（名詞）の使い分けにも注意：動作なら set up と2語で書く。" },
    { id: 'p179', q: '「トイレの行列に並んでいる」を自然に言うと？', choices: ['standing on the toilets area', 'waiting in line for the restroom', 'lining at the toilet', 'waiting the restroom queue'], correct: 1,
      explain: "wait in line for ~ = 〜の列に並んで待つ。'I'm waiting in line for the restroom.'（トイレの列に並んでいる）。「トイレ」は restroom / bathroom が丁寧で自然。in line（列の中で）という言い方がポイント。" },
    { id: 'p180', q: '「彼女と一日を過ごした」を自然に言うと？', choices: ['I lived a day with her', 'I spent the day with her', 'I passed a day with her', 'I used the day with her'], correct: 1,
      explain: "spend the day with 人 = 〜と一日を過ごす。'I spent the day with my girlfriend.'（彼女と一日過ごした）。spend（時間を使う・過ごす）が定番で、live（住む・生きる）は使えない。spend-spent-spent の変化にも注意。" },
    { id: 'p181', q: '「仕事で仙台に行く」を自然に言うと？', choices: ['I will work in Sendai', 'I will go to Sendai for work', 'I will go to work Sendai', 'I will working to Sendai'], correct: 1,
      explain: "go to 場所 for work = 仕事で〜へ行く（出張のニュアンス）。'I'll go to Sendai for work tomorrow.'（明日仕事で仙台に行く）。'work in Sendai' だと「仙台で働いている（勤務地）」に聞こえるので、出張なら for work を付ける。" },
    { id: 'p182', q: '「（コードの）バグを見つける」を自然に言うと？', choices: ['find out memory leaks', 'find memory leaks', 'look for out bugs', 'search out the bug'], correct: 1,
      explain: "find = （物・問題を）見つける。'I couldn't find the memory leaks.'（メモリリークを見つけられなかった）。find out は「（情報・事実を）知る・突き止める」なので、物やバグそのものには find を使う。find out the truth（真実を知る）との違いに注意。" },
    { id: 'p183', q: '「けっこう楽しい」の「けっこう」を自然に言うと？', choices: ['a pretty fun', 'pretty fun', 'pretty a fun', 'prettily fun'], correct: 1,
      explain: "pretty + 形容詞 = けっこう〜、なかなか〜（口語の強調）。'The new game is pretty fun.'（新作はけっこう楽しい）。ここの pretty は「かわいい」ではなく副詞。'It was pretty fun.' のように冠詞は不要。" },
    { id: 'p184', q: '「今すぐ練習しなくちゃ！」の「〜しなくちゃ」を会話で自然に言うと？', choices: ['I got to practice', "I've got to practice", 'I get to practice', 'I have got practice'], correct: 1,
      explain: "have got to + 動詞 = 〜しなくちゃ（have to の会話版）。'I've got to practice right now!'（今すぐ練習しなくちゃ！）。I got to だけだと「〜する機会を得た」の意味に。話すときは I've got to → I gotta と縮まる。" },
    { id: 'p185', q: '「今日の朝、お墓参りに行った」の「今日の朝」を自然に言うと？', choices: ['in the morning today', 'this morning', 'today morning', 'at this morning'], correct: 1,
      explain: "this morning = 今朝（1語で言える）。'We visited my family's grave this morning.'（今朝お墓参りに行った）。today と in the morning を両方使うと重複になる。this afternoon / this evening も同じ。ただし「今夜」は tonight（this night とは言わない）。" },
    { id: 'p186', q: '「（もともと知っている）友達に会いに行く」の「会う」は？', choices: ['meet my friend', 'see my friend', 'know my friend', 'watch my friend'], correct: 1,
      explain: "see = （知っている人に）会う。'I went to Hiroshima to see my friend.'（友達に会いに広島へ行った）。meet は「初めて会う」や「待ち合わせる」のニュアンスが強い。旧友との再会は see が自然。" },
    { id: 'p187', q: '「台風が近づいている」を自然に言うと？', choices: ["It's coming typhoon", 'A typhoon is coming', 'The typhoon comes it', 'Typhoon is coming it'], correct: 1,
      explain: "A typhoon is coming. = 台風が来ている・近づいている。台風を主語にして進行形にするのが自然。'It's coming typhoon' は語順が崩れた形。'A storm is coming.'（嵐が来る）も同じ型で、映画のセリフでも定番。" },
    { id: 'p188', q: '「彼女と過ごした」を正しく言うと？', choices: ['I spent with my girlfriend', 'I spent time with my girlfriend', 'I spent to my girlfriend', 'I spend my girlfriend'], correct: 1,
      explain: "spend は「〜を使う」なので、何を使ったか（time / money）が必要。'I spent time with my girlfriend.'（彼女と過ごした）。目的語なしの 'I spent with ~' は文として成立しない。spend money on ~（〜にお金を使う）も同じ形。" },
    { id: 'p189', q: '「TOEICを受ける」を正しく言うと？', choices: ['do TOEIC test', 'take the TOEIC test', 'have TOEIC test', 'get the TOEIC test'], correct: 1,
      explain: "take a/the test = 試験を受ける（do は使わない）。'I'm going to take the TOEIC test this weekend.'（今週末TOEICを受ける）。TOEIC は全部大文字、前に the が必要。冠詞の付け忘れは反復ポイント。" },
    { id: 'p190', q: '「まだクリアしてない」を自然に言うと？', choices: ["it has not finished yet", "I haven't beaten it yet", "it isn't finish yet", "I don't beat it yet"], correct: 1,
      explain: "ゲームを終わらせるのは自分なので、主語は I。'I haven't beaten it yet.'（まだクリアしてない）。'it has not finished' だと「ゲームが自分で終わる」という変な意味になる。beat = クリアする（v167）、haven't + 過去分詞で「まだ〜していない」。" },
    { id: 'p191', q: '「遅く帰るべきじゃない」を正しく言うと？', choices: ["I shouldn't come home lately", "I shouldn't come home late", "I shouldn't come lately home", "I shouldn't go home lately"], correct: 1,
      explain: "late = 遅く（時間が遅い）。lately は「最近」という全く別の意味なので要注意。'I shouldn't come home late.'（遅く帰るべきじゃない）。今いる場所が家なら come home、外から家へ向かうなら go home を使う。" },
    { id: 'p192', q: '「〜できるようになるのは嬉しい」を自然に言うと？', choices: ["I'm great we can ~", "It's great that we'll be able to ~", "That's great we can able to ~", "It great that we will can ~"], correct: 1,
      explain: "It's great that ~ = 〜ということは嬉しい・素晴らしい（形式主語のit）。'It's great that we'll be able to work together.'（一緒に働けるようになるのは嬉しい）。It に意味はなく、本当に言いたいのは that 以下。会話では that を省略することも多い。" },
    { id: 'p193', q: '「この増額のおかげで」の「〜のおかげで」を1語で言うと？', choices: ['by this increase', 'with this increase', 'in this increase', 'to this increase'], correct: 1,
      explain: "with = 〜によって、〜があることで（理由・手段）。'With this increase, we can do more.'（この増額のおかげでもっとできる）。with は「一緒に」だけでなく理由も表せる。'With more time, we can do better.'（もっと時間があればもっとうまくできる）。" },
    { id: 'p194', q: '「思っていたより大変だった」を自然に言うと？', choices: ['It was harder than I thought it will be', 'It was more work than I thought it would be', 'It was more works than I thought', 'It was hard than I thought would'], correct: 1,
      explain: "more work than I thought it would be = 思っていたより大変（仕事量が多い）。work は数えられない名詞なので works にしない。また thought（過去）に合わせて will → would にする（時制の一致）。" },
    { id: 'p195', q: '「200人が出席していた」をフォーマルに言うと？', choices: ['Two hundred people were attendance', 'Two hundred people were in attendance', 'Two hundred people were attended', 'Two hundred people in attend'], correct: 1,
      explain: "be in attendance = 出席している（フォーマルな言い方）。'Two hundred people were in attendance.'（200人が出席していた）。in attendance は前置詞句で、be動詞の後ろに置いて状態を表す。会話なら 'Two hundred people came.' でOK。" },
    { id: 'p196', q: '「（大会で）1位を取る」を自然に言うと？', choices: ['get the first', 'get first', 'take first place it', 'win the one'], correct: 1,
      explain: "get first = 1位を取る（口語で the を付けない）。'If we don't get first today, ~'（今日1位を取れなかったら）。よりはっきり言うなら get first place / win first place。順位の話でよく使う形。" },
    { id: 'p197', q: '「電車が遅れています」を、駅のアナウンスでも使う形で言うと？', choices: ['The train is delaying', 'The train is delayed', 'The train is on delay', 'The train has delayed it'], correct: 1,
      explain: "be delayed = 遅延している（受け身の形）。'The train I always take is delayed.'（いつも乗る電車が遅れている）。late でも通じるが、交通機関の遅れは delayed が決まり文句。乗る動詞は take（go on とは言わない、g141）。" },
    { id: 'p198', q: '「今日は仕事がはかどった」を自然に言うと？', choices: ['I worked on my tasks well', 'I got a lot of work done', 'I did my works very good', 'I made many work today'], correct: 1,
      explain: "get + 目的語 + done = 〜を終わらせる。'I got a lot of work done today.'（今日は仕事がはかどった）。work は不可算名詞なので works とは言わない。シンプルに 'My work went well today.' でも自然。" },
    { id: 'p199', q: '「3時に会議の予定が入っています」を自然に言うと？', choices: ["I'm scheduled for a meeting at three", "I'm scheduled a meeting at three", "I schedule for a meeting at three", "I'm on schedule a meeting at three"], correct: 0,
      explain: "be scheduled for + 名詞 = 〜の予定が入っている。自分で決めたというより、予定表に組み込まれている受け身のイメージ。'I'm scheduled for surgery next Monday.'（来週手術の予定です）。日常会話では 'I have a meeting at three.' の方をよく使う。" },
    { id: 'p200', q: '英語で「えーと…」と考える時間をかせぐ、いちばん自然なつなぎ言葉は？', choices: ['Eh...', 'Well, ...', 'Mm...', 'Ah...'], correct: 1,
      explain: 'Well, ... = えーと。文の頭に置くだけで1〜2秒かせげて、しかも自然に聞こえます。"Well, I think it is a good idea."（えーと、いい考えだと思います）。Eh や Mm は日本語の「えー」がそのまま出た音で、英語では少し不自然に聞こえます。' },
    { id: 'p201', q: '「ちょっと考えさせて」を英語で言うと？', choices: ['Let me think.', 'Give me think.', 'I am thinking now please.', 'Wait my thinking.'], correct: 0,
      explain: 'Let me think. = ちょっと考えさせて。黙り込む代わりにこう言えば、相手は待ってくれます。"Let me think. ... Yes, I remember now."（考えさせて…あ、思い出した）。Let me see. も同じように使えます。' },
    { id: 'p202', q: '一度言ったことを言い直す時の「つまり、～ということです」は？', choices: ['I mean, ...', 'I say, ...', 'I think so, ...', 'I want to say that, ...'], correct: 0,
      explain: 'I mean, ... = つまり、～ということです。これを挟むと、言い直しが「ミス」ではなく「説明」に聞こえます。"I want to live there. I mean, not to study, but to work."（そこに住みたい。つまり勉強じゃなくて働くために）。' },
    { id: 'p203', q: '「実は、正確には～」と情報を訂正する時に使う単語は？', choices: ['Actually,', 'Really,', 'Truly,', 'Surely,'], correct: 0,
      explain: 'Actually, ... = 実は、正確に言うと。自分の言い間違いや相手の思い込みを、やわらかく直せます。"Actually, I started in junior high school."（実は、始めたのは中学です）。' },
    { id: 'p204', q: '「ごめん、高校じゃなくて中学です」を英語で言うと？', choices: ['Sorry, not high school. Junior high school.', 'Sorry, no high school. Junior high school.', 'Sorry, high school is not. Junior high school.', 'Sorry, but high school no.'], correct: 0,
      explain: 'Sorry, not A. B. = ごめん、AじゃなくてB。単語を言い間違えた時の、いちばん短い直し方です。"Sorry, not Tuesday. Thursday."（ごめん、火曜じゃなくて木曜）。' },
    { id: 'p205', q: '英語の単語が思い出せない時、会話を止めずに続けるには？', choices: ["I don't know the English word, but it is a red soup.", "I forget English. Soup.", "English word is difficult. Soup?", "I cannot say. Please wait."], correct: 0,
      explain: "I don't know the English word, but ... = 英語の単語は分からないけど…。この一言で沈黙を避けられます。単語が出てこないこと自体は問題ではなく、黙ってしまうことが問題です。" },
    { id: 'p206', q: '「それは～の一種です」と説明する時の表現は？', choices: ["It's a kind of red soup.", "It's a type in red soup.", "It's one of red soup.", "It's a sort in red soup."], correct: 0,
      explain: "a kind of ～ = ～の一種。名前が分からないものを説明する時の万能フレーズです。\"It's a kind of Japanese pancake.\"（お好み焼きのような、日本のパンケーキの一種です）。" },
    { id: 'p207', q: '「これって英語で何て言うんですか？」と先生に聞く時は？', choices: ['How do you say this in English?', 'What do you say this by English?', 'How to say this English?', 'What is this English word?'], correct: 0,
      explain: 'How do you say ～ in English? = ～って英語で何て言いますか。レッスン中にいちばん使えるフレーズです。"How do you say sukiyaki in English?"（すき焼きって英語で何て言いますか）。' },
    { id: 'p208', q: '「もう一度言ってもらえますか？」の丁寧な言い方は？', choices: ['Could you say that again?', 'Please say again one more.', 'Say it again please more.', 'One more time you say?'], correct: 0,
      explain: 'Could you say that again? = もう一度言ってもらえますか。聞き取れなかった時は遠慮なく使いましょう。ゆっくり話してほしい時は "Could you speak more slowly?" です。' },
    { id: 'p209', q: '「Yeah」ばかり使わないために、相づちとして使えるのは？', choices: ['I see.', 'So what.', 'Of course not.', 'Never mind.'], correct: 0,
      explain: 'I see. = なるほど。Right. や That makes sense. も同じように使えます。Yeah を文の切れ目ごとに入れるより、いくつか混ぜたほうが会話が締まって聞こえます。' },
    { id: 'p210', q: '「週末だ！」を正しく言うと？', choices: ["It's weekend!", "It's the weekend!", "It's a weekend!", "It's weekends!"], correct: 1,
      explain: "the weekend = 週末（the を付けるのが決まり文句）。'It's the weekend!'（週末だ！）。冠詞の脱落はゆうきさんの最重要ポイントなので、名詞を書いたら「a か the はいる？」と確認するクセを。'The weekend is finally here!'（やっと週末だ）も使える。" },
    { id: 'p211', q: '「2回目のレッスンを受けた」を正しく言うと？', choices: ['I took a lesson second time', 'I took a lesson for the second time', 'I took a lesson in second time', 'I took a second lesson time'], correct: 1,
      explain: "for the + 序数 + time = 〜回目に。'I took an English lesson for the second time.'（2回目の英会話レッスンを受けた）。for the first time（初めて）とセットで覚える。for も the も省略しない。" },
    { id: 'p212', q: '「ネットの接続が悪かった」を自然に言うと？', choices: ["the network wasn't connect well", 'the network connection was bad', 'the network was not connecting good', 'the network is bad connect'], correct: 1,
      explain: "be動詞 + 動詞の原形（wasn't connect）は文法的に作れない。'The network connection was bad.'（ネット接続が悪かった）か 'The network didn't work well.' がシンプルで自然。connection（接続）は名詞。" },
    { id: 'p213', q: '「チームを応援する」を正しく言うと？', choices: ['I cheer the team', 'I cheer for the team', 'I cheer to the team', 'I cheering the team'], correct: 1,
      explain: "cheer for ~ = 〜を応援する（for が必要）。'I cheered for Team Falcons.'（チームファルコンズを応援した）。cheer だけだと「歓声をあげる」の意味。support も「応援する」で使える。" },
    { id: 'p214', q: '「どうやって復習するか考える」を正しく言うと？', choices: ['think how to review', 'think about how to review', 'think of how review', 'think for how to review'], correct: 1,
      explain: "think は後ろに目的語を直接置けないので about が必要。'I have to think about how to review my lessons.'（どうやって復習するか考えないと）。think about ~（〜について考える）でセットで覚える。" },
    { id: 'p215', q: '「ミスをする」の正しい言い方は？', choices: ['take a mistake', 'make a mistake', 'do a mistake', 'have a mistake'], correct: 1,
      explain: "「ミスをする」は make a mistake。動詞は make で固定のセット表現。'I made many mistakes last week.'（先週はたくさんミスをした）。take や do は使えない。make a decision（決める）、make a plan（計画を立てる）と同じ仲間として覚える。" },
    { id: 'p216', q: '「楽しかった」を It was fun. 以外の言い方で表すと？', choices: ['I had fun.', 'I was fun.', 'I did fun.', 'I made fun.'], correct: 0,
      explain: "I had fun. = 楽しかった。fun は名詞なので have を使う。'I had fun with my girlfriend.'（彼女と楽しく過ごした）。I was fun. は「私は面白い人だった」という別の意味になるので注意。It was fun. と I had fun. の2つをセットで覚えると便利。" },
    { id: 'p217', q: '「面接はうまくいった」の自然な文は？', choices: ['The interview did well.', 'The interview went well.', 'The interview made well.', 'The interview took well.'], correct: 1,
      explain: "物事（interview / meeting / party など）が主語のときは go well を使う。'The interview went well.'（面接はうまくいった）。do well は人が主語のときの表現なので、interview を主語にすると不自然になる。" },
    { id: 'p218', q: 'Everything ------- well at the party last night.（昨夜のパーティーはすべて順調だった）', choices: ['did', 'went', 'made', 'had'], correct: 1,
      explain: "everything は物事なので go well。過去形は went。'Everything went well.'（すべて順調だった）。反対は go wrong。'Something went wrong.'（何かがうまくいかなかった）もセットで覚えると便利。" },
    { id: 'p219', q: 'He ------- well on the math test.（彼は数学のテストでよくできた）', choices: ['went', 'did', 'was', 'took'], correct: 1,
      explain: "人が主語のときは do well。'He did well on the math test.'（彼は数学のテストでよくできた）。テストそのものが主語なら 'The test went well.'（テストはうまくいった）。主語が人か物かで do / go を選び分ける。" }
  ],
  grammar: [
    { id: 'g01', q: '正しいのはどれ？', choices: ['the todays lesson', "the today's lesson", "today's lesson", 'today lesson'], correct: 2,
      explain: '所有格（\'s）と the は同時に使えません。"Let\'s check today\'s news."（今日のニュースをチェックしよう）。my book に the my book と言わないのと同じ。' },
    { id: 'g02', q: '「先生はいい人でした」の正しい文は？', choices: ['The teacher is good person.', 'The teacher was good person.', 'The teacher was a good person.', "The teacher's a good person."], correct: 2,
      explain: 'person は数えられる名詞なので a が必要。過去なので was。"He was a kind man."（彼は優しい男性だった）。' },
    { id: 'g03', q: '「いつ英語を学び始めましたか？」の正しい文は？', choices: ['When did you started learning English?', 'When did you start learning English?', 'When you started learning English?', 'When do you started learning English?'], correct: 1,
      explain: 'did を使ったら動詞は原形（start）に。"When did you arrive?"（いつ着いたの？）。中学英語の重要ルール。' },
    { id: 'g04', q: '「Politics ___ difficult.」に入るのは？', choices: ['are', 'is', 'were', 'be'], correct: 1,
      explain: '-ics で終わる学問名は単数扱い。"Mathematics is my favorite subject."（数学は私の好きな科目）。economics, physics も同様。' },
    { id: 'g05', q: "次の文の間違いは？「I enjoyed today's lesson. The teacher is a good person.」", choices: ['enjoyed が間違い', 'is が間違い（was にする）', "today's が間違い", '間違いはない'], correct: 1,
      explain: '前の文が過去形 enjoyed なら、後の文も過去形 was に揃える。"I went to the park. It was beautiful."（公園に行った。きれいだった）。時制の一致。' },
    { id: 'g06', q: "「I'm looking forward ___ you.」に入るのは？", choices: ['to see', 'to seeing', 'see', 'seeing'], correct: 1,
      explain: 'looking forward to の to は前置詞なので、後ろは動名詞（〜ing）。"I\'m looking forward to hearing from you."（あなたからの返事を楽しみにしてます）。' },
    { id: 'g07', q: '「明日は最終日です」の正しい文は？', choices: ['Tomorrow is last day.', 'Tomorrow is a last day.', 'Tomorrow is the last day.', 'Tomorrow is my the last day.'], correct: 2,
      explain: '世界に1つしかないものには the。"Today is the first day of summer."（今日は夏の最初の日）。the last / the first / the best など順序・最上級に the。' },
    { id: 'g08', q: '「クーラーを使い始めた」の正しい文は？', choices: ['I started use the air conditioner.', 'I started on the air conditioner.', 'I started using the air conditioner.', 'I started to using the air conditioner.'], correct: 2,
      explain: 'start + 動名詞 / to + 原形。"She started running every morning."（彼女は毎朝走り始めた）。会話では ~ing がより自然。' },
    { id: 'g09', q: "「It's ___ hot to sleep.」（暑すぎて眠れない）に入るのは？", choices: ['so', 'too', 'very', 'such'], correct: 1,
      explain: 'too は「〜すぎる（困る）」。"too ... to ~"（〜すぎて…できない）の形。"This coffee is too hot to drink."（このコーヒーは熱すぎて飲めない）。' },
    { id: 'g10', q: '「ジーンズを1本買った」の正しい文は？', choices: ['I bought a jeans.', 'I bought jeans.', 'I bought a pair of jeans.', 'I bought a piece of jeans.'], correct: 2,
      explain: 'jeans, pants, glasses, scissors など2つの部分でできるものは a pair of で数える。"I need a new pair of glasses."（新しいメガネがいる）。' },
    { id: 'g11', q: '一番自然な英文はどれ？', choices: ["I enjoyed to do today's lesson.", "I enjoyed do today's lesson.", "I enjoyed doing today's lesson.", "I enjoyed today's lesson."], correct: 3,
      explain: 'enjoy の目的語は名詞か動名詞。"I enjoyed the movie."（映画を楽しんだ）が一番自然。do a lesson は不自然。' },
    { id: 'g12', q: '「Thank you ___ having me.」に入るのは？', choices: ['to', 'of', 'for', 'about'], correct: 2,
      explain: 'Thank you for ~ing = 〜してくれてありがとう。"Thank you for helping me."（助けてくれてありがとう）。for の後は動名詞または名詞。' },
    { id: 'g13', q: '「7月に」を英語で？', choices: ['at July', 'on July', 'in July', 'to July'], correct: 2,
      explain: '月の前は in。at（時刻 at 7）、on（日付 on Monday）、in（月・年・季節 in spring, in 2026）。"She was born in October."' },
    { id: 'g14', q: '「フィリピンに行く」の正しい文は？', choices: ['I go to Philippines', 'I go to the Philippines', 'I go to a Philippines', 'I go Philippines'], correct: 1,
      explain: 'the Philippines は必ず the が必要。複数形の国名には the。"I\'d like to visit the Netherlands someday."（いつかオランダに行きたい）。' },
    { id: 'g15', q: '「商談準備を終えた」の正しい文は？', choices: ['I finished to prepare for the meeting', 'I finished preparing for the meeting', 'I finished prepare for the meeting', 'I finished to preparing for the meeting'], correct: 1,
      explain: 'finish + 動名詞。"Have you finished writing the report?"（レポート書き終わった？）。enjoy, stop, give up も同じパターン。' },
    { id: 'g16', q: '「次のパーティーを楽しみにしてる」の正しい文は？', choices: ['I look forward to enjoy the next party', "I'm looking forward to the next party", 'I look forward enjoy the next party', "I'm looking forward enjoy the next party"], correct: 1,
      explain: 'look forward to の to は前置詞なので、後ろは名詞か動名詞。"I\'m looking forward to the weekend."（週末が楽しみ）。' },
    { id: 'g17', q: '「この髪型でフィリピンに行く」の「この髪型で」は？', choices: ['on this hairstyle', 'in this hairstyle', 'with this hairstyle', 'by this hairstyle'], correct: 2,
      explain: 'with this hairstyle = この髪型で。with は「〜を身につけて」。"The girl with the red hat is my sister."（赤い帽子の女の子が私の妹）。' },
    { id: 'g18', q: '「英語を話すことへの緊張が少し減った」の正しい文は？', choices: ['I feel a little less nervous about speaking English', 'I feel a little less nervous to speak English', 'I feel little less nervous about speaking English', 'I feel a less nervous about speaking English'], correct: 0,
      explain: 'less + 形容詞 = より〜でない。"I feel less tired today."（今日は疲れが少ない）。nervous about の後は ~ing。' },
    { id: 'g19', q: '「Unity Editor を操作できる uLoop」を関係代名詞で説明するなら？', choices: ['uLoop that control Unity Editor', 'uLoop, which lets you control Unity Editor', 'uLoop which control Unity Editor', 'uLoop that lets control Unity Editor'], correct: 1,
      explain: 'コンマ + which は補足説明。"My laptop, which I bought last year, is broken."（去年買ったノートパソコンが壊れた）。' },
    { id: 'g20', q: '「うまくいきますように」を hope を使って言うと？', choices: ['I hope go well', 'I hope it goes well', 'I hope it go well', 'I hope to go well'], correct: 1,
      explain: 'I hope の後は「主語 + 動詞」。三単現の s も忘れずに。"I hope she likes my gift."（彼女がプレゼントを気に入るといいな）。' },
    { id: 'g21', q: '「明日が最終日」の正しい文は？', choices: ['Tomorrow is last day', 'Tomorrow is a last day', 'Tomorrow is the last day', 'Tomorrow is one last day'], correct: 2,
      explain: 'the last day = 最後の日（世界に1つしかないので the）。"This is the best pizza I\'ve ever had."（人生最高のピザだ）。' },
    { id: 'g22', q: '「Tomorrow」のスペル、正しいのは？', choices: ['Tommorow', 'Tommrow', 'Tomorrow', 'Tomorow'], correct: 2,
      explain: 'Tomorrow = to + morrow。m は1つ、r は2つ。よく間違える単語ベスト10入り！丁寧に覚えよう。' },
    { id: 'g23', q: '「テストで点数を取る」の前置詞は？', choices: ['at the test', 'in the test', 'on the test', 'for the test'], correct: 2,
      explain: 'on the test = テストで。on は接触のコア。"He got 95 on his history test."（彼は歴史のテストで95点取った）。' },
    { id: 'g24', q: '「My English is getting ___ little by little.」に入るのは？', choices: ['well', 'good', 'better', 'best'], correct: 2,
      explain: 'better = より良く（比較級）。get + 比較級 = だんだん〜になる。"The days are getting longer."（日がだんだん長くなっている）。' },
    { id: 'g25', q: "「I'm thinking ___ studying abroad.」（留学を考え中）の前置詞は？", choices: ['to', 'of', 'for', 'about'], correct: 1,
      explain: 'I\'m thinking of ~ing = 〜しようかなと考え中。"I\'m thinking of buying a new bike."（新しい自転車を買おうかと考え中）。' },
    { id: 'g26', q: '「毎日出社する」の「毎日」、正しいのは？', choices: ['everyday', 'every day', 'all day', 'each days'], correct: 1,
      explain: 'every day（2語）= 毎日（副詞）。everyday（1語）= 日常の〜（形容詞、everyday life など）。"I drink water every day."' },
    { id: 'g27', q: '「留学の準備をする」の正しい形は？', choices: ['prepare studying abroad', 'prepare for studying abroad', 'prepare to study abroad', 'prepare for と to の両方OK'], correct: 3,
      explain: 'prepare for + 名詞/動名詞、prepare to + 動詞。"She\'s preparing for her exam."（試験準備）/ "She\'s preparing to leave."（出発準備）。' },
    { id: 'g28', q: '「でも英語の復習もしなきゃ」の also の正しい位置は？', choices: ['But also I have to review', 'But I also have to review', 'But I have also to review', 'But I have to also review'], correct: 1,
      explain: 'also は「主語 + also + 動詞」が基本。"I also like coffee."（私もコーヒーが好き）。be動詞や助動詞の前に置きます。' },
    { id: 'g29', q: '「何が起きても諦めない」の正しい文は？', choices: ["Whatever I don't give up", "Whatever happens, I won't give up", "Whatever happen, I won't give up", "Whatever, I don't give up"], correct: 1,
      explain: 'Whatever + 主語 + 動詞 の型。"Whatever you decide, I\'ll support you."（あなたが何を決めても応援する）。カンマも忘れずに。' },
    { id: 'g30', q: '「ソルジャーボーイに戦ってほしかった（実際は戦わなかった）」を英語で？', choices: ['I wanted to fight with Soldier Boy', 'I wish Soldier Boy had joined the fight', 'I hope Soldier Boy fights', 'I wanted Soldier Boy fight'], correct: 1,
      explain: 'wish + 過去完了 = 過去の事実に反する願望。"I wish I had studied harder in school."（学校でもっと勉強すればよかった）。' },
    { id: 'g31', q: '「給料を60万円に上げてもらった」の正しい表現は？', choices: ['They increased it for 600,000 yen', 'They raised it to 600,000 yen', 'They raised it for 600,000 yen', 'They up it to 600,000 yen'], correct: 1,
      explain: 'raise it to ~ = 〜に上げる（to は到達点）。"The shop raised the price to 5,000 yen."（店は値段を5,000円に上げた）。' },
    { id: 'g32', q: '「映画の最後のシーン」を英語で？', choices: ['the scene of the end', 'the scene at the end', 'the scene in the end', 'the scene to the end'], correct: 1,
      explain: 'at the end = 終わりの地点で。"We met at the end of the street."（通りの突き当たりで会った）。at は特定の地点。' },
    { id: 'g33', q: '「最後まで・ずっと」を英語で？', choices: ['until the end', 'all the way to the end', 'どちらも正しいが all the way の方が勢いがある', 'to the end'], correct: 2,
      explain: 'all the way to the end = 最後の最後まで（勢いがある）。"He ran all the way home."（家までずっと走った）。' },
    { id: 'g34', q: '「見終わった」を英語で？', choices: ['I watched it', 'I finished watching it', 'I ended watching it', 'I done watch it'], correct: 1,
      explain: 'finish watching = 見終わる。finish の後は動名詞。"Have you finished reading the book?"（本読み終わった？）。' },
    { id: 'g35', q: '「期間（3年間）続いた」の正しい時制と動詞は？', choices: ['continues three years', 'lasted for three years', 'last three years', 'is lasted three years'], correct: 1,
      explain: 'lasted for ~ = 期間続いた（過去形）。前置詞 for とセット。"Our trip lasted for two weeks."（旅行は2週間続いた）。' },
    { id: 'g36', q: '「セブに到着した」の正しい前置詞は？', choices: ['I arrived at Cebu', 'I arrived in Cebu', 'I arrived to Cebu', 'I arrived on Cebu'], correct: 1,
      explain: 'arrive in + 広い場所、arrive at + 狭い地点。"They arrived in Tokyo last night."（昨晩東京に到着）/ "He arrived at the station."（駅に到着）。' },
    { id: 'g37', q: '「長ズボン買えばよかった！」（後悔）を英語で？', choices: ['I want to buy long pants', 'I should have bought long pants', 'I will buy long pants', 'I bought long pants'], correct: 1,
      explain: 'should have + 過去分詞 = 〜すべきだった（後悔）。"I should have brought an umbrella."（傘を持ってくればよかった）。' },
    { id: 'g38', q: '「the bathroom may not ___」（バスルームがきれいじゃないかも）の正しい形は？', choices: ['clean', 'be clean', 'cleaning', 'cleans'], correct: 1,
      explain: 'clean は形容詞なので、助動詞の後に be が必要。"The food may not be fresh."（食べ物は新鮮じゃないかも）。形容詞の前には be 動詞。' },
    { id: 'g39', q: '「私のもの」を表すのに自然なのは？', choices: ['I got textbooks', 'I got my textbooks', 'I got the textbooks', 'I got textbook'], correct: 1,
      explain: '自分のものには my をつけると自然。"I lost my keys."（鍵をなくした）。所有を明確にすると自然な英文に。' },
    { id: 'g40', q: '同じ単語を繰り返さない時、a + 名詞 の代わりに使うのは？', choices: ['it', 'one', 'that', 'the'], correct: 1,
      explain: 'one = 前に出た「a + 名詞」の代わり。"I lost my pen. I need to buy one."（ペンをなくした。1本買わなきゃ）。it だと「その特定のペン」になってしまう。' },
    { id: 'g41', q: '「先生は知らない人と話すなと注意した」の正しい文は？', choices: ["The teacher warned us to don't talk to strangers", 'The teacher warned us not to talk to strangers', 'The teacher said us not talk to strangers', 'The teacher warned us no talking to strangers'], correct: 1,
      explain: 'warn 人 not to do = 〜しないよう注意する。"The doctor warned him not to eat too much sugar."（医者は彼に砂糖を取りすぎないよう注意した）。' },
    { id: 'g42', q: '「あの映画はこわかった（映画が原因）」を英語で？', choices: ['That movie was scared', 'That movie was frightened', 'That movie was frightening', 'That movie was fear'], correct: 2,
      explain: '物事が人をこわがらせる時は -ing。"That movie was so frightening!"（あの映画こわかった！＝こわがらせるものだった）。-ed は人の気持ち（I was frightened）。' },
    { id: 'g43', q: '「手段（〜することによって）」と「目的（〜するために）」の正しい使い分けは？', choices: ['どちらも to + 動詞', '手段は by + ~ing、目的は to + 動詞', 'どちらも by + ~ing', '手段は for + 名詞、目的は ~ing'], correct: 1,
      explain: 'by + ~ing = 手段（〜することによって）。to + 動詞 = 目的（〜するために）。"I lost weight by exercising."（運動で痩せた）vs "I exercise to lose weight."（痩せるために運動する）。' },
    { id: 'g44', q: '「100回上げることができた」の正しい文は？', choices: ['I lifted it hundred times', 'I lifted it a hundred times', 'I lifted it the hundred times', 'I lifted it one hundred time'], correct: 1,
      explain: 'a hundred times = 100回（hundred の前に a が必要）。同じパターン：a thousand（千）、a million（百万）。"He has read it a hundred times."（彼はそれを100回読んだ）。' },
    { id: 'g45', q: '「（一回の達成として）〜することができた」の自然な言い方は？', choices: ['I could lift the dumbbell', 'I was able to lift the dumbbell', 'I can lifted the dumbbell', 'I could to lift the dumbbell'], correct: 1,
      explain: '一回の達成 = was able to。could だと「能力があった（一般的）」になりがち。"I was able to finish the report on time."（時間通りにレポートを終えられた）。' },
    { id: 'g46', q: '「彼は寝ているに違いない」の正しい文は？', choices: ['He must be sleeping', 'He must sleeping', 'He must to sleep', 'He must slept'], correct: 0,
      explain: '助動詞（must, can, will, could など）のあとは必ず動詞の原形。be + sleeping で「寝ている」。"You must be tired."（疲れているに違いない）。 ★ゆうきの伸びしろポイント！' },
    { id: 'g47', q: '「used to + 動詞」と「get used to + 名詞/~ing」の違いは？', choices: ['同じ意味', 'used to = 昔の習慣（今はしてない）、get used to = 〜に慣れる', 'used to = 慣れる、get used to = 昔の習慣', 'どちらも「使う」'], correct: 1,
      explain: 'used to + 動詞 = 昔は〜だった（今はしてない）。get used to + 名詞/~ing = 〜に慣れる。"I used to live in Tokyo."（昔は東京に住んでた）vs "I got used to living in Cebu."（セブでの生活に慣れた）。' },
    { id: 'g48', q: '「友達が私に教えてくれた」自然な英文は？', choices: ['I was taught my friend', 'I was taught by my friend', 'A friend taught me', 'どちらも自然だが A friend taught me がより自然'], correct: 3,
      explain: '日本語の受動的な表現を、英語では能動態で言う方が自然。"A friend taught me how to use the gym machines."（友達がジム機材の使い方を教えてくれた）。' },
    { id: 'g49', q: '「会議はそれぞれ約1時間でした」の正しい文は？', choices: ["It's about one hour", 'They were about an hour each', 'They are about one hour', 'They were one hour'], correct: 1,
      explain: '過去なので were、複数なので They、それぞれを表す each、会話では an hour が one hour より自然。"The lessons were about an hour each."（レッスンはそれぞれ約1時間だった）。' },
    { id: 'g50', q: '「ここに駐車してはいけない」（禁止）の正しい表現は？', choices: ["You can't park here", 'You must not park here', 'どちらも禁止を表せる', "You don't park here"], correct: 2,
      explain: '禁止は must not（強い）も can\'t（やわらかい）もOK。"You can\'t take photos here."（写真撮影禁止）。ただし「彼が来るはずがない」のような強い否定の推量は can\'t（must not は使わない）。' },
    { id: 'g51', q: '「他のもう1つのモール」の正しい表現は？', choices: ['other mall', 'another mall', 'the other mall', 'other malls'], correct: 1,
      explain: 'another = もう一つ別の（単数）。other は単独で単数名詞につけられない。"another cup of coffee"（もう1杯）vs "other people"（他の人々／複数）。' },
    { id: 'g52', q: '「日本と同じ雰囲気」を英語で？', choices: ['same as Japan', 'same as in Japan', 'the same as in Japan', 'same with Japan'], correct: 2,
      explain: 'same は the same が基本。「日本（の中）と同じ」は in が必要。"The food here is the same as in my hometown."（ここの食べ物は地元と同じ）。' },
    { id: 'g53', q: '「月曜日に」の前置詞は？', choices: ['at Monday', 'on Monday', 'in Monday', 'for Monday'], correct: 1,
      explain: '曜日は on。"See you on Monday."（月曜日に会おう）。前置詞ルール：at（時刻 at 7）→ on（日・曜日 on Monday）→ in（月・年・季節 in July）と範囲が広がる。' },
    { id: 'g54', q: '「カードを1枚も買えなかった」の正しい文は？', choices: ["I didn't buy cards", "I couldn't buy any cards", "I couldn't buy some cards", "I didn't buy any card"], correct: 1,
      explain: 'couldn\'t = 買えなかった（買いたかったけど無理だった）、any = 否定文で「1つも」、cards = 複数。"I couldn\'t find any errors."（エラーが1つも見つからなかった）。' },
    { id: 'g55', q: '「a bit of」の後ろに来る名詞は？', choices: ['複数形のみ', '不可算名詞', '可算名詞のみ', '何でもいい'], correct: 1,
      explain: 'a bit of + 不可算名詞 = 少しの〜。"a bit of water/help/time/sugar"。可算名詞の複数形には a few を使い分け（a few books）。' },
    { id: 'g56', q: "「I'm a bit of ___ open book.」の空欄に入るのは？", choices: ['a', 'an', 'the', 'なし'], correct: 1,
      explain: '母音の発音で始まる単語の前は an。open は母音始まりなので an。"an apple"（リンゴ）、"an hour"（h が無音）も同じパターン。' },
    { id: 'g57', q: '「速く走る」の「速く」、正しいのは？', choices: ['fastly', 'fast', 'fastly または fast', 'fasty'], correct: 1,
      explain: 'fast は形容詞も副詞も同じ形（fastly という単語は存在しない！）。"He runs fast."（彼は速く走る）。同じパターン：hard（熱心に）、early（早く）、late（遅く）。' },
    { id: 'g58', q: '「泳ぎに行く」の正しい文は？', choices: ['I go to swim', 'I go swim', 'I go swimming', 'I go for swimming'], correct: 2,
      explain: 'go + ~ing = 〜しに行く。"I go swimming every weekend."（毎週末泳ぎに行く）。go fishing, go shopping, go hiking なども同じ形。' },
    { id: 'g59', q: '「迷子を探す」の正しい文は？', choices: ['search a lost child', 'search for a lost child', 'search to a lost child', 'search about a lost child'], correct: 1,
      explain: 'search for + 探す対象。"The police searched for the missing man."（警察は行方不明の男性を探した）。search a place（場所を捜索する）と search for（探す対象）を区別。' },
    { id: 'g60', q: '「窓を開けてもらえますか？」の正しい文は？', choices: ['Do you mind to open the window?', 'Do you mind opening the window?', 'Do you mind open the window?', 'Do you mind to opening the window?'], correct: 1,
      explain: 'mind + 動名詞（~ing）。"Would you mind closing the door?"（ドアを閉めてもらえますか？）。mind, enjoy, finish, give up, avoid は動名詞をとる動詞。' },
    { id: 'g61', q: '「海・川・海洋」に the をつける？つけない？', choices: ['the the Pacific Ocean のように the が必要', 'the は不要', 'どちらでもいい', 'a をつける'], correct: 0,
      explain: '自然の海・川・海洋には the が必要。the Pacific Ocean（太平洋）、the Nile（ナイル川）。一方、Lake Biwa（琵琶湖）、Mount Fuji（富士山）のように「種類＋名前」の形は the 不要。' },
    { id: 'g62', q: '「Mount Fuji（富士山）」に the は必要？', choices: ['the Mount Fuji が正しい', 'the は不要（Mount Fuji のまま）', 'a Mount Fuji', 'どちらでもいい'], correct: 1,
      explain: 'Mount/Lake/Central などの「種類を表す語＋名前」には the が不要。Mount Fuji, Lake Biwa, Central Park, Tokyo Station。一方 the Pacific Ocean（海洋）は the が必要。' },
    { id: 'g63', q: '「（証拠から）〜だったはずがない」推量の過去の否定は？', choices: ['must not have been', "couldn't have been", 'may not have been', 'should not have been'], correct: 1,
      explain: 'couldn\'t have + 過去分詞 = 〜だったはずがない（過去の強い否定推量）。"He couldn\'t have stolen it; he was with me."（彼が盗んだはずがない、僕と一緒にいたから）。might not have は「〜しなかったかも」と弱い。' },
    { id: 'g64', q: '「風邪をひいたので休んだ」の正しい文は？', choices: ['I have a cold so I take a day off', 'I caught a cold, so I took a day off', 'I catch a cold so I took a day off', 'I had a cold so I take a day off'], correct: 1,
      explain: '日記は過去形に統一。「風邪をひく」は catch a cold（過去 caught）。「休みを取る」take a day off（過去 took）。"I caught a cold yesterday."（昨日風邪をひいた）。' },
    { id: 'g65', q: '「来週」に前置詞は必要？', choices: ['in next week', 'on next week', 'next week（前置詞なし）', 'at next week'], correct: 2,
      explain: 'next / last / this がつくと前置詞は不要。"I\'ll move next week."（来週引っ越す）。"See you next Monday."（また来週月曜）。in next week とは言いません。' },
    { id: 'g66', q: '「授業に行く」の正しい形は？', choices: ['go to the class', 'go to class', 'go class', 'go in class'], correct: 1,
      explain: 'go to class = 授業に行く（class は「授業」の意味では a も the もつけない）。go to school, go to work も同じパターン（無冠詞）。"I go to class every day."' },
    { id: 'g67', q: '「despite」の後ろに来るのは？', choices: ['文（主語＋動詞）', '名詞または動名詞（~ing）', 'to + 動詞', '形容詞'], correct: 1,
      explain: 'despite / in spite of + 名詞・動名詞 = 〜にもかかわらず。"Despite the rain, we went out."（雨にもかかわらず出かけた）。一方 although は後ろに文がくる（although it rained）。' },
    { id: 'g68', q: '「雨だったけど出かけた」を although で言うと？', choices: ['Although the rain, we went out', 'Although it rained, we went out', 'Although raining, we went out', 'Although of rain, we went out'], correct: 1,
      explain: 'although + 文（主語＋動詞）。"Although it rained, we went out."（雨が降ったけど出かけた）。despite は名詞をとる（despite the rain）ので使い分けに注意。' },
    { id: 'g69', q: '「将来は」の前置詞、正しいのは？', choices: ['for the future', 'in the future', 'on the future', 'at the future'], correct: 1,
      explain: 'in the future = 将来は。"I want to live in the US in the future."（将来アメリカに住みたい）。for the future は「将来のために（備え）」と意味が変わります。' },
    { id: 'g70', q: '「might be able to」と「might have to」の違いは？', choices: ['同じ意味', 'might be able to = できるかも、might have to = しなければならないかも', '逆の意味で同じ', 'どちらも「したい」'], correct: 1,
      explain: 'might be able to = できるかも（可能性）。might have to = しなければならないかも（義務）。"I might be able to join."（参加できるかも）vs "I might have to work."（働かなきゃかも）。助動詞は重ねられないので be able to / have to を使う。' },
    { id: 'g71', q: '「薬を飲む」の正しい動詞は？', choices: ['drink medicine', 'take medicine', 'eat medicine', 'have medicine'], correct: 1,
      explain: 'take medicine = 薬を飲む（drink は使わない！）。"Take this medicine twice a day."（この薬を1日2回飲んで）。錠剤も液体も take。' },
    { id: 'g72', q: '「専門学校」を英語で？', choices: ['special school', 'vocational school', 'professional school', 'technical college のいずれも使えるが vocational school が一般的'], correct: 3,
      explain: 'vocational school / technical college = 専門学校（職業訓練の学校）。"I study game design at a vocational school."（専門学校でゲームデザインを学んでいる）。special school は「特別支援学校」で別物。' },
    { id: 'g73', q: '「うるさかった」を英語で（形容詞 noisy を使って）？', choices: ['there was noisy', 'it was noisy', 'there was noise it', 'it was noise'], correct: 1,
      explain: 'it was noisy（形容詞 noisy）/ there was noise（名詞 noise）。"there was noisy" は名詞の位置に形容詞が来てNG。"The cafe was noisy."（カフェはうるさかった）。' },
    { id: 'g74', q: '「騒音があった」を英語で（名詞 noise を使って）？', choices: ['there was noisy', 'there was noise', 'it was noise', 'there had noise'], correct: 1,
      explain: 'there was + 名詞 = 〜があった。noise は名詞「騒音」。"There was a lot of noise outside."（外で騒音がたくさんあった）。noisy は形容詞なので there was の後には来ない。' },
    { id: 'g75', q: '「静かだから」を英語で？', choices: ['because of quietly', "because it's quiet", 'because of quiet', 'because quietly'], correct: 1,
      explain: 'because + 文（it\'s quiet）= 〜だから。because of + 名詞。"because of quietly"（副詞）は不可。"I like libraries because they\'re quiet."（静かだから図書館が好き）。' },
    { id: 'g76', q: '「お店の一点」を表す前置詞は？', choices: ['in Starbucks', 'at Starbucks', 'on Starbucks', 'to Starbucks'], correct: 1,
      explain: 'at + 店名 = お店で（点としての場所）。"I work at Starbucks."（スターバックスで働いている）。in は「内部の空間」を強調する時。日常では at が自然。' },
    { id: 'g77', q: '「〜したけれど」を1語の接続詞で表すなら？', choices: ['despite', 'because', 'though / although', 'so'], correct: 2,
      explain: 'though / although + 文 = 〜だけれど。"Although I was tired, I kept working."（疲れていたけど働き続けた）。though は文末にも置ける："I was tired. I kept working, though."（でも働いたよ）。' },
    { id: 'g78', q: '「drink（飲む）」の過去形は？', choices: ['drunk', 'drank', 'drinked', 'drunken'], correct: 1,
      explain: 'drink → drank（過去形）→ drunk（過去分詞）。"I drank a cup of coffee."（コーヒーを一杯飲んだ）。drunk は have drunk（飲んだことがある）か「酔っ払った」の意味。' },
    { id: 'g79', q: '「サウナに行った」の正しい文は？', choices: ['I went to sauna', 'I went to a sauna', 'I went to the sauna', 'I went sauna'], correct: 1,
      explain: 'sauna は数えられる名詞なので a が必要。"I went to a sauna after the gym."（ジムの後にサウナへ行った）。go to school / work（無冠詞）とは違うので注意。' },
    { id: 'g80', q: '「正午ちょうど」と「午後（昼から）」の使い分けは？', choices: ['どちらも at noon', 'at noon = 正午ちょうど、in the afternoon = 午後', 'at noon = 午後、in the afternoon = 正午', 'どちらも in the afternoon'], correct: 1,
      explain: 'at noon = 正午ちょうど（12時）、in the afternoon = 午後（昼から）。「昼から出かけた」なら in the afternoon。"I have lunch at noon."（正午に昼食をとる）。' },
    { id: 'g81', q: '「〜と違う」の正しい前置詞は（中学レベル）？', choices: ['different to', 'different from', 'different with', 'different than'], correct: 1,
      explain: 'different from ~ = 〜と違う（基本）。"My idea is different from yours."（私の考えは君のと違う）。different to はイギリス口語、different than はアメリカ口語。中学では from が安心。' },
    { id: 'g82', q: '「3つ以上を丁寧にお願いする」時の正しい形は？', choices: ['Could you A, B, C?', 'Could you please A, B, and C?', 'Could you please A and B and C?', 'Please you A, B, C?'], correct: 1,
      explain: 'Could you please A, B, and C? = AとBとCをしてもらえますか？3つ以上はカンマで区切り、最後だけ and。"Could you please clean the room, take out the trash, and bring a towel?"' },
    { id: 'g83', q: '「the Japanese one」の one は何を指す？', choices: ['数字の1', '前に出た名詞の繰り返しを避ける代名詞', '人', '冠詞'], correct: 1,
      explain: 'one = 前に出た名詞（ここでは pizza）の繰り返しを避ける代名詞。"This pizza is different from the Japanese one."（このピザは日本のと違う、one = pizza）。it（その特定のもの）とは使い分け。' },
    { id: 'g84', q: '「来てからずっとお腹の調子が悪い」の正しい文は？', choices: ['My stomach is bad since I came', 'My stomach has been bad since I came', 'My stomach was bad since I came', 'My stomach bad since I came'], correct: 1,
      explain: 'has been + since ~ = 〜してからずっと…（現在完了）。過去から今まで続く状態には現在完了を使う。"I have lived here since 2020."（2020年からここに住んでいる）。' },
    { id: 'g85', q: '「来てから（時点）」を表す正しい形は？', choices: ['since I came', 'since then I came', 'since I come', 'from I came'], correct: 0,
      explain: 'since + 文（過去形）= 〜して以来。"since then"（それ以来）と "since I came"（来て以来）は別物で、混ぜて "since then I came" とは言わない。重複に注意。' },
    { id: 'g86', q: '「hang（かける）」の過去形は？', choices: ['hanged', 'hung', 'hanged または hung', 'hangged'], correct: 1,
      explain: 'hang → hung → hung（不規則変化）。"I hung my coat on the hook."（フックにコートをかけた）。※ hanged は「絞首刑にした」という特別な意味の時だけ使う別の形。' },
    { id: 'g87', q: '「throw（投げる・捨てる）」の過去形は？', choices: ['throwed', 'threw', 'thrown', 'throwing'], correct: 1,
      explain: 'throw → threw（過去形）→ thrown（過去分詞）。"I threw away the trash this morning."（今朝ゴミを捨てた）。thrown は have thrown（過去分詞）の形なので過去形とは別。' },
    { id: 'g88', q: '「体に悪いとわかっているもの」の関係代名詞は？', choices: ['things which they know is bad', 'things (that) they know are bad', 'things what they know are bad', 'things they know is bad'], correct: 1,
      explain: 'things (that) they know are bad = 悪いとわかっているもの。会話では関係代名詞 that が省略される。主語が things（複数）なので are。what は使えない（先行詞 things があるため）。' },
    { id: 'g89', q: '「だんだん太ってきている」の正しい形は？', choices: ['I get fatter', "I'm getting fatter", 'I am get fatter', 'I getting fatter'], correct: 1,
      explain: 'be + getting + 比較級 = だんだん〜になってきている（変化の進行）。"The weather is getting colder."（だんだん寒くなってきた）。fatter は fat の比較級。' },
    { id: 'g90', q: '「気をそらす」distract の前置詞は？', choices: ['distract A to B', 'distract A from B', 'distract A of B', 'distract A at B'], correct: 1,
      explain: 'distract A from B = BからAの気をそらす。"Noise distracts me from studying."（騒音が勉強から気をそらす）。「本来集中すべきもの（B）から離す」イメージなので from。' },
    { id: 'g91', q: '「パーティーを開く」の正しい動詞は？', choices: ['do a party', 'have a party / throw a party', 'make a party', 'open a party'], correct: 1,
      explain: 'have a party / throw a party = パーティーを開く。"Let\'s throw a party for her birthday!"（彼女の誕生日にパーティーを開こう！）。do a party や make a party とは言わない。' },
    { id: 'g92', q: '「急がないと遅刻するよ」の正しい形は？', choices: ['Hurry up and you\'ll be late', "Hurry up or you'll be late", 'Hurry up so you\'ll be late', 'Hurry up but you\'ll be late'], correct: 1,
      explain: '命令文 + or + 主語 will ~ = 〜しろ、さもないと…するぞ。"Study hard, or you\'ll fail."（勉強しないと落ちるよ）。逆に「〜すれば…」は命令文 + and（"Hurry up, and you\'ll catch the train."）。' },
    { id: 'g93', q: '「彼は払うと言い張った」の正しい前置詞は？', choices: ['insisted to pay', 'insisted on paying', 'insisted for paying', 'insisted in pay'], correct: 1,
      explain: 'insist on + 動名詞（~ing）= 〜すると言い張る。"She insisted on coming with us."（彼女は一緒に来ると言い張った）。前置詞 on の後は ~ing。' },
    { id: 'g94', q: '「自分のことしか考えない」の正しい文は？', choices: ['They think only themselves', 'They think only of themselves', 'They think only for themselves', 'They only think themselves'], correct: 1,
      explain: 'think of ~ = 〜のことを考える。"think only of themselves" で「自分のことしか考えない」。think の後に of が必要。"Think of others, not just yourself."（自分だけでなく他人のことも考えて）。' },
    { id: 'g95', q: '「うまくできなかった、質問が難しかったから」の正しい文は？', choices: ["I couldn't do well. Because the questions were difficult.", "I couldn't do well, maybe because the questions were difficult.", 'I couldn\'t do well. Because difficult questions.', "Because the questions were difficult, I can't do well."], correct: 1,
      explain: '英語では Because だけで文を始めない（前の文とつなげる）。"I was late because I missed the bus."（バスを逃して遅刻した）。maybe because で「〜だからかも」と理由をやわらかく添えられる。' },
    { id: 'g96', q: '「Because で文を始める」のは正しい？', choices: ['いつでもOK', '基本はNG（前の文とつなげる）', '疑問文だけOK', '過去形だけOK'], correct: 1,
      explain: '書き言葉では Because + 文だけで終わるのは基本NG。"Why were you late?" への返事など会話では単独もありだが、日記や作文では "..., because ~" と前の文につなげるのが安全。' },
    { id: 'g97', q: '「明日は休みだ」の正しい文は？', choices: ['Tomorrow is the day off', 'Tomorrow is my day off', 'Tomorrow is day off', 'Tomorrow is a day off'], correct: 1,
      explain: 'my day off = 自分の休みの日。"I have a day off tomorrow."（明日は休みだ）も自然。day off は「仕事・学校が休みの日」。the day off だと特定の休みを指して少し不自然。' },
    { id: 'g98', q: '「先週行かなかったサウナ」の正しい語順は？', choices: ['the sauna where I didn\'t go last week', 'the sauna I didn\'t go last week where', 'the sauna last week where I didn\'t go', 'where the sauna I didn\'t go last week'], correct: 0,
      explain: '関係副詞 where + 文 が名詞の後ろから説明する。"the sauna where I didn\'t go last week"（先週行かなかったサウナ）。情報を詰め込みすぎる時は2文に分けると自然。' },
    { id: 'g99', q: '「仕事を始める」の正しい形は？', choices: ['start the work', 'start work', 'start a work', 'start the works'], correct: 1,
      explain: 'work（仕事）は数えない名詞なので a も the もつけない。"I start work at 9."（9時に仕事を始める）。"go to work"（出勤する）も同じく無冠詞。作品の意味の時だけ a work / works。' },
    { id: 'g100', q: '「東京駅で」の正しい前置詞は？', choices: ['in Tokyo Station', 'at Tokyo Station', 'on Tokyo Station', 'to Tokyo Station'], correct: 1,
      explain: 'at + 駅・場所の一点 = 〜で。"I\'ll meet you at the station."（駅で会おう）。in Tokyo Station は「駅舎の中」を特に強調する時だけ。待ち合わせや場所を示すなら at が自然。' },
    { id: 'g101', q: '「ちょうどいい量のストレス」を英語で？', choices: ['suitable stress', 'just the right amount of stress', 'good amount stress', 'just right stress'], correct: 1,
      explain: 'just the right amount of ~ = ちょうどいい量の〜。"Add just the right amount of salt."（ちょうどいい量の塩を加えて）。"with just the right amount of stress"（程よいストレスで）。' },
    { id: 'g102', q: '「apply for」と「sign up for」の違いは？', choices: ['同じ意味', 'apply for = 選考がある応募、sign up for = 誰でもできる登録', 'apply for = 無料、sign up for = 有料', 'apply for = 登録、sign up for = 応募'], correct: 1,
      explain: 'apply for ~ = （選考のある）応募（仕事・奨学金など）。sign up for ~ = （誰でもできる）登録（授業・イベント・メルマガなど）。"apply for a job"（仕事に応募）vs "sign up for a class"（授業に登録）。' },
    { id: 'g103', q: '「新しい会社で働く」の前置詞と冠詞は？', choices: ['in new company', 'at a new company', 'in a new company', 'at new company'], correct: 1,
      explain: '会社などの組織で「働いている・所属している」ときは前置詞 at を使う（in は建物の中というニュアンス）。また可算名詞が単数のときは冠詞 a が必要。"I work at a new company."が正解。' },
    { id: 'g104', q: '「少し遅い」の正しい語順は？', choices: ['late a little', 'a little late', 'little a late', 'a late little'], correct: 1,
      explain: 'a little / a bit（少し）などの程度を表す語は、形容詞の前に置く。"a little late"（少し遅い）が正しい。"late a little" は語順が逆で誤り。' },
    { id: 'g105', q: '「計画を立てる」の正しい形は？', choices: ['make plan', 'make a plan', 'make the plans', 'making plan'], correct: 1,
      explain: "plan（計画）は可算名詞なので、単数で使うときは冠詞 a が必要。'I'll make a plan.'（計画を立てよう）。無冠詞の 'make plan' は誤り。" },
    { id: 'g106', q: '「いつ勉強できるかの計画」の前置詞は？', choices: ['a plan about when', 'a plan for when', 'a plan of when', 'a plan on when'], correct: 1,
      explain: '「〜のための計画」は plan for ~ を使うのが自然。"a plan for when I can study"（いつ勉強できるかの計画）。plan about は不自然。' },
    { id: 'g107', q: '「each」の後ろに来る名詞の形は？', choices: ['each characters（複数形）', 'each character（単数形）', 'どちらでもよい', 'each の後に名詞は不要'], correct: 1,
      explain: 'each（それぞれの）の後ろは必ず単数形の名詞が来る。"each character"（それぞれのキャラクター）が正しい。"each characters" は誤り。every も同じルール（every day など）。' },
    { id: 'g108', q: '「日曜日に出かける」の正しい前置詞は？', choices: ['at Sunday', 'on Sunday', 'in Sunday', 'to Sunday'], correct: 1,
      explain: '曜日には前置詞 on を使う。"I go out on Sunday."（日曜日に出かける）。時間の前置詞は、曜日・日付には on、時刻には at、月・年には in を使い分ける。' },
    { id: 'g109', q: '「サブウェイ（店）で食べた」の正しい前置詞は？', choices: ['in Subway', 'at Subway', 'on Subway', 'to Subway'], correct: 1,
      explain: 'お店などの場所「〜で」には at を使う。"I ate lunch at Subway."（サブウェイで昼食を食べた）。at は「地点」を表す。in Subway だと「建物の中」のニュアンスが強くなり、店で食事する意味には at が自然。' },
    { id: 'g110', q: '「リスニングもスピーキングも上達しない」の否定文で正しいのは？', choices: ["I'm not getting better at listening and speaking", "I'm not getting better at listening or speaking", "I'm not getting better at listening also speaking", "I'm not getting better at listening with speaking"], correct: 1,
      explain: "否定文で「AもBも〜ない」と言うときは and ではなく or を使う。'I'm not getting better at listening or speaking.'（リスニングもスピーキングも上達しない）。肯定文の and が、否定文では or に変わる点に注意。" },
    { id: 'g111', q: '「その仕様書」のように特定のものを指すときの冠詞は？', choices: ['a specification', 'the specification', '冠詞なしで specification', "specification's"], correct: 1,
      explain: '話し手と聞き手の両方が「どれのことか分かっている特定のもの」には the を使う。"I started the specification."（例の仕様書に取りかかった）。初めて話題に出す不特定のものなら a を使うが、すでに分かっているものには the。' },
    { id: 'g112', q: '「簡単な仕様」を正しく言うと？', choices: ["it's easily specification", "it's a simple specification", "it's easy specification", "it's simply specification"], correct: 1,
      explain: "easily / simply は副詞（簡単に）で、名詞を説明できない。名詞を説明するのは形容詞の easy / simple（簡単な）。さらに可算名詞なので冠詞 a も必要。'It's a simple specification.'（簡単な仕様だ）が正しい。" },
    { id: 'g113', q: '「私も楽しみにしている」の正しい文は？', choices: ['I also looking forward to it.', "I'm also looking forward to it.", 'I also look forward it.', "I'm also look forward to it."], correct: 1,
      explain: "looking は現在進行形なので、be動詞（am/is/are）が必ず必要。'I'm also looking forward to it.'（私もそれを楽しみにしている）。be動詞の抜けは書くときに起きやすいミス。" },
    { id: 'g114', q: '「（長い間）まだ見ていない」の正しい形は？', choices: ["I hadn't it.", "I haven't watched it.", "I don't watched it.", "I haven't watch it."], correct: 1,
      explain: "「まだ〜していない」は現在完了の否定形 haven't + 過去分詞。'I haven't watched it.'（まだ見ていない）。動詞（watched）を忘れて hadn't it とだけ書かないよう注意。haven't の後は必ず過去分詞。" },
    { id: 'g115', q: '「AをBに変える」の正しい形は？', choices: ['change A with B', 'change A into B', 'change A on B', 'change A from B'], correct: 1,
      explain: "change A into B = AをBに変える。'I'll change lunch into Subway.'（昼食をサブウェイに変える）。change A to B も使える。with や on は誤り。" },
    { id: 'g116', q: '「AはBより楽しい」の正しい比較級は？', choices: ['A is fun better than B', 'A is more fun than B', 'A is funner than B', 'A is more fun better than B'], correct: 1,
      explain: "fun の比較級は more fun。「AはBより楽しい」= A is more fun than B。better than を後ろに付ける形（fun better than）は英語にはない。長めの形容詞は more をつけて比較級を作る。" },
    { id: 'g117', q: '「秋葉原は新宿より楽しい街だ」で正しいのは？', choices: ['Akihabara is a fun town better than Shinjuku', 'Akihabara is a more fun town than Shinjuku', 'Akihabara is funner town than Shinjuku', 'Akihabara is a fun more town than Shinjuku'], correct: 1,
      explain: "a more fun town than ~ = 〜より楽しい街。比較級 more fun は名詞（town）の前に置き、比較する相手は than ~ で表す。better than を余分に付けないよう注意（これはゆうきさんの反復ポイント）。" },
    { id: 'g118', q: '「久々の予定のない休み」を自然に言うと？', choices: ['a day off which I have no plan for a long while', 'my first day off with no plans in a long time', 'a day off no plan long time', 'the day off which no plans in long'], correct: 1,
      explain: "「久々の〜」= my first ~ in a long time（長い間で初めての〜）。'my first day off with no plans in a long time'（久々の予定のない休み）。関係代名詞(which/that)を重ねず、シンプルな形にするのが自然。" },
    { id: 'g119', q: '「今日も観る」を also で表すのが不自然な理由は？', choices: ['also は否定文でしか使えないから', 'also は「別のこともする」の意味で、「昨日に続いて今日も」には合わないから', 'also は文末に置けないから', 'also は過去形と使えないから'], correct: 1,
      explain: "also = 〜もまた（別のことも追加する）。「昨日に続いて今日も同じことをする」は again today が正しい。'I'll watch it again today.'（今日もまた観る）。also を使うと「（他のことに加えて）それも観る」という違う意味になる。" },
    { id: 'g120', q: '「（もう）ほとんど終わった」を自然に言うと？', choices: ['I almost finished it.', "I've almost finished it.", 'I almost finish it.', 'I am almost finished it.'], correct: 1,
      explain: "「今ちょうど〜し終えた（その結果が今も続く）」は現在完了 have + 過去分詞。'I've almost finished it.'（もうほとんど終わった）。過去のある時点ではなく「今の状態」を表すので現在完了が自然。" },
    { id: 'g121', q: '「家に帰ってゲームをする」で and の後の動詞の形は？', choices: ['go home and playing games', 'go home and play games', 'go home and to play games', 'going home and play games'], correct: 1,
      explain: "and で動詞を並べるときは、前後の動詞の形をそろえる（並列）。'I'll go home and play games.'（家に帰ってゲームをする）。go と play を同じ原形にする。playing や to play にすると形がそろわず不自然。" },
    { id: 'g122', q: '「12時までに寝る」の「〜までに（〆切）」の前置詞は？', choices: ['at midnight', 'by midnight', 'until midnight', 'in midnight'], correct: 1,
      explain: "by = 〜までに（その時までに動作を終える＝〆切）。'I'll go to bed by midnight.'（12時までに寝る）。until は「〜までずっと（継続）」なので意味が違う。〆切には by を使う。" },
    { id: 'g123', q: '「それらは美味しい」を自然に言うと？', choices: ['They are good taste.', 'They taste good.', 'They are taste good.', 'They taste well.'], correct: 1,
      explain: "taste は「〜の味がする」という動詞で、後ろに形容詞が来る。'They taste good.'（それらは美味しい）。'are good taste' は誤り。taste（味がする）+ good（形容詞）で「美味しい」。look good（良く見える）と同じ形。" },
    { id: 'g124', q: '「〜したいと思った」を過去のこととして言うとき正しいのは？', choices: ['I thought I want to sing.', 'I wanted to sing.', 'I think I wanted to sing.', 'I thought I want singing.'], correct: 1,
      explain: "過去の気持ちは過去形でそろえる。'I wanted to sing.'（歌いたいと思った）。'I thought I want' のように、過去（thought）と現在（want）が混ざるのは時制がそろっておらず不自然。シンプルに wanted でOK。" },
    { id: 'g125', q: "s で終わる複数名詞（バンド名 Imagine Dragons）の所有格は？", choices: ["Imagine Dragons's song", "Imagine Dragons' song", "Imagine Dragon's song", "Imagine Dragons song's"], correct: 1,
      explain: "s で終わる語の所有格は、アポストロフィだけを付ける（'s ではなく ' のみ）。'Imagine Dragons' song'（イマジン・ドラゴンズの曲）。複数形やsで終わる名前は ' だけにするのがルール。" },
    { id: 'g126', q: '「3日間の休み」の正しい形は？', choices: ['three day off', 'three days off', 'three days offs', 'three off days'], correct: 1,
      explain: "day off（休日）を複数にするときは day を複数形にして days off。'I have three days off.'（3日間の休みがある）。off ではなく day のほうに s を付けるのがポイント。" },
    { id: 'g127', q: '「確かに（本当に）言いましたよね」と強調するときの形は？', choices: ['You are mention it.', 'You did mention it.', 'You did mentioned it.', 'You do mentioned it.'], correct: 1,
      explain: "did + 動詞の原形 = 確かに〜した（強調）。'You did mention it.'（確かに言いましたよね）。did のあとは必ず原形（mention）。過去の動作を「本当に〜した」と念押しするときに使う。" },
    { id: 'g128', q: '「脱出ゲーム（escape game）」に付く冠詞は？', choices: ['a escape game', 'an escape game', 'the escape game only', '冠詞は不要'], correct: 1,
      explain: "a か an かは「次に来る音」で決まる。escape は母音の音（エ）で始まるので an を使う。'I went to an escape game.'（脱出ゲームに行った）。スペルではなく発音で判断するのがポイント。" },
    { id: 'g129', q: '「買い物に行く」の正しい形は？', choices: ['go to shopping', 'go shopping', 'go for shop', 'go to shop it'], correct: 1,
      explain: "go + ~ing = 〜しに行く（to は付けない）。'I went shopping.'（買い物に行った）。go swimming（泳ぎに行く）、go fishing（釣りに行く）も同じ形。" },
    { id: 'g130', q: '「（前から決めていて）〜するつもり」を表す形は？', choices: ['I will eat it tonight.', "I'm going to eat it tonight.", 'I am eat it tonight.', 'I go to eat it tonight.'], correct: 1,
      explain: "be going to = 前から決めていた予定。'I'm going to eat hamburg steak tonight.'（今夜はハンバーグを食べる予定だ）。will はその場で決めたことや予測に使うので、決まっている予定には be going to が自然。" },
    { id: 'g131', q: '「家に帰った」を自然に言うと？', choices: ['I went back to home.', 'I went home.', 'I went to home.', 'I returned to home.'], correct: 1,
      explain: "home は副詞なので to は不要。'I went home.'（家に帰った）。back を付けなくても「帰る」の意味は伝わるので、シンプルに went home が自然。get home（家に着く）も同じく to は不要。" },
    { id: 'g132', q: '「（それは）楽しかった」を正しく言うと？', choices: ['I was fun.', 'It was fun.', 'I was funny.', 'It was funny.'], correct: 1,
      explain: "fun（楽しいこと）は「出来事・体験」を主語にする。'It was fun.'（楽しかった）。'I was fun.' だと「私は（周りにとって）愉快な人だった」という別の意味になってしまう。楽しかった対象は it（そのこと）で表す。" },
    { id: 'g133', q: '「サッカーをする」と「テニスをする」で動詞は？', choices: ['do soccer / do tennis', 'play soccer / play tennis', 'make soccer / make tennis', 'go soccer / go tennis'], correct: 1,
      explain: "ボールを使う球技には play を使う。play soccer / play tennis。'I played tennis.'（テニスをした）。一方、ボールを使わないスポーツ（柔道・水泳など）には do を使う（do judo）。" },
    { id: 'g134', q: '「とても疲れた」と強調するとき自然なのは？', choices: ['I was very much tired.', 'I was so tired.', 'I was too tired to fun.', 'I was tired so.'], correct: 1,
      explain: "so + 形容詞 = とても〜（話し言葉で気持ちを込めた強調）。'I was so tired.'（すごく疲れた）。very も使えるが、会話で感情を込めるときは so が自然。too は「〜すぎる（マイナス）」なので意味が変わる。" },
