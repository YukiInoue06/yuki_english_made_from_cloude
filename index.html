<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英語クイズ">
<title>英語復習クイズ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
    background: #0f0f0e;
    color: #f0eee7;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) 16px; padding-top: calc(16px + env(safe-area-inset-top)); }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 16px; }
  .header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; color: #f0eee7; }
  .header .updated { font-size: 11px; color: #6b6862; margin-top: 3px; }
  .header .total { font-size: 12px; color: #a8a59c; background: #2a2a27; padding: 3px 10px; border-radius: 12px; }
  .card { background: #1a1a18; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; margin-bottom: 12px; }
  .subtitle { font-size: 13px; color: #a8a59c; margin: 0 0 16px; line-height: 1.5; }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .mode-btn { background: #232321; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px 12px; cursor: pointer; text-align: center; font-family: inherit; color: #f0eee7; transition: transform 0.1s, background 0.15s; -webkit-appearance: none; }
  .mode-btn:active { transform: scale(0.97); background: #2d2d2a; }
  .mode-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .mode-icon { font-size: 26px; margin-bottom: 6px; }
  .mode-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; color: #f0eee7; }
  .mode-count { font-size: 11px; color: #a8a59c; }
  .mode-mastered { font-size: 10px; color: #C0DD97; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #232321; border-radius: 12px; padding: 12px 8px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 600; line-height: 1.2; color: #f0eee7; }
  .stat-lbl { font-size: 11px; color: #a8a59c; margin-top: 2px; }
  .mastery-bar { margin-top: 14px; padding: 12px 14px; background: #232321; border-radius: 12px; }
  .mastery-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; }
  .mastery-label { color: #a8a59c; }
  .mastery-value { color: #C0DD97; font-weight: 600; }
  .mastery-progress { height: 6px; background: #2a2a27; border-radius: 3px; overflow: hidden; }
  .mastery-fill { height: 100%; background: linear-gradient(90deg, #639922, #8FBE4F); transition: width 0.4s; }
  .mastery-hint { font-size: 11px; color: #a8a59c; margin-top: 8px; line-height: 1.5; }
  .reset-btn { background: transparent; border: none; color: #6b6862; font-size: 11px; cursor: pointer; padding: 4px 8px; margin-top: 8px; text-decoration: underline; font-family: inherit; }
  .reset-btn:active { color: #a8a59c; }
  .q-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #a8a59c; margin-bottom: 10px; }
  .streak { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 10px; background: #3a2a0f; color: #FAC775; border-radius: 12px; font-weight: 500; }
  .q-progress { height: 5px; background: #2a2a27; border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .q-progress-fill { height: 100%; background: #378ADD; transition: width 0.3s; }
  .q-text { font-size: 17px; font-weight: 600; margin: 0 0 4px; line-height: 1.5; letter-spacing: -0.01em; color: #f0eee7; }
  .q-hint { font-size: 12px; color: #a8a59c; margin: 0 0 16px; }
  .q-mastery-tag { display: inline-block; font-size: 10px; padding: 2px 8px; background: #1f3a0f; color: #C0DD97; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice { background: #232321; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; font-size: 15px; font-family: inherit; color: #f0eee7; min-height: 50px; line-height: 1.4; -webkit-appearance: none; transition: transform 0.1s, background 0.15s, border-color 0.15s; }
  .choice:active:not(:disabled) { transform: scale(0.98); background: #2d2d2a; }
  .choice:disabled { cursor: default; }
  .choice.correct { background: #1f3a0f; border-color: #639922; color: #C0DD97; font-weight: 500; }
  .choice.wrong { background: #3a1313; border-color: #A32D2D; color: #F09595; font-weight: 500; }
  .choice.dim { opacity: 0.35; }
  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .feedback.ok { background: #1f3a0f; color: #C0DD97; }
  .feedback.ng { background: #3a1313; color: #F09595; }
  .fb-label { font-weight: 600; margin-bottom: 4px; font-size: 13px; }
  .fb-mastery { display: block; margin-top: 8px; font-size: 12px; font-weight: 500; padding-top: 8px; border-top: 1px solid rgba(192,221,151,0.2); }
  .btn { width: 100%; margin-top: 12px; padding: 14px; background: #232321; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; font-family: inherit; color: #f0eee7; min-height: 48px; -webkit-appearance: none; transition: transform 0.1s, background 0.15s; }
  .btn:active { transform: scale(0.98); background: #2d2d2a; }
  .btn-primary { background: #378ADD; color: white; border-color: #378ADD; }
  .btn-primary:active { background: #185FA5; }
  .score-num { font-size: 48px; font-weight: 700; text-align: center; margin: 16px 0 4px; letter-spacing: -0.02em; color: #f0eee7; }
  .score-msg { text-align: center; font-size: 14px; color: #a8a59c; margin-bottom: 16px; }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .btn-row .btn { margin-top: 0; }
  .review { margin-top: 8px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  .review-h { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #f0eee7; }
  .review-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; line-height: 1.5; color: #d4d2c9; }
  .review-item:last-child { border-bottom: none; }
  .review-mark { display: inline-block; width: 20px; }
  .review-correct { margin-left: 20px; margin-top: 4px; color: #a8a59c; font-size: 12px; }
  .br-stage { margin-bottom: 10px; }
  .br-label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 5px; }
  .br-box { border-radius: 12px; padding: 13px 15px; font-size: 15.5px; line-height: 1.65; }
  .br-raw .br-label { color: #F09595; }
  .br-raw .br-box { background: #2a1d1d; border: 1px solid rgba(163,45,45,0.45); color: #f0eee7; }
  .br-simple .br-label { color: #FAC775; }
  .br-simple .br-box { background: #2b2518; border: 1px solid rgba(250,199,117,0.35); color: #f0eee7; }
  .br-en .br-label { color: #C0DD97; }
  .br-en .br-box { background: #1f2a18; border: 1px solid rgba(99,153,34,0.5); color: #f0eee7; font-weight: 600; }
  .br-line { display: block; }
  .br-line + .br-line { margin-top: 4px; }
  .br-arrow { text-align: center; font-size: 12px; color: #6b6862; margin: 2px 0 6px; }
  .br-note { margin-top: 10px; padding: 11px 13px; background: #232321; border-radius: 10px; font-size: 13px; color: #a8a59c; line-height: 1.6; }
  .br-theme { display: inline-block; font-size: 10px; padding: 2px 8px; background: #2a2a27; color: #a8a59c; border-radius: 8px; margin-bottom: 10px; }
  .br-hint { font-size: 12.5px; color: #a8a59c; margin: 0 0 14px; line-height: 1.6; }
  .pb-sec { margin-bottom: 8px; }
  .pb-h { width: 100%; display: flex; align-items: center; gap: 8px; background: #232321; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 14px; font-family: inherit; color: #f0eee7; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; -webkit-appearance: none; transition: background 0.15s; }
  .pb-h:active { background: #2d2d2a; }
  .pb-h.open { background: #2a2f22; border-color: rgba(99,153,34,0.5); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .pb-h-name { flex: 1; }
  .pb-h-num { font-size: 11px; color: #a8a59c; font-weight: 400; }
  .pb-arrow { font-size: 11px; color: #a8a59c; transition: transform 0.2s; }
  .pb-h.open .pb-arrow { transform: rotate(90deg); }
  .pb-body { border: 1px solid rgba(99,153,34,0.5); border-top: none; border-radius: 0 0 12px 12px; padding: 10px 10px 4px; background: #1c1c1a; }
  .pb-item { display: flex; align-items: flex-start; gap: 4px; background: #232321; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
  .pb-item.pick { border-color: #639922; background: #1f2a18; }
  .pb-starbtn { flex: 0 0 auto; background: none; border: none; font-family: inherit; font-size: 19px; line-height: 1; color: #55544e; padding: 8px 9px 8px 4px; margin: -4px 0 -4px -4px; cursor: pointer; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; transition: transform 0.1s, color 0.15s; }
  .pb-starbtn:active { transform: scale(1.25); }
  .pb-starbtn.on { color: #C0DD97; }
  .pb-text { flex: 1; min-width: 0; }
  .pb-en { font-size: 15.5px; font-weight: 600; line-height: 1.45; }
  .pb-ja { font-size: 12.5px; color: #a8a59c; margin-top: 3px; line-height: 1.5; }
  .pb-reset { display: block; width: 100%; background: none; border: none; color: #a8a59c; font-family: inherit; font-size: 12px; text-decoration: underline; padding: 6px; margin-bottom: 10px; cursor: pointer; -webkit-appearance: none; }
  .pb-note { font-size: 13.5px; color: #a8a59c; line-height: 1.6; margin: 0 0 12px; }
  .pb-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pb-tool { padding: 10px 8px; border-radius: 10px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer; -webkit-appearance: none; background: #232321; border: 1px solid rgba(255,255,255,0.08); color: #a8a59c; }
  .pb-tool.on { background: #1f2a18; border-color: #639922; color: #C0DD97; }
  .pb-empty { font-size: 13px; color: #a8a59c; padding: 4px 3px 10px; }
  .judge-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .judge-btn { padding: 16px 10px; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; min-height: 56px; -webkit-appearance: none; border: 1px solid; transition: transform 0.1s, background 0.15s; }
  .judge-btn:active { transform: scale(0.97); }
  .judge-ok { background: #1f3a0f; border-color: #639922; color: #C0DD97; }
  .judge-ok:active { background: #2a4d14; }
  .judge-ng { background: #3a1313; border-color: #A32D2D; color: #F09595; }
  .judge-ng:active { background: #4d1a1a; }
  .speak-tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; margin-left: 6px; vertical-align: middle; background: #2a2a27; color: #a8a59c; }
  .speak-tag.hot { background: #1f3a0f; color: #C0DD97; }
  .speak-tag.new { background: #1e3247; color: #9FC7F0; }
  .empty-state { text-align: center; padding: 24px 16px; color: #a8a59c; font-size: 14px; line-height: 1.6; }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  @media (max-width: 360px) {
    .mode-name { font-size: 14px; }
    .q-text { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>📚 英語復習クイズ</h1>
      <div class="updated" id="updated-badge"></div>
    </div>
    <span class="total" id="total-badge"></span>
  </div>
  <div class="card" id="root"></div>
</div>

<script>
const QUESTIONS = {
  phrase: [
    { id: "p01", q: "「いつもほど英語を学べなかった」を正しく言うと？", choices: ["I couldn't learn more than usual", "I couldn't learn as much as usual", "I couldn't learn so much than usual", "I couldn't learn than usual"], correct: 1,
      explain: "not as much as usual = いつもほど〜ない。'I couldn't learn as much as usual.'（いつもほど学べなかった）。more than usual にすると「いつも以上には学べなかった」＝普段どおりは学べた、という逆に近い意味になる。" },
    { id: "p02", q: "「別の先生に変えたい」を自然に言うと？", choices: ["I want to change the teacher", "I want to try a different teacher", "I want to exchange the teacher", "I want to change a teacher"], correct: 1,
      explain: "try a different teacher = 別の先生を試す。'I want to try a different teacher.'。change the teacher だと「その先生自身を別人に作り変える」ように聞こえる。change teachers と複数形にすれば「先生を変える」の意味で使える。" },
    { id: "p03", q: "「落ち着いて仕事をする」を正しく言うと？", choices: ["I'll be calm down and work", "I'll stay calm and work", "I'll be calm down to work", "I'll calm and work"], correct: 1,
      explain: "calm down はそれ自体が動詞（落ち着く）なので、be を前に置けない。「落ち着いた状態でいる」は stay calm / keep calm。'I'll stay calm and finish my tasks.'（落ち着いてタスクを終わらせる）。" },
    { id: "p04", q: "「気持ちを切り替える」を正しく言うと？", choices: ["change my mind", "clear my mind", "change my feeling", "turn my mind"], correct: 1,
      explain: "clear my mind = 頭をすっきりさせる、気持ちを切り替える。change my mind は「考え（意見）を変える」という別の意味なので注意。refresh myself や start fresh も使える。" },
    { id: "p05", q: "「今夜は早く寝る」を正しく言うと？", choices: ["I'll go to bed early today", "I'll go to bed early tonight", "I'll go to bed early at night", "I'll go to bed early this day"], correct: 1,
      explain: "寝る時間の話は tonight（今夜）を使う。'I'll go to bed early tonight.'。today は一日全体を指すので、夜のことを言うときは不自然に聞こえる。this morning / this afternoon / tonight と使い分ける。" },
    { id: "p06", q: "「明日、上司に報告しないといけない」を正しく言うと？", choices: ["I tell my manager tomorrow", "I need to tell my manager tomorrow", "I telling my manager tomorrow", "I will telling my manager tomorrow"], correct: 1,
      explain: "これからやるべきことは need to + 動詞の原形。'I need to tell my manager tomorrow.'（明日上司に報告しないといけない）。現在形の I tell だと「いつも報告している」という習慣の意味になってしまう。" },
    { id: "p07", q: "「マスターボールのランクに到達する」を自然に言うと？", choices: ["get the Master Ball rank", "reach the Master Ball rank", "arrive the Master Ball rank", "take the Master Ball rank"], correct: 1,
      explain: "reach = （ある段階・ランク）に到達する。'I'm close to reaching the Master Ball rank.'（マスターボールのランクまであと少しだ）。ランク名は大文字で始めるのが自然。" },
    { id: "p08", q: "「だんだん面白くなってきた」を正しく言うと？", choices: ["It seemed like getting fun", "It is starting to get fun", "It seems like get fun", "It started like getting fun"], correct: 1,
      explain: "start to get ~ = だんだん〜になってくる。'The game is starting to get fun.'（そのゲームはだんだん面白くなってきた）。seem like の後ろに動詞の -ing 形を続ける形は文法的に作れない。" },
    { id: "p09", q: "「のどが痛い」を正しく言うと？", choices: ["I have a sour throat", "I have a sore throat", "I have a sore neck", "I have a sick throat"], correct: 1,
      explain: "sore = （体の一部が）ひりひり痛い。'I have a sore throat.'（のどが痛い）。sour は「すっぱい」という味の話なので全く別の意味。sore muscles（筋肉痛）も同じ使い方。" },
    { id: "p10", q: "「体調が良くなってきた」を正しく言うと？", choices: ["It's going well today", "I feel better today", "I'm going well today", "My body goes well today"], correct: 1,
      explain: "体調が良くなることは feel better。'I feel better today.'（今日は体調が良くなってきた）。go well は「（仕事や計画が）うまくいく」という意味なので、体調には使わない。" },
    { id: "p11", q: "「週末までに治したい」の「〜までに」は？", choices: ["until the weekend", "by the weekend", "till the weekend", "in the weekend"], correct: 1,
      explain: "by = 〜までに（その時までに終わらせる＝期限）。'I want to get better by the weekend.'（週末までに治したい）。until は「〜までずっと（継続）」なので意味が変わる。ゆうきさんの反復ポイント。" },
    { id: "p12", q: "「歯のホワイトニングをしてもらう」を正しく言うと？", choices: ["I'll take teeth whitening", "I'll get my teeth whitened", "I'll do my teeth white", "I'll make my teeth whitening"], correct: 1,
      explain: "get + もの + 過去分詞 = （人に）〜してもらう。'I'll get my teeth whitened.'（歯を白くしてもらう）。髪を切ってもらうのも 'I had my hair cut.' と同じ形。自分でやるのではなく、誰かにやってもらうときの言い方。" },
    { id: "p13", q: "「イベントでダンスを見た」の前置詞は？", choices: ["in an event", "at an event", "on an event", "to an event"], correct: 1,
      explain: "イベントや催しが行われる場には at を使う。'We watched a dance show at an event.'（イベントでダンスショーを見た）。at the party / at the concert も同じ。in だと「イベントの中身の一部として」というニュアンスになる。" },
    { id: "p14", q: "「彼女の誕生日に」の前置詞は？", choices: ["in her birthday", "on her birthday", "at her birthday", "to her birthday"], correct: 1,
      explain: "特定の日には on を使う。'I want to go there again on her birthday.'（彼女の誕生日にまたそこへ行きたい）。日付・曜日・記念日はすべて on。月や年には in、時刻には at。" },
    { id: "p15", q: "「子どもの頃からずっと好き」を正しく言うと？", choices: ["She likes it since she was a child", "She has loved it since she was a child", "She loved it since she was a child", "She is loving it since she was a child"], correct: 1,
      explain: "since（〜から今までずっと）は現在完了（have/has + 過去分詞）と一緒に使う。'She has loved Hello Kitty since she was a child.'（彼女は子どもの頃からハローキティが好きだ）。今も続いている状態を表す。" },
    { id: "p16", q: "「魚をもっと頻繁に食べたい」を自然に言うと？", choices: ["I want to eat fish a lot", "I want to eat fish more often", "I want to eat fish many times", "I want to eat fish so much"], correct: 1,
      explain: "more often = もっと頻繁に（回数を増やす）。'I want to eat fish more often.'（魚をもっと食べるようにしたい）。a lot は「量をたくさん」なので、「頻度を上げたい」ときは more often が合う。" },
    { id: "p17", q: "「新幹線で行く」の前置詞は？", choices: ["for Shinkansen", "by Shinkansen", "on Shinkansen", "with Shinkansen"], correct: 1,
      explain: "交通手段は by を使う。'We'll go there by Shinkansen.'（新幹線で行く）。by car / by train / by bus も同じ。ただし「歩いて」は on foot。ゆうきさんの反復ポイント。" },
    { id: "p18", q: "「レッスンがうまくいかなかった」を正しく言うと？", choices: ["My lesson didn't went well", "My lesson didn't go well", "My lesson doesn't went well", "My lesson didn't going well"], correct: 1,
      explain: "didn't の後ろは必ず動詞の原形。'My lesson didn't go well.'（レッスンがうまくいかなかった）。didn't 自体がすでに過去を表しているので、動詞を過去形にする必要はない。" },
    { id: "p19", q: "「英語を話す努力を続けたい」を正しく言うと？", choices: ["I want to keep trying to speaking", "I want to keep trying to speak", "I want to keep try to speak", "I want to keeping try speaking"], correct: 1,
      explain: "to の後ろは動詞の原形（to speak）、keep の後ろは -ing（keep trying）。'I want to keep trying to speak English.'（英語を話す努力を続けたい）。2つのルールが並ぶので間違えやすい形。" },
    { id: "p20", q: "「新しいデッキを作るのが楽しみ」を正しく言うと？", choices: ["I'm looking forward to build a new deck", "I'm looking forward to building a new deck", "I'm looking forward build a new deck", "I look forward to build a new deck"], correct: 1,

function loadData() {
  try {
    const s = localStorage.getItem('eng-quiz-stats');
    if (s) stats = JSON.parse(s);
  } catch (e) {}
  try {
    const m = localStorage.getItem('eng-quiz-mastery');
    if (m) mastery = JSON.parse(m);
  } catch (e) {}
  try {
    const w = localStorage.getItem('eng-quiz-wrong');
    if (w) wrongCount = JSON.parse(w);
  } catch (e) {}
  try {
    const sp = localStorage.getItem('eng-quiz-speak');
    if (sp) speakRec = JSON.parse(sp);
  } catch (e) {}
  try {
    const ps = localStorage.getItem('eng-quiz-pbstars');
    if (ps) pbStars = JSON.parse(ps);
  } catch (e) {}
  try {
    const br = localStorage.getItem('eng-quiz-bridge');
    if (br) bridgeRec = JSON.parse(br);
  } catch (e) {}
}

function saveStats() {
  try { localStorage.setItem('eng-quiz-stats', JSON.stringify(stats)); } catch (e) {}
}
function saveMastery() {
  try { localStorage.setItem('eng-quiz-mastery', JSON.stringify(mastery)); } catch (e) {}
}
function saveWrongCount() {
  try { localStorage.setItem('eng-quiz-wrong', JSON.stringify(wrongCount)); } catch (e) {}
}
function saveSpeakRec() {
  try { localStorage.setItem('eng-quiz-speak', JSON.stringify(speakRec)); } catch (e) {}
}
function saveBridgeRec() {
  try { localStorage.setItem('eng-quiz-bridge', JSON.stringify(bridgeRec)); } catch (e) {}
}

function getBridgeStreak(id) { return (bridgeRec[id] && bridgeRec[id].s) || 0; }
function isBridgeSettled(id) { return getBridgeStreak(id) >= SPEAK_THRESHOLD; }

function getBridgeStats() {
  const settled = BRIDGE.filter(b => isBridgeSettled(b.id)).length;
  const today = BRIDGE.filter(b => bridgeRec[b.id] && bridgeRec[b.id].last === todayStr()).length;
  return { settled, today, total: BRIDGE.length, pct: Math.round(settled / BRIDGE.length * 100) };
}

// できなかったもの → 未挑戦 → 練習中 → 定着済み の順で選ぶ
function pickBridgeSet(n) {
  const rank = b => {
    const r = bridgeRec[b.id];
    if (!r) return 1;
    if (r.s === 0) return 0;
    if (r.s >= SPEAK_THRESHOLD) return 3;
    return 2;
  };
  return shuffle(BRIDGE).sort((a, b) => rank(a) - rank(b)).slice(0, n);
}

function savePbStars() {
  try { localStorage.setItem('eng-quiz-pbstars', JSON.stringify(pbStars)); } catch (e) {}
}

// ★が付いているか（初期値 pick を、付け替えがあれば上書き）
function isStarred(it) {
  return Object.prototype.hasOwnProperty.call(pbStars, it.en) ? !!pbStars[it.en] : !!it.pick;
}

function toggleStar(en) {
  const it = PHRASEBOOK.flatMap(s => s.items).find(x => x.en === en);
  if (!it) return;
  const now = !isStarred(it);
  if (now === !!it.pick) delete pbStars[en];   // 初期値に戻ったら記録を消す
  else pbStars[en] = now;
  savePbStars();
  if (navigator.vibrate) navigator.vibrate(15);
  render();
}

function resetStars() {
  if (confirm('★の付け替えを初期状態に戻しますか？')) {
    pbStars = {};
    savePbStars();
    render();
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getSpeakStreak(id) { return (speakRec[id] && speakRec[id].s) || 0; }
function isSpeakSettled(id) { return getSpeakStreak(id) >= SPEAK_THRESHOLD; }

function getSpeakStats() {
  const settled = SPEAKING.filter(s => isSpeakSettled(s.id)).length;
  const touched = SPEAKING.filter(s => speakRec[s.id]).length;
  const today = SPEAKING.filter(s => speakRec[s.id] && speakRec[s.id].last === todayStr()).length;
  return { settled, touched, today, total: SPEAKING.length, pct: Math.round(settled / SPEAKING.length * 100) };
}

// 出題の優先順位：言えなかった文 → 未挑戦 → 練習中 → 定着済み
function pickSpeakSet(n) {
  const rank = s => {
    const r = speakRec[s.id];
    if (!r) return 1;
    if (r.s === 0) return 0;
    if (r.s >= SPEAK_THRESHOLD) return 3;
    return 2;
  };
  return shuffle(SPEAKING).sort((a, b) => rank(a) - rank(b)).slice(0, n);
}

function resetMastery() {
  if (confirm('マスター記録（クイズの連続正解・瞬間英作文・和文和訳の定着）をリセットしますか？\nスコア記録は残ります。')) {
    mastery = {};
    speakRec = {};
    bridgeRec = {};
    saveMastery();
    saveSpeakRec();
    saveBridgeRec();
    render();
  }
}

// 記録をコード化（デバイス間共有用）
function makeSyncCode() {
  const data = { v: 5, mastery, stats, wrongCount, speakRec, pbStars, bridgeRec };
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

function applySyncCode(code) {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!data || (!data.mastery && !data.stats)) throw new Error('invalid');
    let importedMastered = 0, currentMastered = 0;
    const allIds = [...QUESTIONS.phrase].map(q => q.id);
    if (data.mastery) {
      allIds.forEach(id => { if ((data.mastery[id]||0) >= MASTERY_THRESHOLD) importedMastered++; });
      allIds.forEach(id => { if ((mastery[id]||0) >= MASTERY_THRESHOLD) currentMastered++; });
    }
    const msg = `読み込むと、今の記録は上書きされます。\n\n読み込むコードのマスター数: ${importedMastered}問\n今の端末のマスター数: ${currentMastered}問\n\n続けますか？`;
    if (!confirm(msg)) return;
    if (data.mastery) { mastery = data.mastery; saveMastery(); }
    if (data.stats) { stats = data.stats; saveStats(); }
    if (data.wrongCount) { wrongCount = data.wrongCount; saveWrongCount(); }
    if (data.speakRec) { speakRec = data.speakRec; saveSpeakRec(); }
    if (data.pbStars) { pbStars = data.pbStars; savePbStars(); }
    if (data.bridgeRec) { bridgeRec = data.bridgeRec; saveBridgeRec(); }
    // v1の古いコード（wrongCountなし）の場合は、今の端末のwrongCountをそのまま維持
    state.mode = null;
    render();
    alert('記録を読み込みました！🎉');
  } catch (e) {
    alert('コードが正しくないようです。コード全体をコピーできているか確認してください。');
  }
}

function openSync() { state.mode = 'sync'; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function getStreak(id) { return mastery[id] || 0; }
function isMastered(id) { return getStreak(id) >= MASTERY_THRESHOLD; }

function getAvailable(category) {
  if (category === 'speak') return SPEAKING;
  return QUESTIONS[category].filter(q => !isMastered(q.id));
}

function getMasteryStats() {
  const all = [...QUESTIONS.phrase];
  const mastered = all.filter(q => isMastered(q.id)).length;
  return { mastered, total: all.length, pct: all.length === 0 ? 0 : Math.round(mastered / all.length * 100) };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 出題のたびに選択肢をシャッフルし、正解位置をばらけさせる
// 「どちらも〜」のような他の選択肢を参照するメタ選択肢は最後に固定する
function shuffleChoices(q) {
  const correctText = q.choices[q.correct];
  const metaPattern = /どちらも|両方|いずれも/;
  const movable = q.choices.filter(c => !metaPattern.test(c));
  const fixed = q.choices.filter(c => metaPattern.test(c));
  const newChoices = [...shuffle(movable), ...fixed];
  return { ...q, choices: newChoices, correct: newChoices.indexOf(correctText) };
}

function startMode(mode) {
  if (mode === 'book') {
    state = { mode: 'book', questions: [], idx: 0, score: 0, answered: false, picked: -1, revealed: false, history: [], openSecs: [], pickOnly: false };
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (mode === 'speak') {
    startSpeak(pickSpeakSet(Math.min(10, SPEAKING.length)));
    return;
  }
  if (mode === 'bridge') {
    startBridge(pickBridgeSet(Math.min(5, BRIDGE.length)));
    return;
  }
  const available = getAvailable(mode);
  if (available.length === 0) {
    alert('このカテゴリは全問マスター済みです！🎉\nマスター記録をリセットすると再挑戦できます。');
    return;
  }
  const limit = 10;
  const qs = shuffle(available).slice(0, Math.min(limit, available.length)).map(shuffleChoices);
  state = { mode, questions: qs, idx: 0, score: 0, answered: false, picked: -1, revealed: false, history: [] };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pick(i) {
  if (state.answered) return;
  state.answered = true;
  state.picked = i;
  const q = state.questions[state.idx];
  const ok = i === q.correct;
  if (ok) state.score++;
  
  // Update mastery
  const prevStreak = getStreak(q.id);
  const newStreak = ok ? prevStreak + 1 : 0;
  mastery[q.id] = newStreak;
  saveMastery();
  if (!ok) {
    wrongCount[q.id] = (wrongCount[q.id] || 0) + 1;
    saveWrongCount();
  }
  
  state.history.push({
    q: q.q, picked: q.choices[i], correct: q.choices[q.correct], ok, explain: q.explain,
    prevStreak, newStreak, justMastered: ok && newStreak === MASTERY_THRESHOLD
  });
  render();
  if (navigator.vibrate) navigator.vibrate(ok ? 20 : [10, 30, 10]);
}

function reveal() {
  state.revealed = true;
  render();
}

function startBridge(list) {
  state = { mode: 'bridge', questions: shuffle(list), idx: 0, score: 0, answered: false, picked: -1, revealed: false, step: 0, history: [] };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function bridgeNext() {
  state.step++;
  render();
}

function markBridge(ok) {
  const b = state.questions[state.idx];
  const r = bridgeRec[b.id] || { s: 0, ok: 0, ng: 0 };
  const prev = r.s;
  r.s = ok ? prev + 1 : 0;
  if (ok) r.ok++; else r.ng++;
  r.last = todayStr();
  bridgeRec[b.id] = r;
  saveBridgeRec();
  if (ok) state.score++;
  state.history.push({ id: b.id, raw: b.raw, simple: b.simple, en: b.en, note: b.note, ok,
    justSettled: ok && r.s === SPEAK_THRESHOLD });
  if (navigator.vibrate) navigator.vibrate(ok ? 20 : [10, 30, 10]);
  state.idx++;
  state.step = 0;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startSpeak(list) {
  state = { mode: 'speak', questions: shuffle(list), idx: 0, score: 0, answered: false, picked: -1, revealed: false, history: [] };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 自己採点：言えた / 言えなかった
function markSpeak(ok) {
  if (!state.revealed) return;
  const s = state.questions[state.idx];
  const r = speakRec[s.id] || { s: 0, ok: 0, ng: 0 };
  const prev = r.s;
  r.s = ok ? prev + 1 : 0;
  if (ok) r.ok++; else r.ng++;
  r.last = todayStr();
  speakRec[s.id] = r;
  saveSpeakRec();
  if (ok) state.score++;
  state.history.push({
    id: s.id, ja: s.ja, en: s.en, note: s.note, ok,
    prevStreak: prev, newStreak: r.s, justSettled: ok && r.s === SPEAK_THRESHOLD
  });
  if (navigator.vibrate) navigator.vibrate(ok ? 20 : [10, 30, 10]);
  next();
}

function next() {
  state.idx++;
  state.answered = false;
  state.picked = -1;
  state.revealed = false;
  if (state.idx >= state.questions.length && state.mode !== 'speak') {
    stats.played++;
    stats.totalCorrect += state.score;
    const pct = Math.round(state.score / state.questions.length * 100);
    if (pct > stats.best) stats.best = pct;
    saveStats();
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  state.mode = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const r = document.getElementById('root');
  if (state.mode === 'sync') r.innerHTML = renderSync();
  else if (state.mode === null) r.innerHTML = renderHome();
  else if (state.mode === 'book') r.innerHTML = renderPhrasebook();
  else if (state.idx >= state.questions.length) r.innerHTML = state.mode === 'speak' ? renderSpeakResult() : (state.mode === 'bridge' ? renderBridgeResult() : renderResult());
  else if (state.mode === 'speak') r.innerHTML = renderSpeak();
  else if (state.mode === 'bridge') r.innerHTML = renderBridge();
  else r.innerHTML = renderQuestion();
  attach();
}

function renderQuestion() {
  const q = state.questions[state.idx];
  const total = state.questions.length;
  const pct = Math.round((state.idx) / total * 100);
  const modeName = { phrase: 'フレーズ' }[state.mode];
  const streak = getStreak(q.id);
  const streakTag = streak > 0 ? `<span class="q-mastery-tag">連続正解 ${streak}/${MASTERY_THRESHOLD}</span>` : '';
  
  let choicesHTML = q.choices.map((c, i) => {
    let cls = 'choice';
    if (state.answered) {
      if (i === q.correct) cls += ' correct';
      else if (i === state.picked) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-pick="${i}" ${state.answered ? 'disabled' : ''}>${esc(c)}</button>`;
  }).join('');
  
  let fbHTML = '';
  if (state.answered) {
    const ok = state.picked === q.correct;
    const last = state.history[state.history.length - 1];
    let masteryNote = '';
    if (ok) {
      if (last.justMastered) {
        masteryNote = `<span class="fb-mastery">🎉 マスター達成！この問題はもう出題されません。</span>`;
      } else {
        masteryNote = `<span class="fb-mastery">連続正解 ${last.newStreak}/${MASTERY_THRESHOLD} ${last.newStreak >= 1 && last.newStreak < MASTERY_THRESHOLD ? '（あと ' + (MASTERY_THRESHOLD - last.newStreak) + ' 回でマスター）' : ''}</span>`;
      }
    } else if (last.prevStreak > 0) {
      masteryNote = `<span class="fb-mastery">連続正解はリセットされました（${last.prevStreak} → 0）</span>`;
    }
    fbHTML = `
      <div class="feedback ${ok ? 'ok' : 'ng'}">
        <div class="fb-label">${ok ? '✓ 正解！' : '✗ 残念...'}</div>
        ${esc(q.explain)}
        ${masteryNote}
      </div>
      <button class="btn btn-primary" id="nextBtn">${state.idx + 1 === total ? '結果を見る' : '次の問題へ'}</button>
    `;
  }
  
  return `
    <div class="q-head">
      <span>${modeName} · ${state.idx + 1} / ${total}</span>
      <span class="streak">🔥 ${state.score}</span>
    </div>
    <div class="q-progress"><div class="q-progress-fill" style="width: ${pct}%"></div></div>
    <p class="q-text">${esc(q.q)}${streakTag}</p>
    <p class="q-hint">4つの中から1つ選んでください</p>
    <div class="choices">${choicesHTML}</div>
    ${fbHTML}
    <button class="btn" id="homeBtn" style="margin-top: 16px;">ホームに戻る</button>
  `;
}

  } else {
    body = `
      <p class="q-text" style="opacity:0.6;">${esc(s.ja)}</p>
      <div class="feedback ok" style="margin-top:14px;">
        <div style="font-size:17px;font-weight:600;line-height:1.5;margin-bottom:6px;">${esc(s.en)}</div>
        ${s.note ? `<div style="font-size:13px;opacity:0.85;">${esc(s.note)}</div>` : ''}
      </div>
      <p class="q-hint" style="margin:14px 0 0;">言えましたか？</p>
      <div class="judge-row">
        <button class="judge-btn judge-ok" data-judge="1">◯ 言えた</button>
        <button class="judge-btn judge-ng" data-judge="0">✗ 言えなかった</button>
      </div>
    `;
  }

  return `
    <div class="q-head">
      <span>瞬間英作文 · ${state.idx + 1} / ${total}</span>
      <span class="streak">◯ ${state.score}</span>
    </div>
    <div class="q-progress"><div class="q-progress-fill" style="width: ${pct}%"></div></div>
    ${body}
    <button class="btn" id="homeBtn" style="margin-top: 16px;">ホームに戻る</button>
  `;
}

function renderSpeakResult() {
  const total = state.history.length;
  const pct = total ? Math.round(state.score / total * 100) : 0;
  const missed = state.history.filter(h => !h.ok);
  const newSettled = state.history.filter(h => h.justSettled).length;
  const st = getSpeakStats();

  let msg;
  if (pct === 100) msg = '全部言えた！すばらしい🎉';
  else if (pct >= 70) msg = 'いい調子！言えなかった文をもう一度';
  else msg = '言えなかった文を、声に出して3回くり返そう';

  const missedHTML = missed.length ? `
    <div class="review">
      <div class="review-h">言えなかった ${missed.length}文</div>
      ${missed.map(h => `
        <div class="review-item">
          <div><span class="review-mark">✗</span>${esc(h.ja)}</div>
          <div class="review-correct">${esc(h.en)}</div>
          ${h.note ? `<div class="review-correct" style="opacity:0.7;">${esc(h.note)}</div>` : ''}
        </div>
      `).join('')}
    </div>` : '';

  const okList = state.history.filter(h => h.ok);
  const okHTML = okList.length ? `
    <div class="review">
      <div class="review-h">言えた ${okList.length}文</div>
      ${okList.map(h => `
        <div class="review-item">
          <div><span class="review-mark">◯</span>${esc(h.ja)}${h.justSettled ? ' <span class="speak-tag hot">定着！</span>' : ''}</div>
          <div class="review-correct">${esc(h.en)}</div>
        </div>
      `).join('')}
    </div>` : '';

  const settledMsg = newSettled > 0 ? `<div class="score-msg" style="color:#C0DD97;font-weight:600;">🏆 新たに ${newSettled}文が定着しました！</div>` : '';

  return `
    <p style="text-align:center; font-size:14px; color:#a8a59c; margin:0;">おつかれさま</p>
    <div class="score-num">${state.score} / ${total}</div>
    <div class="score-msg">${msg}<br>定着 ${st.settled} / ${st.total}文（${st.pct}%）</div>
    ${settledMsg}
    ${missed.length ? `<button class="btn btn-primary" id="retryWrongBtn">言えなかった${missed.length}文をもう一度</button>` : ''}
    <div class="btn-row">
      <button class="btn ${missed.length ? '' : 'btn-primary'}" id="retryBtn">別の10文</button>
      <button class="btn" id="homeBtn">ホームに戻る</button>
    </div>
    ${missedHTML}
    ${okHTML}
  `;
}

function renderResult() {
  const total = state.questions.length;
  const pct = Math.round(state.score / total * 100);
  const newMasters = state.history.filter(h => h.justMastered).length;
  let msg;
  if (pct === 100) msg = 'パーフェクト！すばらしい！🎉';
  else if (pct >= 80) msg = 'よくできました！もう少しで満点だね';
  else if (pct >= 60) msg = 'いい調子！間違えた問題を見直そう';
  else msg = '解説を読んでじっくり復習しよう';
  
  const reviewHTML = state.history.map(h => `
    <div class="review-item">
      <div><span class="review-mark">${h.ok ? '✓' : '✗'}</span>${esc(h.q)}${h.justMastered ? ' <span class="q-mastery-tag">マスター達成！</span>' : ''}</div>
      ${!h.ok ? `<div class="review-correct">正解: ${esc(h.correct)}</div>` : ''}
    </div>
  `).join('');
  
  const masterMsg = newMasters > 0 ? `<div class="score-msg" style="color: #C0DD97; font-weight: 600;">🏆 新たに ${newMasters} 問マスター達成！</div>` : '';
  
  return `
    <p style="text-align:center; font-size:14px; color:#a8a59c; margin:0;">結果</p>
    <div class="score-num">${state.score} / ${total}</div>
    <div class="score-msg">${msg}<br>正答率 ${pct}%</div>
    ${masterMsg}
    <div class="btn-row">
      <button class="btn btn-primary" id="retryBtn">もう一度</button>
      <button class="btn" id="homeBtn">ホームに戻る</button>
    </div>
    <div class="review">
      <div class="review-h">問題を振り返る</div>
      ${reviewHTML}
    </div>
  `;
}

function attach() {
  document.querySelectorAll('[data-mode]').forEach(b => {
    if (b.disabled) return;
    b.onclick = () => startMode(b.dataset.mode);
  });
  document.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => pick(parseInt(b.dataset.pick));
  });
  document.querySelectorAll('[data-sec]').forEach(b => {
    b.onclick = () => togglePbSec(parseInt(b.dataset.sec));
  });
  const pbA = document.getElementById('pbAllBtn'); if (pbA) pbA.onclick = togglePbAll;
  const pbP = document.getElementById('pbPickBtn'); if (pbP) pbP.onclick = togglePbPick;
  document.querySelectorAll('[data-star]').forEach(b => {
    b.onclick = () => toggleStar(b.dataset.star);
  });
  const pbR = document.getElementById('pbResetBtn'); if (pbR) pbR.onclick = resetStars;
  const rvb = document.getElementById('revealBtn'); if (rvb) rvb.onclick = reveal;
  document.querySelectorAll('[data-judge]').forEach(b => {
    b.onclick = () => markSpeak(b.dataset.judge === '1');
  });
  const brN = document.getElementById('brNextBtn'); if (brN) brN.onclick = bridgeNext;
  document.querySelectorAll('[data-brjudge]').forEach(b => {
    b.onclick = () => markBridge(b.dataset.brjudge === '1');
  });
  const brRW = document.getElementById('brRetryWrongBtn');
  if (brRW) brRW.onclick = () => startBridge(state.history.filter(h => !h.ok)
    .map(h => ({ id: h.id, theme: '復習', raw: h.raw, simple: h.simple, en: h.en, note: h.note })));
  const rwb = document.getElementById('retryWrongBtn');
  if (rwb) rwb.onclick = () => startSpeak(state.history.filter(h => !h.ok).map(h => ({ id: h.id, ja: h.ja, en: h.en, note: h.note })));
  const nb = document.getElementById('nextBtn'); if (nb) nb.onclick = next;
  const hb = document.getElementById('homeBtn'); if (hb) hb.onclick = goHome;
  const rb = document.getElementById('retryBtn'); if (rb) rb.onclick = () => {
    const m = state.mode;
    const available = getAvailable(m);
    if (available.length === 0) { goHome(); return; }
    startMode(m);
  };
  const resetB = document.getElementById('resetBtn'); if (resetB) resetB.onclick = resetMastery;
  const syncB = document.getElementById('syncBtn'); if (syncB) syncB.onclick = openSync;
  const copyB = document.getElementById('copyBtn');
  if (copyB) copyB.onclick = () => {
    const ta = document.getElementById('exportArea');
    ta.select();
    ta.setSelectionRange(0, 99999);
    const done = () => { copyB.textContent = '✓ コピーしました！'; setTimeout(() => { copyB.textContent = '📋 コードをコピー'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done).catch(() => { try { document.execCommand('copy'); done(); } catch(e){} });
    } else {
      try { document.execCommand('copy'); done(); } catch(e){}
    }
  };
  const importB = document.getElementById('importBtn');
  if (importB) importB.onclick = () => {
    const ta = document.getElementById('importArea');
    if (!ta.value.trim()) { alert('コードを貼り付けてください。'); return; }
    applySyncCode(ta.value);
  };
  const importArea = document.getElementById('importArea');
  if (importArea) {
    // 貼り付けたら自動で読み込み確認（ボタンを押さなくてもOK）
    importArea.onpaste = () => {
      setTimeout(() => { if (importArea.value.trim()) applySyncCode(importArea.value); }, 120);
    };
  }
}

loadData();
render();
</script>
</body>
</html>
