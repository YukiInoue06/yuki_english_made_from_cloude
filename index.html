    { id: 'g135', q: '「筋肉痛（筋肉が痛む複数箇所）」を自然に言うと？', choices: ['a muscle soreness', 'sore muscles', 'muscle sore', 'a sore muscle pain'], correct: 1,
      explain: "sore muscles = 筋肉痛（sore は「ひりひり痛む」という形容詞）。'I have sore muscles.'（筋肉痛だ）。体のあちこちが痛むので muscles と複数形にするのが自然。'a muscle soreness' は不自然な言い方。" },
    { id: 'g136', q: '「（今）心配している」を自然に言うと？', choices: ["I'm worrying about it.", "I'm worried about it.", "I worry it.", "I'm worry about it."], correct: 1,
      explain: "worried は「心配している」という状態を表す形容詞。'I'm worried about the project.'（プロジェクトが心配だ）。I'm worrying（進行形）は「今まさに心配する動作をしている」となり不自然。気持ち・状態は be + worried で表す。" },
    { id: 'g137', q: '「スマホだけで」と only で強調するとき、only の正しい位置は？', choices: ['a game only a smartphone', 'a game using only a smartphone', 'a game using a only smartphone', 'only a game using smartphone'], correct: 1,
      explain: "only は「強調したい語の直前」に置く。スマホを強調するなら using only a smartphone（スマホだけを使って）。'I made a game using only a smartphone.'。only の位置で意味が変わるので、何を「〜だけ」と言いたいかを考えて置く。" },
    { id: 'g138', q: '「30分後に戻る」の「〜後に」（未来）はどっち？', choices: ["I'll be back after 30 minutes.", "I'll be back in 30 minutes.", "I'll be back on 30 minutes.", "I'll be back at 30 minutes later."], correct: 1,
      explain: "未来の「今から〜後に」は in を使う。'I'll be back in 30 minutes.'（30分後に戻る）。after は「過去の出来事の〜後」や「〜のあとで」に使うのが基本で、未来の時間差には in が自然。日本人が間違えやすい定番ポイント。" },
    { id: 'g139', q: '「〜に興味がある」の正しい前置詞は？', choices: ['interested for', 'interested in', 'interested to', 'interested at'], correct: 1,
      explain: "be interested in ~ = 〜に興味がある（決まった前置詞）。'I'm interested in the new game.'（その新作ゲームに興味がある）。in を落としたり to にしたりしやすいので注意。TOEICのPart 5でも狙われる前置詞コロケーション。" },
    { id: 'g140', q: '「Switchでゲームをした」の「〜で（ゲーム機）」の前置詞は？', choices: ['by the Switch', 'on the Switch', 'in the Switch', 'with by Switch'], correct: 1,
      explain: "ゲーム機・デバイス上で遊ぶ・見るは on を使う。'We played games on the Nintendo Switch.'（Switchでゲームをした）。on my phone（スマホで）、on PC（PCで）も同じ。by は交通手段（by car）に使う。" },
    { id: 'g141', q: '「新幹線に乗る」の正しい冠詞は？', choices: ['take Shinkansen', 'take the Shinkansen', 'take a Shinkansens', 'take that Shinkansen'], correct: 1,
      explain: "特定の交通機関・路線には the を付ける。'I'll take the Shinkansen early tomorrow.'（明日朝早く新幹線に乗る）。take the train / take the bus も同じ。冠詞の抜けはゆうきさんの反復ポイントなので、乗り物＝the とセットで覚える。" },
    { id: 'g142', q: '「明日の朝早く」の自然な語順は？', choices: ["tomorrow's early morning", 'early tomorrow morning', 'tomorrow early the morning', 'early in tomorrow morning'], correct: 1,
      explain: "early tomorrow morning = 明日の朝早く（決まった語順）。'I have to leave early tomorrow morning.'（明日の朝早く出発しないといけない）。'tomorrow's early morning' とは言わない。late tonight（今夜遅く）も同じパターン。" },
    { id: 'g143', q: '「私が作ったオートチェスゲーム」を自然に言うと？', choices: ['which I made the auto chess game', 'the auto chess game I made', 'the auto chess game which made I', 'I made that the auto chess game'], correct: 1,
      explain: "the + 名詞 + I + 過去動詞 = 私が〜した…（接触節）。'the auto chess game I made'（私が作ったオートチェスゲーム）。which を使わずに名詞の直後に I made を置くのが会話で一番自然。'the movie I watched'（私が観た映画）と同じ型。" },
    { id: 'g144', q: '「ポケモンイベントが開催される予定」を正しく言うと？', choices: ['A Pokémon event is going to hold', 'A Pokémon event is going to be held', 'A Pokémon event going to be hold', 'A Pokémon event will held'], correct: 1,
      explain: "イベントは「開催される」側なので受け身：be going to be held。'A Pokémon event is going to be held in Yokohama.'（横浜でポケモンイベントが開催される予定）。hold-held-held の変化と、be + 過去分詞の形に注意。" },
    { id: 'g145', q: '「（上司から）新しいタスクをもらった」を自然に言うと？', choices: ['I got to a new task', 'I was given a new task', 'I was got a new task', 'I gave a new task'], correct: 1,
      explain: "be given ~ = 〜を与えられる（受け身）。'I was given a new task at work.'（仕事で新しいタスクをもらった）。I got a new task も使えるが、「与えられた」ニュアンスをはっきり出すなら was given が自然。I gave だと「私があげた」で逆になる。" },
    { id: 'g146', q: '「早く寝る」の「早く」はどっち？', choices: ['go to bed quickly', 'go to bed early', 'go to bed fast', 'go to bed soon early'], correct: 1,
      explain: "early = （時刻が）早く。'I need to go to bed early tonight.'（今夜は早く寝ないと）。quickly は「（動作が）素早く」なので、'go to bed quickly' だと「急いで布団に入る」という変な意味に。時刻の早さは early、動作の速さは quickly。" },
    { id: 'g147', q: '「とても特別な場所」を名詞まで言うとき正しいのは？', choices: ['so special place', 'such a special place', 'so a special place', 'such special a place'], correct: 1,
      explain: "such a + 形容詞 + 名詞 = とても〜な…。'It was such a special place.'（とても特別な場所だった）。so は形容詞だけのとき（It was so special.）に使い、名詞まで続けるなら such a。後ろに名詞があるかどうかで使い分ける。" },
    { id: 'g148', q: '「昨日は激しく雨が降った」を自然に言うと？', choices: ['It was heavy rain yesterday.', 'It rained heavily yesterday.', 'It rained heavy yesterday.', 'It was rain heavily yesterday.'], correct: 1,
      explain: "動詞 rained を説明するのは副詞 heavily（激しく）。'It rained heavily yesterday.'。heavy（形容詞）を使うなら 'We had heavy rain.' と名詞 rain を説明する形にする。形容詞と副詞の使い分けは反復ポイント：動詞には -ly。" },
    { id: 'g149', q: '「友達に会うために駅へ行く」の「会うために」は？', choices: ['go to the station and meet', 'go to the station to meet', 'go to the station for meet', 'go to the station meeting'], correct: 1,
      explain: "to + 動詞の原形 = 〜するために（目的の不定詞）。'I'll go to Kurashiki Station to meet my friend.'（友達に会うために倉敷駅へ行く）。and meet だと「行って、それから会う」と2つの動作の羅列になり、目的のニュアンスが出ない。" },
    { id: 'g150', q: '「食べ物と飲み物を楽しんだ」の「食べ物」の正しい形は？', choices: ['some foods and drinks', 'some food and drinks', 'a food and drinks', 'some foods and drink'], correct: 1,
      explain: "food（食べ物）は数えられない名詞なので s を付けない：some food。'We had some food and drinks.'（食べ物と飲み物を楽しんだ）。foods は「食品の種類」を言うときだけ（Japanese foods = 日本の食品類）。drink は種類を数えられるので drinks でOK。" },
    { id: 'g151', q: '「お墓参りに行った（家族のお墓）」を正しく言うと？', choices: ['visited grave', "visited my family's grave", 'visited to the grave family', 'visited a grave of family'], correct: 1,
      explain: "名詞の前には冠詞や所有格が必要（ゆうきさんの反復ポイント）。'We visited my family's grave.'（家族のお墓参りに行った）。裸の grave だけでは使えない。誰のものか言える場合は my / my family's のような所有格を付けるのが自然。" },
    { id: 'g152', q: '「late」と「lately」の違いは？', choices: ['同じ意味で使える', 'late = 遅く、lately = 最近', 'late = 最近、lately = 遅く', 'late は名詞、lately は動詞'], correct: 1,
      explain: "late = 遅く、遅い（時間）。lately = 最近、このごろ。形が似ているが意味は別物。'I came home late.'（遅く帰った）vs 'I've been busy lately.'（最近忙しい）。-ly が付くと副詞になるのが普通だが、late は例外で late 自体が副詞。" },
    { id: 'g153', q: '「（もし〜なら）遅くなってしまう」と仮定の話をするとき正しいのは？', choices: ['it was late', 'it would be late', 'it is late', 'it will been late'], correct: 1,
      explain: "would = （もし〜なら）〜だろう（仮定・想像）。まだ起きていないことを想像するときは would を使う。'If I keep playing, it would be late.'（このまま続けたら遅くなってしまう）。was は「実際に起きた過去」なので仮定には合わない。" },
    { id: 'g154', q: '「家に帰る」で、今その家にいる場合に使うのは？', choices: ['go home', 'come home', 'go to home', 'come to home'], correct: 1,
      explain: "come = 話し手のいる場所へ向かう。今すでに家にいて「（普段）遅く帰る」と話すなら come home。外にいて「これから帰る」なら go home。どちらも home は副詞なので to は不要。方向による使い分けは反復ポイント。" },
    { id: 'g155', q: '「so」が続いて読みにくいとき、2つ目の強調語を何に変えると自然？', choices: ['very', 'really', 'too', 'much'], correct: 1,
      explain: "'so ~, so I'm so hungry' のように so が重なると読みにくい。2つ目を really に変えるとスッキリする：'I worked hard, so I'm really hungry.'。really は so とほぼ同じ強さで、会話でも自然によく使う。" },
    { id: 'g156', q: '「can」の未来形として正しいのは？', choices: ['will can', 'will be able to', 'will could', 'can will'], correct: 1,
      explain: "助動詞は2つ並べられないので will can とは言えない。can の未来は will be able to を使う。'We will be able to poll consumers.'（消費者に調査できるようになる）。現在は can、過去は was/were able to。丸暗記でOK。" },
    { id: 'g157', q: '「チームを率いることは大変だ」の動詞の形は？', choices: ['Heading the team are hard.', 'Heading the team is hard.', 'Heading the team were hard.', 'Head the team is hard.'], correct: 1,
      explain: "動名詞（~ing）が主語のときは、かたまり全体を「1つのもの」として単数扱いにする。'Heading the team is hard.'（チームを率いるのは大変だ）。team につられて are にしないよう注意。'Cooking dinner takes time.' も同じ。" },
    { id: 'g158', q: '「簡単だと思っていた」で正しいのは？', choices: ['I thought it will be easy.', 'I thought it would be easy.', 'I thought it is easy.', 'I think it would be easy.'], correct: 1,
      explain: "主節が過去（thought）なら、その中身も過去に合わせて will → would にする（時制の一致）。'I thought it would be easy.'（簡単だろうと思っていた）。今そう思っているなら 'I think it will be easy.'。" },
    { id: 'g159', q: '「仕事がたくさんある」の正しい形は？', choices: ['many works', 'a lot of work', 'a work', 'much works'], correct: 1,
      explain: "work（仕事）は数えられない名詞なので、works や a work にしない。量を言うなら a lot of work / much work。'It was more work than I expected.'（思ったより仕事が多かった）。同じく hard work（きつい仕事）も a は付けない。" },
    { id: 'g160', q: '「もし今日勝てなかったら、彼は怒るだろう」の if の中の動詞は？', choices: ["if we won't win today", "if we don't win today", "if we didn't win today", "if we not win today"], correct: 1,
      explain: "if節（もし〜なら）の中では、未来のことでも現在形を使う。'If we don't win today, he will be angry.'（今日勝てなかったら彼は怒るだろう）。if の中に will は入れない。時（when）の節も同じルール。" },
    { id: 'g161', q: '「do not」を短くするとき正しいのは？', choices: ['dont', "don't", 'do nt', "don't've"], correct: 1,
      explain: "短縮形にはアポストロフィ（'）が必要：do not → don't。省いた文字（o）の位置にアポストロフィを置くのがルール。同じく can not → can't、I am → I'm、it is → it's。書くときに忘れやすいポイント。" },
    { id: 'g162', q: '「3時に彼と会う予定です」— scheduled の後に動詞を続ける形は？', choices: ["I'm scheduled for meet him at three", "I'm scheduled to meet him at three", "I'm scheduled meeting him at three", "I'm scheduled for meeting him"], correct: 1,
      explain: "be scheduled for + 名詞 / be scheduled to + 動詞の原形。動詞を続けたいときは to を使う。'I'm scheduled to meet him at three.'（3時に彼と会う予定）／'I'm scheduled for a meeting.'（会議の予定がある）。前置詞 for の後ろは必ず名詞。" },
    { id: 'g163', q: '「オフィスの近くの公園で夏祭りがあった」— 正しい語順は？', choices: ['a summer festival near my office in the park', 'a summer festival in the park near my office', 'in the park a summer festival near my office', 'near my office a summer festival in the park'], correct: 1,
      explain: "場所は「小さい情報 → 大きい情報」の順に並べる。ここでは in the park（祭りの場所）→ near my office（その公園がどこか）。逆にすると「公園の中にあるオフィスの近く」と読めて誤解される。時間の語順（p101）と同じ考え方。" },
    { id: 'g164', q: '「私は6月にフィリピンに行きました」— 正しい前置詞は？', choices: ['I went to the Philippines on June.', 'I went to the Philippines in June.', 'I went to the Philippines at June.', 'I went to the Philippines to June.'], correct: 1,
      explain: '月には in を使います。in 2026 / in summer / in June。日にちが付くと on June 5th のように on に変わり、時刻なら at 9:30 です。「大きい入れ物ほど in、小さい点ほど at」と覚えましょう。' },
    { id: 'g165', q: '「6月5日に」を英語で言うと？', choices: ['in June 5th', 'on June 5th', 'at June 5th', 'of June 5th'], correct: 1,
      explain: '日付・曜日には on。on June 5th / on Monday。月だけなら in June、時刻なら at 9:30。「日にちが出てきたら on」と覚えてください。' },
    { id: 'g166', q: '「ホテルに泊まりたい」— 正しい前置詞は？', choices: ["I'd like to stay as a hotel.", "I'd like to stay at a hotel.", "I'd like to stay to a hotel.", "I'd like to stay with a hotel."], correct: 1,
      explain: "建物や施設には at を使います。at a hotel / at a hostel / at a campground。「地図上の一点」として場所を指すイメージです。" },
    { id: 'g167', q: '「クルーズ船に泊まりたい」— 正しい前置詞は？', choices: ["I'd like to stay in a cruise ship.", "I'd like to stay at a cruise ship.", "I'd like to stay on a cruise ship.", "I'd like to stay to a cruise ship."], correct: 2,
      explain: "船・電車・飛行機など大きな乗り物には on を使います。on a cruise ship / on a train / on a plane。「上に乗る」イメージです。ただし小さい車は in a car になります。" },
    { id: 'g168', q: '「アメリカに住みたい」— 正しい形は？', choices: ['I want to live America.', 'I want to live in America.', 'I want to live at America.', 'I want to live on America.'], correct: 1,
      explain: '国や都市など広い空間には in。live in America / live in Tokyo。live は前置詞なしでは使えないので注意してください。ホテルのような建物なら at a hotel です。' },
    { id: 'g169', q: '「フィリピン」を英語で正しく言うと？', choices: ['Philippines', 'the Philippines', 'a Philippines', 'the Philippine'], correct: 1,
      explain: 'the Philippines = フィリピン。たくさんの島が集まってできた国なので、複数形＋the になります。同じ仲間は the United States（アメリカ）、the Netherlands（オランダ）。"I went to the Philippines in June."' },
    { id: 'g170', q: '「ポーランドに友達がいます」— 自然な英語は？', choices: ['There is my friend in Poland.', 'I have a friend in Poland.', 'My friend is exist in Poland.', 'It has my friend in Poland.'], correct: 1,
      explain: 'there is は「初めて話題に出すモノ」に使う表現なので、my friend のように持ち主が決まっているものには使えません。「～がいる・～を持っている」は I have ～。⭕️ There is a park near my house.（家の近くに公園がある）' },
    { id: 'g171', q: '「そのイベントはワクワクするものだった」を正しく言うと？', choices: ['The event was excited.', 'The event was exciting.', 'The event was excite.', 'The event was excitement.'], correct: 1,
      explain: "-ing は「（周りを）〜させる」、-ed は「（自分が）〜させられた」。イベントは人をワクワクさせる側なので exciting。'The event was exciting.'（イベントはワクワクした）／'I was excited.'（私はワクワクした）。ゆうきさんの反復ポイント。" },
    { id: 'g172', q: '「まだ練習が必要かもしれない」の still の正しい位置は？', choices: ['I still may need to practice', 'I may still need to practice', 'I may need still to practice', 'Still I may need practice'], correct: 1,
      explain: "still（まだ）は助動詞（may / can / will）の後ろに置く。'I may still need to practice.'（まだ練習が必要かもしれない）。助動詞がない場合は動詞の前：'I still need to practice.'。語順のルールとして覚える。" },
    { id: 'g173', q: '「すばやく英文を作る練習」を正しく言うと？', choices: ['practice quick English sentences', 'practice making English sentences quickly', 'practice make English sentences quick', 'practice quickly English sentences'], correct: 1,
      explain: "「速い」のは文ではなく“作る動作”なので、動詞 making を副詞 quickly で説明する。'practice making English sentences quickly'（すばやく英文を作る練習）。'quick English sentences' だと「短い英文」という別の意味になる。" },
    { id: 'g174', q: '「プールに行く」の前置詞は？', choices: ['go in the pool', 'go to the pool', 'go on the pool', 'go at pool'], correct: 1,
      explain: "施設へ「行く」は go to the pool。その場所で活動しているなら at the pool（'We had fun at the pool.'）。in the pool は「水の中にいる」という意味になる。to（移動先）と at（滞在地点）の使い分けがポイント。" },
    { id: 'g175', q: '「毎日レッスンを復習する」の lesson の形は？', choices: ['review my lesson every day', 'review my lessons every day', 'review my lesson everyday', 'review a my lessons every day'], correct: 1,
      explain: "「毎日」復習するなら対象は複数回分のレッスンになるので複数形 lessons が自然。'I review my lessons every day.'。また every day（毎日・2語）と everyday（日常の・形容詞）は別物なので、2語で書く点にも注意。" },
    { id: 'g176', q: '「新しいのを買いたい」の正しい文は？', choices: ['I want to buy new one.', 'I want to buy a new one.', 'I want to buy the new one.', 'I want to buy new.'], correct: 1,
      explain: "one は数えられる名詞の代わりなので、必ず a / the などが必要。初めて話題に出す「新しいの」は a new one。'My phone is old, so I want to buy a new one.'（スマホが古いので新しいのを買いたい）。one を書いたら a を確認するクセをつける。" },
    { id: 'g177', q: '2つのうち色違いを選ぶとき「赤いのをください」は？', choices: ['Please give me red one.', 'Please give me a red one.', 'Please give me the red one.', 'Please give me red.'], correct: 2,
      explain: "目の前にあって「どれを指すか決まっている」場合は the one。'I like the red one.'（赤いのがいい）。まだ決まっていない「どれでもいい新しいの」なら a new one。the = 特定 / a = 不特定 の使い分け。" },
    { id: 'g178', q: '「先週コーヒーメーカーが壊れた」の自然な文は？', choices: ['My coffee maker was broken last week.', 'My coffee maker broke last week.', 'My coffee maker is broken last week.', 'My coffee maker breaks last week.'], correct: 1,
      explain: "「壊れた」という出来事（動作）は break の過去形 broke。'My coffee maker broke last week.'。was broken は「壊れていた」という状態や「（誰かに）壊された」という受け身なので、いつ壊れたかを言う文には合わない。状態を言うなら It is broken.（今壊れている）。" },
    { id: 'g179', q: '「彼らはそれを直せないかもしれない」の正しい文は？', choices: ['It may not be fixed.', 'They may not be able to fix it.', 'They may not can fix it.', 'It may not fix.'], correct: 1,
      explain: "「〜できないかもしれない」は may not be able to 〜。助動詞（may）と can は並べられないので、can の代わりに be able to を使う。'They may not be able to fix it, so I want to buy a new one.'（直せないかもしれないので新しいのを買いたい）。" },
    { id: 'g180', q: '「前置詞の使い方を学んだ」の正しい文は？', choices: ['I learned how to use preposition.', 'I learned how to use prepositions.', 'I learned how to use the preposition.', 'I learned how to use a prepositions.'], correct: 1,
      explain: "「〜というもの全般」を指すときは数えられる名詞を複数形にする。'I learned how to use prepositions.'（前置詞の使い方を学んだ）。同じく 'I like dogs.'（犬が好き）も複数形。単数のまま preposition と書くと冠詞が抜けた不自然な形になる。" },
    { id: 'g181', q: '「明後日もこのトピックをもう一度勉強する」の自然な文は？', choices: ['I will take this topic again.', 'I will study this topic again.', 'I will get this topic again.', 'I will do this topic again.'], correct: 1,
      explain: "take は lesson / class / test など「受けるもの」に使う（take a lesson）。topic（話題）は受けるものではないので study を使う。レッスンの話なら 'I will take a lesson on this topic again.'（このトピックのレッスンをもう一度受ける）が自然。" },
    { id: 'g182', q: '「カスタマーサポートに電話した」の正しい文は？', choices: ['I called to customer support.', 'I called the customer support.', 'I called customer support.', 'I called for customer support.'], correct: 2,
      explain: "call は「〜に電話する」で、後ろに前置詞は要らない（call him / call the shop）。また customer support はサービス名として冠詞なしで使う。'I called customer support this morning.'（今朝カスタマーサポートに電話した）。customer service も同じように使える。" },
    { id: 'g183', q: '「新しい靴を買った」の正しい文は？', choices: ['I bought a new shoes.', 'I bought new shoes.', 'I bought a new shoe.', 'I bought new a shoes.'], correct: 1,
      explain: "a は単数の名詞にしか付けられない。shoes は複数形なので a は付かない。'I bought new shoes.'（新しい靴を買った）。靴は左右セットなので普通は複数形で使う。'a new shoe' だと片方だけになってしまう。" },
    { id: 'g184', q: 'This shop sells ------- vegetables.（この店は新鮮な野菜を売っている）', choices: ['a fresh', 'fresh', 'a freshes', 'a the fresh'], correct: 1,
      explain: "vegetables は複数形なので a は付けられない。「〜というもの全般」を言うときは冠詞なしの複数形にする。'This shop sells fresh vegetables.'。1つだけなら 'a fresh vegetable' と単数にする。" },
    { id: 'g185', q: '次のうち、文法的に間違っているのはどれ？', choices: ['He has a big dog.', 'He has big dogs.', 'He has a big dogs.', 'He has two big dogs.'], correct: 2,
      explain: "'a big dogs' は a（単数）と dogs（複数）が矛盾している。正しくは 'a big dog'（1匹）か 'big dogs'（複数）。数をはっきり言いたいときは 'two big dogs' のように数詞を使う。a + 形容詞 + 複数名詞 の形は作れない。" }
  ],
  toeic: [
    { id: 't01', q: 'The manager asked all employees to submit their reports ------- Friday.', choices: ['by', 'until', 'on at', 'to'], correct: 0,
      explain: "正解: by。「金曜日までに提出する」＝〆切は by（〜までに完了）。until は「〜までずっと（継続）」なので submit（一回の動作）とは合わない。日記でも出てきた by midnight と同じルール。訳：部長は全社員に金曜までに報告書を提出するよう求めた。" },
    { id: 't02', q: 'The new software update will ------- improve the system performance.', choices: ['significant', 'significantly', 'significance', 'signify'], correct: 1,
      explain: "正解: significantly（副詞）。動詞 improve を修飾するのは副詞。-ly が付くのが副詞の目印。significant（形容詞）は名詞を修飾、significance は名詞（重要性）。品詞問題は空所の前後を見る：will ___ improve → 動詞の間に入るのは副詞。訳：新しいアップデートはシステム性能を大幅に改善する。" },
    { id: 't03', q: 'Ms. Tanaka has worked at the company ------- 2018.', choices: ['for', 'since', 'from', 'during'], correct: 1,
      explain: "正解: since。現在完了（has worked）+ 起点（2018年から今まで）は since。for は期間の長さ（for six years）に使う。since + 起点 / for + 期間 のセットで覚える。訳：田中さんは2018年からその会社で働いている。" },
    { id: 't04', q: 'Please review the attached document ------- you sign the contract.', choices: ['before', 'during', 'until when', 'soon'], correct: 0,
      explain: "正解: before。「契約にサインする前に書類を確認してください」。before + 文（you sign ~）で「〜する前に」。during は後ろに名詞のみ（during the meeting）。接続詞と前置詞の使い分けはPart 5頻出。訳：契約書にサインする前に添付書類をご確認ください。" },
    { id: 't05', q: 'The company offers a ------- range of training programs for new employees.', choices: ['wide', 'widely', 'width', 'widen'], correct: 0,
      explain: "正解: wide（形容詞）。名詞 range を修飾するのは形容詞。a wide range of ~（幅広い〜）はTOEIC超頻出の決まり文句。widely は副詞、width は名詞（幅）、widen は動詞（広げる）。訳：その会社は新入社員向けに幅広い研修プログラムを提供している。" },
    { id: 't06', q: 'All visitors ------- wear an ID badge while in the building.', choices: ['must', 'must to', 'have', 'should to'], correct: 0,
      explain: "正解: must。助動詞 must のあとは動詞の原形（must wear）。must to や should to のように to は付けない。have なら have to wear の形が必要。訳：来館者は皆、建物内ではIDバッジを着用しなければならない。" },
    { id: 't07', q: 'The seminar was ------- because of the typhoon.', choices: ['postponed', 'postpone', 'postponing', 'postponement'], correct: 0,
      explain: "正解: postponed。was + 過去分詞で受け身（延期された）。postpone = 延期する（TOEIC頻出単語）。セミナーは「延期される」側なので受け身。訳：台風のためセミナーは延期された。" },
    { id: 't08', q: 'Employees can ------- the fitness center free of charge.', choices: ['access', 'accessed', 'accessing', 'accessible'], correct: 0,
      explain: "正解: access（動詞の原形）。助動詞 can のあとは原形。access = 利用する、アクセスする（動詞）。accessible は形容詞（利用しやすい）。free of charge = 無料で（頻出表現）。訳：従業員はフィットネスセンターを無料で利用できる。" },
    { id: 't09', q: 'The quarterly report is due ------- the end of this month.', choices: ['at', 'in', 'on', 'to'], correct: 0,
      explain: "正解: at。at the end of ~ = 〜の終わりに（決まった言い方）。due = 提出期限である（TOEIC頻出）。in the end は「結局」という別の意味になるので注意。訳：四半期報告書の提出期限は今月末だ。" },
    { id: 't10', q: 'Mr. Chen is responsible ------- managing the sales team.', choices: ['for', 'of', 'to', 'with'], correct: 0,
      explain: "正解: for。be responsible for ~ = 〜の担当である、〜に責任がある（決まった前置詞）。前置詞 for のあとなので managing と動名詞になっている点もポイント。訳：チェンさんは営業チームの管理を担当している。" },
    { id: 't11', q: 'The hotel is conveniently ------- near the airport.', choices: ['located', 'locating', 'location', 'locate'], correct: 0,
      explain: "正解: located。be located = 位置している（受け身の形で「〜にある」）。建物や店の場所を言うときの定番。conveniently located = 便利な場所にある（TOEIC頻出コンビ）。訳：そのホテルは空港近くの便利な場所にある。" },
    { id: 't12', q: '------- the heavy rain, the outdoor event was held as scheduled.', choices: ['Despite', 'Although', 'Because', 'However'], correct: 0,
      explain: "正解: Despite。despite + 名詞 = 〜にもかかわらず。後ろが the heavy rain（名詞）なので前置詞の despite。although は接続詞なので後ろに文（主語+動詞）が必要。この見分けはPart 5最頻出。訳：大雨にもかかわらず、屋外イベントは予定通り開催された。" },
    { id: 't13', q: 'Please contact the HR department if you have any ------- about the new policy.', choices: ['questions', 'question', 'questioning', 'questioned'], correct: 0,
      explain: "正解: questions。any のあとの可算名詞は複数形が自然（any questions）。'If you have any questions' = 質問があれば（ビジネス定番フレーズ）。メールや案内文で必ず出てくる形。訳：新方針についてご質問があれば人事部までご連絡ください。" },
    { id: 't14', q: 'The store will remain ------- until 10 p.m. during the holiday season.', choices: ['open', 'openly', 'opening', 'opened'], correct: 0,
      explain: "正解: open。remain + 形容詞 = 〜のままである。open はここでは形容詞（開いている）。remain open = 開いたままである。動詞の opened にすると意味が通らない。訳：ホリデーシーズン中、その店は午後10時まで営業している。" },
    { id: 't15', q: 'Ms. Lopez will attend the conference ------- of the director.', choices: ['instead', 'in place', 'rather', 'in behalf'], correct: 0,
      explain: "正解: instead。instead of ~ = 〜の代わりに。in place なら in place of、正しくは on behalf of（〜を代表して）なので in behalf は誤り。空所の直後の of とつながるのは instead。訳：ロペスさんが部長の代わりに会議に出席する。" },
    { id: 't16', q: 'The marketing team made a ------- decision to launch the product early.', choices: ['strategy', 'strategic', 'strategically', 'strategize'], correct: 1,
      explain: "正解: strategic（形容詞）。名詞 decision を修飾するのは形容詞。a ___ decision の形は「冠詞+空所+名詞」の典型的な品詞問題で、形容詞が入る。strategy は名詞、strategically は副詞、strategize は動詞。訳：マーケティングチームは製品を早期発売する戦略的な決断をした。" },
    { id: 't17', q: 'Applicants must submit their resumes ------- e-mail by the end of the week.', choices: ['via', 'on', 'at', 'with by'], correct: 0,
      explain: "正解: via。via = 〜経由で、〜を使って（手段）。submit via e-mail（メールで提出する）はTOEIC超頻出。by e-mail も同じ意味で使える。訳：応募者は今週末までにメールで履歴書を提出しなければならない。" },
    { id: 't18', q: 'The CEO spoke ------- about the future plans of the company.', choices: ['confident', 'confidently', 'confidence', 'confide'], correct: 1,
      explain: "正解: confidently（副詞）。動詞 spoke を修飾するのは副詞。「どのように話したか」を表すのは -ly の副詞。confident は形容詞、confidence は名詞（自信）。訳：CEOは会社の将来計画について自信を持って語った。" },
    { id: 't19', q: '------- you have any questions, please do not hesitate to contact us.', choices: ['Should', 'Would', 'Could', 'Might'], correct: 0,
      explain: "正解: Should。Should you have ~ = If you should have ~ の if 省略・倒置形（もし〜があれば）。ビジネスメールの定番表現で、Part 5でもよく出る。'Should you have any questions' をひとかたまりで覚える。訳：ご質問があれば、遠慮なくご連絡ください。" },
    { id: 't20', q: 'Profits at the company have increased ------- over the past three years.', choices: ['steady', 'steadily', 'steadiness', 'steadied'], correct: 1,
      explain: "正解: steadily（副詞）。動詞 have increased を修飾するのは副詞。increase steadily（着実に増加する）は頻出コロケーション。steady は形容詞。over the past ~ years（過去〜年間で）は現在完了と相性が良い。訳：会社の利益は過去3年間で着実に増加した。" },
    { id: 't21', q: 'Neither the manager ------- the staff members were informed of the change.', choices: ['or', 'nor', 'and', 'but'], correct: 1,
      explain: "正解: nor。neither A nor B = AもBも〜ない（セットで使う相関接続詞）。either A or B（AかBか）との対で覚える。Part 5では neither を見たら nor を探す。訳：部長もスタッフもその変更を知らされていなかった。" },
    { id: 't22', q: 'The new employee handbook is ------- available on the company website.', choices: ['now', 'yet', 'ever', 'once'], correct: 0,
      explain: "正解: now。is now available = 現在入手可能です（お知らせの定番表現）。yet は否定文・疑問文で使うのが基本。available（利用できる）はTOEIC最頻出級の単語。訳：新しい従業員ハンドブックは現在、会社のウェブサイトで閲覧できます。" },
    { id: 't23', q: 'Ms. Park reviewed the proposal ------- before submitting it to the board.', choices: ['careful', 'carefully', 'carefulness', 'caring'], correct: 1,
      explain: "正解: carefully（副詞）。動詞 reviewed を修飾するのは副詞。review carefully（入念に確認する）。before + ~ing（〜する前に）の形も要チェック。訳：パクさんは役員会に提出する前に提案書を入念に確認した。" },
    { id: 't24', q: 'All orders placed before noon will be shipped ------- the same day.', choices: ['on', 'in', 'at', 'to'], correct: 0,
      explain: "正解: on。on the same day = 同じ日に（特定の日には on）。日・曜日・日付には on を使う基本ルール。orders placed（受けた注文）の過去分詞修飾もPart 5頻出の形。訳：正午までのご注文は当日発送されます。" },
    { id: 't25', q: 'The workshop will help participants ------- their presentation skills.', choices: ['improve', 'improving', 'improved', 'improvement'], correct: 0,
      explain: "正解: improve。help + 人 + 動詞の原形 = 人が〜するのを助ける。help participants improve（参加者が向上させるのを助ける）。help のあとの動詞は原形が基本。訳：そのワークショップは参加者のプレゼンスキル向上に役立つ。" },
    { id: 't26', q: '------- of the two candidates has the required experience for the position.', choices: ['Neither', 'None', 'Both', 'Every'], correct: 0,
      explain: "正解: Neither。Neither of the two ~ = 2つ（2人）のどちらも〜ない。「2つ」なら neither、「3つ以上」なら none を使う。has（単数）と数が一致している点もヒント（Both なら have が必要）。訳：2人の候補者のどちらも、その職に必要な経験を持っていない。" },
    { id: 't27', q: 'The finance department is located ------- the third floor of the main building.', choices: ['on', 'in', 'at', 'over'], correct: 0,
      explain: "正解: on。on the ___ floor = 〜階に（階には on を使う）。'on the third floor'（3階に）。建物の中は in the building、階は on the floor と使い分ける。訳：財務部は本館の3階にある。" },
    { id: 't28', q: 'Employees are encouraged ------- the training session next month.', choices: ['attend', 'to attend', 'attending', 'attended'], correct: 1,
      explain: "正解: to attend。be encouraged to + 動詞 = 〜するよう奨励される。encourage 人 to do の受け身形。attend = 出席する（他動詞なので attend the session と直接つなぐ）。訳：従業員は来月の研修への参加を推奨されている。" },
    { id: 't29', q: 'The restaurant offers a special discount ------- customers who visit on weekdays.', choices: ['to', 'at', 'in', 'of'], correct: 0,
      explain: "正解: to。offer A to B = BにAを提供する。discount to customers（客への割引）。offer は offer 人 物 の形も取れる（offer customers a discount）。訳：そのレストランは平日に来店する客に特別割引を提供している。" },
    { id: 't30', q: 'Due to the system maintenance, the online service will be ------- unavailable.', choices: ['temporary', 'temporarily', 'temporariness', 'temporal'], correct: 1,
      explain: "正解: temporarily（副詞）。形容詞 unavailable を修飾するのは副詞。temporarily unavailable = 一時的に利用不可（メンテナンス告知の定番）。due to + 名詞 = 〜のため（原因）も頻出。訳：システムメンテナンスのため、オンラインサービスは一時的にご利用いただけません。" },
    { id: 't31', q: 'Please ------- that all windows are closed before leaving the office.', choices: ['ensure', 'insure', 'assure', 'unsure'], correct: 0,
      explain: "正解: ensure。ensure that ~ = 〜を確実にする、確認する。insure は「保険をかける」、assure は「（人を）安心させる」（assure 人 that ~）。3つの使い分けはPart 5頻出。訳：退社前にすべての窓が閉まっていることを確認してください。" },
    { id: 't32', q: 'The conference has been ------- until further notice.', choices: ['expanded', 'postponed', 'appointed', 'reminded'], correct: 1,
      explain: "正解: postponed。postpone = 延期する。until further notice = 追って通知があるまで（お知らせの決まり文句）。expand は「拡大する」、appoint は「任命する」、remind は「思い出させる」。訳：会議は追って通知があるまで延期された。" },
    { id: 't33', q: 'Ms. Rivera was promoted to senior manager in ------- of her excellent performance.', choices: ['recognition', 'reputation', 'recommendation', 'realization'], correct: 0,
      explain: "正解: recognition。in recognition of ~ = 〜を評価して、〜が認められて（表彰・昇進の定番表現）。be promoted to ~ = 〜に昇進する もセットで頻出。訳：リベラさんは優れた業績が認められて上級マネージャーに昇進した。" },
    { id: 't34', q: 'The two companies will ------- to develop a new mobile application.', choices: ['collaborate', 'collaboration', 'collaborative', 'collaboratively'], correct: 0,
      explain: "正解: collaborate（動詞）。will のあとは動詞の原形。collaborate to do = 協力して〜する。collaboration は名詞、collaborative は形容詞。助動詞の後ろ＝原形、は品詞問題の基本パターン。訳：両社は新しいモバイルアプリを共同開発する。" },
    { id: 't35', q: 'Attendance at the safety training is ------- for all warehouse staff.', choices: ['mandatory', 'voluntary optional', 'tentative', 'preliminary'], correct: 0,
      explain: "正解: mandatory。mandatory = 必須の、義務的な（TOEIC頻出単語）。'is mandatory for ~' = 〜にとって必須である。反対語は optional（任意の）。tentative は「仮の」、preliminary は「予備の」。訳：安全研修への出席は倉庫スタッフ全員に必須である。" },
    { id: 't36', q: 'The invoice must be paid within 30 days of ------- .', choices: ['receipt', 'reception', 'receiver', 'receiving it then'], correct: 0,
      explain: "正解: receipt。within 30 days of receipt = 受領後30日以内に（請求書の定番表現）。receipt はここでは「受け取ること（受領）」の意味。reception は「歓迎会・受付」。訳：請求書は受領後30日以内に支払われなければならない。" },
    { id: 't37', q: 'Sales figures for the last quarter were ------- higher than expected.', choices: ['considerably', 'considerable', 'considerate', 'consideration'], correct: 0,
      explain: "正解: considerably（副詞）。比較級 higher を修飾するのは副詞。considerably higher = かなり高い。considerable は形容詞（かなりの）、considerate は「思いやりのある」で意味が別。比較級の強調は much / far / considerably。訳：前四半期の売上高は予想よりかなり高かった。" },
    { id: 't38', q: 'Customers who are not satisfied with the product may request a full ------- .', choices: ['refund', 'discount', 'receipt', 'purchase'], correct: 0,
      explain: "正解: refund。a full refund = 全額返金。request a refund（返金を求める）はTOEIC定番シーン。discount は「割引」なので「満足しなかった場合」の文脈に合わない。訳：製品にご満足いただけないお客様は全額返金を請求できます。" },
    { id: 't39', q: 'The board meeting has been rescheduled ------- next Tuesday.', choices: ['for', 'in', 'at', 'until on'], correct: 0,
      explain: "正解: for。reschedule A for B = AをBに変更する（変更後の新しい日時は for で示す）。be rescheduled for next Tuesday = 来週火曜に変更された。訳：役員会議は来週火曜日に変更された。" },
    { id: 't40', q: '------- arriving at the hotel, guests should check in at the front desk.', choices: ['Upon', 'During', 'While', 'Among'], correct: 0,
      explain: "正解: Upon。upon ~ing = 〜するとすぐに（= on ~ing のフォーマル版）。'Upon arriving'（到着したらすぐに）。while は接続詞なので後ろに文が必要。案内文の定番表現。訳：ホテル到着後、お客様はフロントでチェックインしてください。" },
    { id: 't41', q: 'The company is seeking a ------- candidate for the accounting position.', choices: ['qualified', 'qualify', 'qualification', 'qualifies'], correct: 0,
      explain: "正解: qualified（過去分詞の形容詞用法）。a qualified candidate = 資格のある（適任の）候補者。求人広告の定番。名詞 candidate を修飾するのは形容詞的な語。seek = 探し求める もTOEIC頻出。訳：その会社は経理職の適任者を探している。" },
    { id: 't42', q: 'Construction of the new office building is ------- to be completed by December.', choices: ['expected', 'expecting', 'expectation', 'expect'], correct: 0,
      explain: "正解: expected。be expected to do = 〜する見込みである。'is expected to be completed'（完成する見込み）。工事・計画の記事で頻出。受け身+to不定詞の形をかたまりで覚える。訳：新オフィスビルの建設は12月までに完了する見込みだ。" },
    { id: 't43', q: 'Employees may park in the company lot ------- they display a valid permit.', choices: ['provided that', 'in spite of', 'because of', 'according to'], correct: 0,
      explain: "正解: provided that。provided that ~ = 〜という条件で、〜ならば（if のフォーマル版）。後ろに文（they display ~）が来るので接続詞が必要。in spite of / because of / according to はすべて前置詞で後ろは名詞のみ。訳：有効な許可証を提示すれば、従業員は会社の駐車場を利用できる。" },
    { id: 't44', q: 'The seminar will focus ------- effective time management techniques.', choices: ['on', 'to', 'at', 'for'], correct: 0,
      explain: "正解: on。focus on ~ = 〜に焦点を当てる（決まった前置詞）。'The seminar will focus on ~'（セミナーは〜に焦点を当てる）。動詞と前置詞のセット（コロケーション）はPart 5の定番。訳：セミナーは効果的な時間管理術に焦点を当てる。" },
    { id: 't45', q: 'Please keep your receipt ------- you need to exchange the item.', choices: ['in case', 'so that', 'even though', 'as long'], correct: 0,
      explain: "正解: in case。in case ~ = 〜する場合に備えて。'Keep your receipt in case you need to exchange it.'（交換が必要な場合に備えてレシートを保管してください）。so that は「〜するために（目的）」、as long なら as long as が正しい形。訳：商品の交換が必要な場合に備えてレシートを保管してください。" },
    { id: 't46', q: 'Ticket prices will remain ------- throughout the holiday season.', choices: ['stable', 'stably', 'stability', 'stabilize'], correct: 0,
      explain: "正解: stable（形容詞）。remain + 形容詞 = 〜のままである。remain stable（安定したまま）。t14の remain open と同じパターン：remain の後ろは形容詞！ stay / keep も同じく形容詞を取る。訳：チケット価格はホリデーシーズン中、据え置きのままです。" },
    { id: 't47', q: 'The museum will stay ------- until 9 p.m. on Fridays.', choices: ['open', 'opening', 'openness', 'to open'], correct: 0,
      explain: "正解: open（形容詞）。stay + 形容詞 = 〜のままでいる。stay open（開いたまま）。remain open と同じく、stay の後ろも形容詞。「開店している」の open は形容詞と覚える。訳：その美術館は金曜は午後9時まで開館している。" },
    { id: 't48', q: 'The success of the project depends ------- careful planning.', choices: ['on', 'in', 'at', 'to'], correct: 0,
      explain: "正解: on。depend on ~ = 〜次第である、〜に頼る（決まった前置詞）。responsible for、focus on、interested in と同じく、動詞・形容詞と前置詞のセットで丸暗記するのが最短。訳：プロジェクトの成功は入念な計画にかかっている。" },
    { id: 't49', q: 'The construction project is currently ------- schedule.', choices: ['on', 'in', 'at', 'by'], correct: 0,
      explain: "正解: on。on schedule = 予定通りに（決まった言い方）。ahead of schedule（予定より早く）、behind schedule（予定より遅れて）もセットで頻出。on time（時間通り）も同じ on の仲間。訳：建設プロジェクトは現在、予定通り進んでいる。" },
    { id: 't50', q: '------- of the bad weather, the flight departed on time.', choices: ['In spite', 'Despite', 'Although', 'Even'], correct: 0,
      explain: "正解: In spite。in spite of ~ = 〜にもかかわらず（despite と同じ意味）。空所の直後に of があるのがヒント：despite は of を取らない（Despite the weather）ので、___ of の形なら In spite。t12の Despite とセットで覚える。訳：悪天候にもかかわらず、便は定刻に出発した。" },
    { id: 't51', q: 'The manager ------- the clients that the issue would be resolved quickly.', choices: ['assured', 'ensured', 'insured', 'secured'], correct: 0,
      explain: "正解: assured。assure 人 that ~ = 人に〜だと保証する・安心させる（後ろに「人」が来るのがassure）。ensure は ensure that ~（物事を確実にする）で人を目的語に取らない。t31の ensure との使い分け：人なら assure、事なら ensure。訳：部長は顧客に、問題はすぐ解決されると保証した。" },
    { id: 't52', q: 'Employees may choose ------- the morning session or the afternoon session.', choices: ['either', 'neither', 'both', 'whether'], correct: 0,
      explain: "正解: either。either A or B = AかBのどちらか（or とセット）。文中に or があるので either を選ぶ。neither なら nor、both なら and とペアになる。相関接続詞はペアで即答できるようにする。訳：従業員は午前の回か午後の回のどちらかを選べる。" },
    { id: 't53', q: 'The new policy applies to ------- full-time and part-time employees.', choices: ['both', 'either', 'neither', 'not only'], correct: 0,
      explain: "正解: both。both A and B = AもBも両方（and とセット）。文中の and がヒント。not only なら but also が必要。t21・t26で学んだ neither/nor と合わせ、or→either、and→both、nor→neither の3ペアで整理。訳：新方針は正社員とパート従業員の両方に適用される。" },
    { id: 't54', q: 'The seminar was ------- informative but also enjoyable.', choices: ['not only', 'either', 'neither', 'both'], correct: 0,
      explain: "正解: not only。not only A but also B = AだけでなくBも。文中の but also がヒント。相関接続詞の4大ペア（either-or / neither-nor / both-and / not only-but also）はPart 5の定番。訳：セミナーは有益なだけでなく楽しくもあった。" },
    { id: 't55', q: 'All applications must be submitted ------- five business days.', choices: ['within', 'until', 'by the', 'during on'], correct: 0,
      explain: "正解: within。within + 期間 = 〜以内に。'within five business days'（5営業日以内に）。t36の within 30 days of receipt と同じパターン。by は「期限の時点」（by Friday）、within は「期間の幅」に使う。訳：すべての申請は5営業日以内に提出しなければならない。" },
    { id: 't56', q: 'Please turn off your mobile phones ------- the performance.', choices: ['during', 'while', 'when', 'as long'], correct: 0,
      explain: "正解: during。during + 名詞 = 〜の間に。後ろが the performance（名詞）なので前置詞の during。while は接続詞なので後ろに文（主語+動詞）が必要。t12・t43と同じ「前置詞 vs 接続詞」の見分けパターン。訳：公演中は携帯電話の電源をお切りください。" },
    { id: 't57', q: 'The event was canceled ------- the approaching typhoon.', choices: ['due to', 'because', 'since that', 'as though'], correct: 0,
      explain: "正解: due to。due to + 名詞 = 〜のために（原因）。後ろが名詞（the approaching typhoon）なので前置詞句の due to。because は接続詞で後ろに文が必要（because of なら名詞OK）。訳：接近中の台風のため、イベントは中止された。" },
    { id: 't58', q: 'More than 200 people ------- in the annual charity run last weekend.', choices: ['participated', 'attended', 'joined to', 'entered on'], correct: 0,
      explain: "正解: participated。participate in ~ = 〜に参加する（in とセット）。attend は前置詞なしで attend the event と直接つなぐので、in がある空所には participated が正解。join も前置詞なし（join the run）。訳：先週末、200人以上が毎年恒例のチャリティーランに参加した。" },
    { id: 't59', q: 'Registration for the workshop is available ------- no additional cost.', choices: ['at', 'in', 'for', 'with on'], correct: 0,
      explain: "正解: at。at no additional cost = 追加料金なしで（決まった言い方）。at no cost / at no charge（無料で）も同じ at の仲間。価格・費用の表現には at を使う（at a low price など）。訳：ワークショップへの登録は追加料金なしで可能です。" },
    { id: 't60', q: 'The store is conveniently located ------- walking distance of the station.', choices: ['within', 'in front', 'next', 'near to'], correct: 0,
      explain: "正解: within。within walking distance of ~ = 〜から徒歩圏内に（決まった言い方）。t11の conveniently located とセットで、不動産・店舗紹介の定番表現。訳：その店は駅から徒歩圏内の便利な場所にある。" },
    { id: 't61', q: 'Please keep the conference room ------- after your meeting.', choices: ['clean', 'cleanly', 'cleaning', 'cleaned up it'], correct: 0,
      explain: "正解: clean（形容詞）。keep + 目的語 + 形容詞 = 〜を…の状態に保つ。keep the room clean（部屋をきれいに保つ）。remain / stay / keep はどれも後ろに形容詞を取る仲間（t14・t46・t47の remain open / stable / stay open と同じファミリー）。訳：会議後は会議室をきれいにしておいてください。" },
    { id: 't62', q: '------- the heavy traffic, the delivery truck arrived on time.', choices: ['Despite', 'In spite', 'Although', 'Because'], correct: 0,
      explain: "正解: Despite。despite + 名詞（of は不要！）。in spite は of が必須（in spite of）なので、空所直後に of が無いこの文では使えない。t50（In spite of）との判別ポイント：of があれば In spite、無ければ Despite。訳：渋滞にもかかわらず、配送トラックは時間通りに到着した。" },
    { id: 't63', q: 'Hotel guests can enjoy breakfast ------- no extra charge.', choices: ['at', 'in', 'for', 'with'], correct: 0,
      explain: "正解: at。at no extra charge = 追加料金なしで。t59の at no additional cost と同じパターン：費用・価格の表現は at（at a low price / at no cost）。2回間違えている形なので、「無料系は at」で丸ごと覚える。訳：宿泊客は追加料金なしで朝食を楽しめる。" },
    { id: 't64', q: 'The human resources office is ------- the fifth floor.', choices: ['on', 'in', 'at', 'over'], correct: 0,
      explain: "正解: on。on the ___ floor = 〜階に。t27（located on the third floor）と同じ：階は必ず on。「建物の中」なら in the building、「階」なら on the floor。2回間違えたパターンの再演なので、ここで定着させる。訳：人事部は5階にある。" },
    { id: 't65', q: 'Before leaving, please ------- that all computers are turned off.', choices: ['ensure', 'assure', 'insure', 'reassure that'], correct: 0,
      explain: "正解: ensure。ensure that ~ = （物事）を確実にする。後ろが that節（人ではない）なので ensure。assure は assure 人 that ~ と「人」が必要（t51）。人なら assure、事なら ensure、保険なら insure の3点セットで整理。訳：退出前に、すべてのPCの電源が切れていることを確認してください。" },
    { id: 't66', q: 'All salary information must remain ------- at all times.', choices: ['confidential', 'confidentially', 'confidence', 'confide'], correct: 0,
      explain: "正解: confidential（形容詞）。remain + 形容詞 = 〜のままである。remain confidential（機密のままである）。t14 remain open / t46 remain stable と同じ形で、ここが一番間違えているパターン。「remain の後ろに -ly は入らない」と覚える。訳：給与情報は常に機密のままでなければならない。" },
    { id: 't67', q: 'To stay ------- in the global market, the company invests in new technology.', choices: ['competitive', 'competitively', 'competition', 'compete'], correct: 0,
      explain: "正解: competitive（形容詞）。stay + 形容詞 = 〜のままでいる。stay competitive（競争力を保つ）はビジネス文の定番。t47 stay open と同じ形。remain / stay / keep / become はどれも後ろが形容詞。訳：世界市場で競争力を保つため、その会社は新技術に投資している。" },
    { id: 't68', q: 'Please keep the emergency exits ------- at all times.', choices: ['clear', 'clearly', 'clearance', 'clearing'], correct: 0,
      explain: "正解: clear（形容詞）。keep + 目的語 + 形容詞 = 〜を…の状態に保つ。keep the exits clear（非常口をふさがないでおく）。t61 keep the room clean と同じ形で、目的語のあとに来るのは副詞ではなく形容詞。訳：非常口は常に物を置かないようにしてください。" },
    { id: 't69', q: 'Gift wrapping is available ------- no additional charge.', choices: ['at', 'in', 'for', 'by'], correct: 0,
      explain: "正解: at。at no additional charge = 追加料金なしで。t59 at no additional cost / t63 at no extra charge と同じ「無料系は at」。at a low price / at no cost もこの仲間で、費用・価格には at を使う。訳：ギフト包装は追加料金なしでご利用いただけます。" },
    { id: 't70', q: 'The sales director ------- the client that the shipment would arrive on Monday.', choices: ['assured', 'ensured', 'insured', 'assumed'], correct: 0,
      explain: "正解: assured。空所の直後が the client（人）なので assure。assure 人 that ~ = 人に〜だと保証する。ensure は人を目的語に取れず ensure that ~ の形（t65）。insure は保険。「人なら assure、事なら ensure」で即断できるようにする。訳：営業部長は顧客に、荷物は月曜に届くと保証した。" },
    { id: 't71', q: '------- the weather was poor, the outdoor concert went ahead as planned.', choices: ['Although', 'Despite', 'In spite of', 'Because of'], correct: 0,
      explain: "正解: Although。後ろが the weather was poor という「文（主語+動詞）」なので接続詞の although。despite / in spite of / because of はすべて前置詞で、後ろは名詞だけ（t12・t50・t62の逆パターン）。空所の後ろが文か名詞かで機械的に決める。訳：天気は悪かったが、屋外コンサートは予定通り行われた。" },
    { id: 't72', q: 'The new model is not only affordable ------- also easy to operate.', choices: ['but', 'and', 'or', 'so'], correct: 0,
      explain: "正解: but。not only A but also B = AだけでなくBも（セットで使う相関接続詞）。neither ... nor（t21）、either ... or（t52）、both ... and（t73）と同じファミリーで、片方を見たら相方を探すのがPart 5の鉄則。訳：新モデルは手頃なだけでなく、操作も簡単だ。" },
    { id: 't73', q: 'Both the CEO ------- the board members were present at the ceremony.', choices: ['and', 'or', 'nor', 'but'], correct: 0,
      explain: "正解: and。both A and B = AもBも両方（and とセット）。動詞が were（複数）になっているのもヒントで、both は必ず複数扱い。neither of なら単数扱い（t26 の has）だった点と対比して覚える。訳：CEOも役員も式典に出席していた。" },
    { id: 't74', q: 'The new software helps employees ------- customer orders more quickly.', choices: ['process', 'processing', 'processed', 'processes'], correct: 0,
      explain: "正解: process。help + 人 + 動詞の原形 = 人が〜するのを助ける。help employees process（従業員が処理するのを助ける）。t25 の help participants improve と同じ形で、-ing や過去形は入らない。訳：新しいソフトは従業員が顧客注文をより速く処理するのに役立つ。" },
    { id: 't75', q: 'The office manager had a technician ------- the copy machine yesterday.', choices: ['repair', 'to repair', 'repaired', 'repairing'], correct: 0,
      explain: "正解: repair。使役動詞 have + 人 + 動詞の原形 = 人に〜してもらう。目的語が a technician（人＝直す側）なので原形。もし目的語がモノなら have the machine repaired（過去分詞）になる。help（t25・t74）と同じ「原形をとる」仲間。訳：総務課長は昨日、技術者にコピー機を修理してもらった。" },
    { id: 't76', q: 'All visitors are required ------- in at the reception desk.', choices: ['to sign', 'sign', 'signing', 'signed'], correct: 0,
      explain: "正解: to sign。be required to + 動詞 = 〜することを求められる。require 人 to do の受け身形で、to が残る。t28 の be encouraged to attend と同じ形（be asked / advised / expected to do も同じ）。help や have は原形（t74・t75）、こちらは to 付き、と区別する。訳：来訪者は全員、受付で記帳する必要があります。" },
    { id: 't77', q: 'A special bonus was awarded to the team in ------- of their outstanding results.', choices: ['recognition', 'reception', 'reservation', 'reduction'], correct: 0,
      explain: "正解: recognition。in recognition of ~ = 〜を評価して、〜が認められて（表彰・昇進の定番表現）。t33 の be promoted in recognition of ~ と同じ。reception は受付・歓迎会、reservation は予約。訳：優れた成果が認められ、そのチームに特別ボーナスが授与された。" },
    { id: 't78', q: '------- receipt of your payment, we will ship your order immediately.', choices: ['Upon', 'During', 'While', 'Along'], correct: 0,
      explain: "正解: Upon。upon + 名詞 = 〜するとすぐに（t40 の upon arriving と同じ）。upon receipt of ~ = 〜を受け取り次第、はビジネス文の決まり文句で、receipt は「受領」の意味（t36）。while は接続詞なので後ろに文が必要。訳：ご入金を確認次第、ご注文の品を発送いたします。" },
    { id: 't79', q: 'The annual shareholders meeting will be held ------- May 15.', choices: ['on', 'in', 'at', 'to'], correct: 0,
      explain: "正解: on。日付・曜日には on（on May 15 / on Monday）。月・年は in（in May）、時刻は at（at 3 p.m.）。t24 の on the same day と同じルールで、「日にちが出たら on」と覚える。訳：年次株主総会は5月15日に開催される。" },
    { id: 't80', q: 'Online ticket sales have increased ------- since the campaign started.', choices: ['sharply', 'sharp', 'sharpness', 'sharpen'], correct: 0,
      explain: "正解: sharply（副詞）。動詞 increased を修飾するのは副詞。increase sharply（急増する）は業績報告の定番。t23 reviewed carefully と同じ「動詞は副詞が修飾」のパターン。訳：キャンペーン開始以降、オンラインのチケット販売は急増している。" },
    { id: 't81', q: 'The survey shows a ------- improvement in customer satisfaction.', choices: ['noticeable', 'noticeably', 'notice', 'noticing'], correct: 0,
      explain: "正解: noticeable（形容詞）。a ___ improvement は「冠詞+空所+名詞」なので形容詞が入る（t16 a strategic decision と同型）。noticeably は副詞、notice は名詞・動詞。空所の前後だけ見れば意味が分からなくても解ける典型問題。訳：調査は顧客満足度の目に見える改善を示している。" },
    { id: 't82', q: '------- you require further assistance, please contact our support team.', choices: ['Should', 'Would', 'Will', 'Unless'], correct: 0,
      explain: "正解: Should。Should you require ~ = If you should require ~ の if 省略・倒置形（もし〜が必要でしたら）。t19 の Should you have any questions と同じビジネスメール定番表現。unless は「〜でない限り」で意味が逆になる。訳：さらにサポートが必要でしたら、サポートチームまでご連絡ください。" },
    { id: 't83', q: 'Employees may use the parking lot ------- they register their vehicle in advance.', choices: ['as long as', 'in case of', 'due to', 'regardless of'], correct: 0,
      explain: "正解: as long as。後ろが they register ~ という文なので接続詞が必要。as long as ~ = 〜する限り、〜という条件で（t43 の provided that と同じ働き）。in case of / due to / regardless of はすべて前置詞で後ろは名詞のみ。訳：事前に車両を登録すれば、従業員は駐車場を利用できる。" },
    { id: 't84', q: 'Attendance at the afternoon workshop is -------, so employees may skip it if they are busy.', choices: ['optional', 'mandatory', 'compulsory', 'essential'], correct: 0,
      explain: "正解: optional。「欠席してよい」と続くので「任意の」。t35 の mandatory（必須の）の反対語で、mandatory = compulsory = required ⇔ optional という関係で整理する。訳：午後のワークショップへの出席は任意なので、忙しければ欠席してもよい。" },
    { id: 't85', q: 'Ms. Ito is in ------- of the overseas marketing division.', choices: ['charge', 'change', 'charged', 'charging'], correct: 0,
      explain: "正解: charge。be in charge of ~ = 〜を担当している、〜の責任者である。t10 の be responsible for ~ と同じ意味で、前置詞は of。in charge of（担当する側）と in the charge of（管理される側）の違いも余裕があれば。訳：伊藤さんは海外マーケティング部を担当している。" },
    { id: 't86', q: 'The company reported a ------- increase in overseas sales last quarter.', choices: ['substantial', 'substantially', 'substance', 'substantiate'], correct: 0,
      explain: "正解: substantial（形容詞）。a ___ increase は「冠詞+空所+名詞」なので形容詞が入る。t81（a noticeable improvement）と全く同じ形で、ここは2回続けて落としている最重要パターン。空所の直後が名詞なら形容詞、と機械的に決める。訳：その会社は前四半期、海外売上の大幅な増加を報告した。" },
    { id: 't87', q: 'The technician responded ------- to the customer complaint.', choices: ['promptly', 'prompt', 'promptness', 'prompted'], correct: 0,
      explain: "正解: promptly（副詞）。動詞 responded を修飾するのは副詞。respond promptly（迅速に対応する）。t80 increased sharply と同じで「動詞のうしろは副詞」。t86 の「名詞の前は形容詞」と対にして覚えると品詞問題は一瞬で解ける。訳：技術者は顧客の苦情に迅速に対応した。" },
    { id: 't88', q: 'The hotel is known for its ------- staff and excellent service.', choices: ['courteous', 'courteously', 'courtesy', 'court'], correct: 0,
      explain: "正解: courteous（形容詞）。its ___ staff は「所有格+空所+名詞」で、冠詞のときと同じく形容詞が入る。courteous = 礼儀正しい。所有格（its / their / our）も冠詞の仲間だと思えば t86 と同じ判断で解ける。訳：そのホテルは礼儀正しいスタッフと優れたサービスで知られている。" },
    { id: 't89', q: 'The assembly instructions were ------- written and easy to follow.', choices: ['clearly', 'clear', 'clarity', 'clarify'], correct: 0,
      explain: "正解: clearly（副詞）。were のあとだから形容詞、と早とちりしやすいが、修飾しているのは written（過去分詞＝動詞の仲間）なので副詞。were ___ written のように空所の後ろに過去分詞がある形は要注意。訳：組み立て説明書は分かりやすく書かれていて、理解しやすかった。" },
    { id: 't90', q: '------- the renovation is under way, the north entrance will be closed.', choices: ['While', 'During', 'Despite', 'Because of'], correct: 0,
      explain: "正解: While。後ろが the renovation is under way という「文」なので接続詞の while。during / despite / because of はすべて前置詞で後ろは名詞だけ。t83 と同じ判断（後ろが文か名詞か）で、ここは2回落としているので確実に。訳：改装工事の間、北口は閉鎖されます。" },
    { id: 't91', q: 'The main office will be closed ------- the national holiday.', choices: ['during', 'while', 'although', 'however'], correct: 0,
      explain: "正解: during。後ろが the national holiday という「名詞」なので前置詞の during。while は接続詞で後ろに文が必要（t90 の逆パターン）。during ⇔ while はセットで、後ろが名詞か文かだけを見る。訳：本社は祝日の間、閉鎖されます。" },
    { id: 't92', q: 'Please keep a copy of the receipt ------- you need to return the item.', choices: ['in case', 'in case of', 'in spite of', 'instead of'], correct: 0,
      explain: "正解: in case。in case + 文 = 〜する場合に備えて。of が付く in case of は前置詞で後ろは名詞のみ（in case of fire = 火事の場合）。t50 の in spite of と同じく「of が付いたら後ろは名詞」と覚える。訳：返品する場合に備えて、レシートの控えを保管してください。" },
    { id: 't93', q: 'The orientation will help new hires ------- the company systems more quickly.', choices: ['understand', 'understanding', 'understood', 'understands'], correct: 0,
      explain: "正解: understand。help + 人 + 動詞の原形。t25・t74 と同じ形だが、これは一度もマスターできていない最大の弱点。help のうしろに「人」が来たら、その次は必ず原形。-ing も過去形も入らない。訳：オリエンテーションは新入社員が会社のシステムをより早く理解するのに役立つ。" },
    { id: 't94', q: 'The supervisor let the team ------- an hour early on Friday.', choices: ['leave', 'to leave', 'leaving', 'left'], correct: 0,
      explain: "正解: leave。使役動詞 let + 人 + 動詞の原形 = 人に〜させてやる。let / make / have / help はどれも「人＋原形」の仲間（t74 help・t75 have）。to は付かないのが最大のポイント。訳：上司はチームを金曜日に1時間早く帰らせた。" },
    { id: 't95', q: 'All staff members are advised ------- their passwords every three months.', choices: ['to change', 'change', 'changing', 'changed'], correct: 0,
      explain: "正解: to change。be advised to + 動詞 = 〜するよう勧められる。t28 be encouraged to / t76 be required to と同じ受け身の形で、to が残る。「be + 過去分詞 + to do」なら to 付き、「help / let / have + 人」なら原形、と対で整理する。訳：全職員は3か月ごとにパスワードを変更するよう勧められている。" },
    { id: 't96', q: 'Please ------- that all confidential files are locked before you leave.', choices: ['ensure', 'assure', 'insure', 'reassure'], correct: 0,
      explain: "正解: ensure。後ろが that節（人ではない）なので ensure that ~ = 〜を確実にする。t31・t65 と同じ形で、t65 はまだ一度もマスターできていない。「that が続いたら ensure、人が続いたら assure」で機械的に判断する。訳：退出前に、機密ファイルがすべて施錠されていることを確認してください。" },
    { id: 't97', q: 'We would like to ------- our customers of our commitment to quality.', choices: ['assure', 'ensure', 'insure', 'secure'], correct: 0,
      explain: "正解: assure。assure 人 of ~ = 人に〜を保証する（assure 人 that ~ と同じ仲間で、目的語が「人」）。空所の直後が our customers（人）なので assure。ensure は人を目的語に取れない。assure には「人 of ~」と「人 that ~」の2つの型がある。訳：当社は品質へのこだわりをお客様に保証したいと考えています。" },
    { id: 't98', q: 'Despite the economic downturn, the company profits remained -------.', choices: ['steady', 'steadily', 'steadiness', 'steadied'], correct: 0,
      explain: "正解: steady（形容詞）。remain + 形容詞 = 〜のままである。t14 remain open / t46 remain stable / t66 remain confidential と同じ形で、通算7回以上落としている最頻出の弱点。remain のうしろに -ly は絶対に入らない。訳：景気後退にもかかわらず、その会社の利益は安定したままだった。" },
    { id: 't99', q: 'Please keep the contents of this document ------- until the official announcement.', choices: ['confidential', 'confidentially', 'confidentiality', 'confide'], correct: 0,
      explain: "正解: confidential（形容詞）。keep + 目的語 + 形容詞 = 〜を…の状態に保つ。t61 keep the room clean / t68 keep the exits clear と同じ形。remain（t98）と keep は「うしろが形容詞」の同じファミリーだと束ねて覚える。訳：正式発表まで、この書類の内容は秘密にしておいてください。" },
    { id: 't100', q: 'The library will stay ------- to students during the renovation.', choices: ['accessible', 'accessibly', 'access', 'accessing'], correct: 0,
      explain: "正解: accessible（形容詞）。stay + 形容詞 = 〜のままでいる。t47 stay open / t67 stay competitive と同じ形。accessible = 利用できる（t08 の access は動詞）。remain / stay / keep / become の4つは全部うしろが形容詞。訳：改装中も図書館は学生が利用できる状態を保ちます。" },
    { id: 't101', q: 'Members may attend the annual seminar ------- no cost.', choices: ['at', 'in', 'for', 'on'], correct: 0,
      explain: "正解: at。at no cost = 無料で。t59 at no additional cost（通算3回ミスで最多）、t63 at no extra charge、t69 at no additional charge と全部同じ。「無料・料金の話が出たら at」と丸ごと固めてしまう。訳：会員は年次セミナーに無料で参加できます。" },
    { id: 't102', q: 'A commemorative plaque was presented to Mr. Ito in ------- of his 30 years of service.', choices: ['recognition', 'reception', 'registration', 'reduction'], correct: 0,
      explain: "正解: recognition。in recognition of ~ = 〜を評価して、〜が認められて。t33・t77 と同じ表彰・昇進の定番表現で、t77 はまだマスターできていない。in appreciation of（〜に感謝して）も同じ場面で使う。訳：伊藤さんの30年の勤続を称え、記念の盾が贈られた。" },
    { id: 't103', q: 'Wearing a helmet in the construction area is -------; there are no exceptions.', choices: ['mandatory', 'optional', 'tentative', 'flexible'], correct: 0,
      explain: "正解: mandatory。「例外はない」と続くので「必須の」。t84 の optional（任意の）の逆方向の問題で、mandatory = compulsory = required ⇔ optional = voluntary という対で整理する。訳：工事区域でのヘルメット着用は必須であり、例外はない。" }
  ]
};

const TOTAL = QUESTIONS.vocab.length + QUESTIONS.phrase.length + QUESTIONS.grammar.length + SPEAKING.length;
document.getElementById('total-badge').textContent = TOTAL + '問';

const MASTERY_THRESHOLD = 3;

let state = { mode: null, questions: [], idx: 0, score: 0, answered: false, picked: -1, revealed: false, history: [] };
let stats = { played: 0, best: 0, totalCorrect: 0 };
let mastery = {}; // {id: streak}
let wrongCount = {}; // {id: 累計間違い回数}

function loadData() {
  try {
    const s = localStorage.getItem('eng-quiz-stats');
    if (s) stats = JSON.parse(s);
  } catch (e) {}
  try {
    const m = localStorage.getItem('eng-quiz-mastery');
    if (m) mastery = JSON.parse(m);
  } catch (e) {}
  try {
    const w = localStorage.getItem('eng-quiz-wrong');
    if (w) wrongCount = JSON.parse(w);
  } catch (e) {}
}

function saveStats() {
  try { localStorage.setItem('eng-quiz-stats', JSON.stringify(stats)); } catch (e) {}
}
function saveMastery() {
  try { localStorage.setItem('eng-quiz-mastery', JSON.stringify(mastery)); } catch (e) {}
}
function saveWrongCount() {
  try { localStorage.setItem('eng-quiz-wrong', JSON.stringify(wrongCount)); } catch (e) {}
}

function resetMastery() {
  if (confirm('マスター記録（連続正解の進捗）をリセットしますか？\nスコア記録は残ります。')) {
    mastery = {};
    saveMastery();
    render();
  }
}

// 記録をコード化（デバイス間共有用）
function makeSyncCode() {
  const data = { v: 2, mastery, stats, wrongCount };
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

function applySyncCode(code) {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!data || (!data.mastery && !data.stats)) throw new Error('invalid');
    let importedMastered = 0, currentMastered = 0;
    const allIds = [...QUESTIONS.vocab, ...QUESTIONS.phrase, ...QUESTIONS.grammar].map(q => q.id);
    if (data.mastery) {
      allIds.forEach(id => { if ((data.mastery[id]||0) >= MASTERY_THRESHOLD) importedMastered++; });
      allIds.forEach(id => { if ((mastery[id]||0) >= MASTERY_THRESHOLD) currentMastered++; });
    }
    const msg = `読み込むと、今の記録は上書きされます。\n\n読み込むコードのマスター数: ${importedMastered}問\n今の端末のマスター数: ${currentMastered}問\n\n続けますか？`;
    if (!confirm(msg)) return;
    if (data.mastery) { mastery = data.mastery; saveMastery(); }
    if (data.stats) { stats = data.stats; saveStats(); }
    if (data.wrongCount) { wrongCount = data.wrongCount; saveWrongCount(); }
    // v1の古いコード（wrongCountなし）の場合は、今の端末のwrongCountをそのまま維持
    state.mode = null;
    render();
    alert('記録を読み込みました！🎉');
  } catch (e) {
    alert('コードが正しくないようです。コード全体をコピーできているか確認してください。');
  }
}

function openSync() { state.mode = 'sync'; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function getStreak(id) { return mastery[id] || 0; }
function isMastered(id) { return getStreak(id) >= MASTERY_THRESHOLD; }

function getAvailable(category) {
  if (category === 'speak') return SPEAKING;
  return QUESTIONS[category].filter(q => !isMastered(q.id));
}

function getMasteryStats() {
  const all = [...QUESTIONS.vocab, ...QUESTIONS.phrase, ...QUESTIONS.grammar];
  const mastered = all.filter(q => isMastered(q.id)).length;
  return { mastered, total: all.length, pct: Math.round(mastered / all.length * 100) };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 出題のたびに選択肢をシャッフルし、正解位置をばらけさせる
// 「どちらも〜」のような他の選択肢を参照するメタ選択肢は最後に固定する
function shuffleChoices(q) {
  const correctText = q.choices[q.correct];
  const metaPattern = /どちらも|両方|いずれも/;
  const movable = q.choices.filter(c => !metaPattern.test(c));
  const fixed = q.choices.filter(c => metaPattern.test(c));
  const newChoices = [...shuffle(movable), ...fixed];
  return { ...q, choices: newChoices, correct: newChoices.indexOf(correctText) };
}

function startMode(mode) {
  if (mode === 'speak') {
    const list = shuffle(SPEAKING).slice(0, Math.min(10, SPEAKING.length));
    state = { mode, questions: list, idx: 0, score: 0, answered: false, picked: -1, revealed: false, history: [] };
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const available = getAvailable(mode);
  if (available.length === 0) {
    alert('このカテゴリは全問マスター済みです！🎉\nマスター記録をリセットすると再挑戦できます。');
    return;
  }
  const limit = 10;
  const qs = shuffle(available).slice(0, Math.min(limit, available.length)).map(shuffleChoices);
  state = { mode, questions: qs, idx: 0, score: 0, answered: false, picked: -1, revealed: false, history: [] };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pick(i) {
  if (state.answered) return;
  state.answered = true;
  state.picked = i;
  const q = state.questions[state.idx];
  const ok = i === q.correct;
  if (ok) state.score++;
  
  // Update mastery
  const prevStreak = getStreak(q.id);
  const newStreak = ok ? prevStreak + 1 : 0;
  mastery[q.id] = newStreak;
  saveMastery();
  if (!ok) {
    wrongCount[q.id] = (wrongCount[q.id] || 0) + 1;
    saveWrongCount();
  }
  
  state.history.push({
    q: q.q, picked: q.choices[i], correct: q.choices[q.correct], ok, explain: q.explain,
    prevStreak, newStreak, justMastered: ok && newStreak === MASTERY_THRESHOLD
  });
  render();
  if (navigator.vibrate) navigator.vibrate(ok ? 20 : [10, 30, 10]);
}

function reveal() {
  state.revealed = true;
  render();
}

function next() {
  state.idx++;
  state.answered = false;
  state.picked = -1;
  state.revealed = false;
  if (state.idx >= state.questions.length && state.mode !== 'speak') {
    stats.played++;
    stats.totalCorrect += state.score;
    const pct = Math.round(state.score / state.questions.length * 100);
    if (pct > stats.best) stats.best = pct;
    saveStats();
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  state.mode = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const r = document.getElementById('root');
  if (state.mode === 'sync') r.innerHTML = renderSync();
  else if (state.mode === null) r.innerHTML = renderHome();
  else if (state.idx >= state.questions.length) r.innerHTML = state.mode === 'speak' ? renderSpeakResult() : renderResult();
  else if (state.mode === 'speak') r.innerHTML = renderSpeak();
  else r.innerHTML = renderQuestion();
  attach();
}

function renderQuestion() {
  const q = state.questions[state.idx];
  const total = state.questions.length;
  const pct = Math.round((state.idx) / total * 100);
  const modeName = { vocab: '単語', phrase: 'フレーズ', grammar: '文法' }[state.mode];
  const streak = getStreak(q.id);
  const streakTag = streak > 0 ? `<span class="q-mastery-tag">連続正解 ${streak}/${MASTERY_THRESHOLD}</span>` : '';
  
  let choicesHTML = q.choices.map((c, i) => {
    let cls = 'choice';
    if (state.answered) {
      if (i === q.correct) cls += ' correct';
      else if (i === state.picked) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-pick="${i}" ${state.answered ? 'disabled' : ''}>${esc(c)}</button>`;
  }).join('');
  
  let fbHTML = '';
  if (state.answered) {
    const ok = state.picked === q.correct;
    const last = state.history[state.history.length - 1];
    let masteryNote = '';
    if (ok) {
      if (last.justMastered) {
        masteryNote = `<span class="fb-mastery">🎉 マスター達成！この問題はもう出題されません。</span>`;
      } else {
        masteryNote = `<span class="fb-mastery">連続正解 ${last.newStreak}/${MASTERY_THRESHOLD} ${last.newStreak >= 1 && last.newStreak < MASTERY_THRESHOLD ? '（あと ' + (MASTERY_THRESHOLD - last.newStreak) + ' 回でマスター）' : ''}</span>`;
      }
    } else if (last.prevStreak > 0) {
      masteryNote = `<span class="fb-mastery">連続正解はリセットされました（${last.prevStreak} → 0）</span>`;
    }
    fbHTML = `
      <div class="feedback ${ok ? 'ok' : 'ng'}">
        <div class="fb-label">${ok ? '✓ 正解！' : '✗ 残念...'}</div>
        ${esc(q.explain)}
        ${masteryNote}
      </div>
      <button class="btn btn-primary" id="nextBtn">${state.idx + 1 === total ? '結果を見る' : '次の問題へ'}</button>
    `;
  }
  
  return `
    <div class="q-head">
      <span>${modeName} · ${state.idx + 1} / ${total}</span>
      <span class="streak">🔥 ${state.score}</span>
    </div>
    <div class="q-progress"><div class="q-progress-fill" style="width: ${pct}%"></div></div>
    <p class="q-text">${esc(q.q)}${streakTag}</p>
    <p class="q-hint">4つの中から1つ選んでください</p>
    <div class="choices">${choicesHTML}</div>
    ${fbHTML}
    <button class="btn" id="homeBtn" style="margin-top: 16px;">ホームに戻る</button>
  `;
}

}

  return `

    </div>
    <div class="review">
      <div class="review-h">今回の10文</div>
      ${listHTML}
    </div>
  `;
}

function renderResult() {
  const total = state.questions.length;
  const pct = Math.round(state.score / total * 100);
  const newMasters = state.history.filter(h => h.justMastered).length;
  let msg;
  if (pct === 100) msg = 'パーフェクト！すばらしい！🎉';
  else if (pct >= 80) msg = 'よくできました！もう少しで満点だね';
  else if (pct >= 60) msg = 'いい調子！間違えた問題を見直そう';
  else msg = '解説を読んでじっくり復習しよう';
  
  const reviewHTML = state.history.map(h => `
    <div class="review-item">
      <div><span class="review-mark">${h.ok ? '✓' : '✗'}</span>${esc(h.q)}${h.justMastered ? ' <span class="q-mastery-tag">マスター達成！</span>' : ''}</div>
      ${!h.ok ? `<div class="review-correct">正解: ${esc(h.correct)}</div>` : ''}
    </div>
  `).join('');
  
  const masterMsg = newMasters > 0 ? `<div class="score-msg" style="color: #C0DD97; font-weight: 600;">🏆 新たに ${newMasters} 問マスター達成！</div>` : '';
  
  return `
    <p style="text-align:center; font-size:14px; color:#a8a59c; margin:0;">結果</p>
    <div class="score-num">${state.score} / ${total}</div>
    <div class="score-msg">${msg}<br>正答率 ${pct}%</div>
    ${masterMsg}
    <div class="btn-row">
      <button class="btn btn-primary" id="retryBtn">もう一度</button>
      <button class="btn" id="homeBtn">ホームに戻る</button>
    </div>
    <div class="review">
      <div class="review-h">問題を振り返る</div>
      ${reviewHTML}
    </div>
  `;
}

function attach() {
  document.querySelectorAll('[data-mode]').forEach(b => {
    if (b.disabled) return;
    b.onclick = () => startMode(b.dataset.mode);
  });
  document.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => pick(parseInt(b.dataset.pick));
  });
  const rvb = document.getElementById('revealBtn'); if (rvb) rvb.onclick = reveal;
  const nb = document.getElementById('nextBtn'); if (nb) nb.onclick = next;
  const hb = document.getElementById('homeBtn'); if (hb) hb.onclick = goHome;
  const rb = document.getElementById('retryBtn'); if (rb) rb.onclick = () => {
    const m = state.mode;
    const available = getAvailable(m);
    if (available.length === 0) { goHome(); return; }
    startMode(m);
  };
  const resetB = document.getElementById('resetBtn'); if (resetB) resetB.onclick = resetMastery;
  const syncB = document.getElementById('syncBtn'); if (syncB) syncB.onclick = openSync;
  const copyB = document.getElementById('copyBtn');
  if (copyB) copyB.onclick = () => {
    const ta = document.getElementById('exportArea');
    ta.select();
    ta.setSelectionRange(0, 99999);
    const done = () => { copyB.textContent = '✓ コピーしました！'; setTimeout(() => { copyB.textContent = '📋 コードをコピー'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done).catch(() => { try { document.execCommand('copy'); done(); } catch(e){} });
    } else {
      try { document.execCommand('copy'); done(); } catch(e){}
    }
  };
  const importB = document.getElementById('importBtn');
  if (importB) importB.onclick = () => {
    const ta = document.getElementById('importArea');
    if (!ta.value.trim()) { alert('コードを貼り付けてください。'); return; }
    applySyncCode(ta.value);
  };
  const importArea = document.getElementById('importArea');
  if (importArea) {
    // 貼り付けたら自動で読み込み確認（ボタンを押さなくてもOK）
    importArea.onpaste = () => {
      setTimeout(() => { if (importArea.value.trim()) applySyncCode(importArea.value); }, 120);
    };
  }
}

loadData();
render();
</script>
</body>
</html>
